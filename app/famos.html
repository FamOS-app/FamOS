<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.bunny.net; font-src https://fonts.bunny.net; img-src data:; manifest-src blob: data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FamOS</title>
<meta name="theme-color" content="#F4EDE1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FamOS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23F4EDE1'/%3E%3Ctext x='90' y='118' font-size='88' text-anchor='middle'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E">
<!-- Bunny Fonts — DSGVO-konform -->
<link href="https://fonts.bunny.net/css?family=andika:400,700&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--text)}
button{font-family:var(--font);cursor:pointer;border:none}
input{font-family:var(--font)}
:root{
  /* Palette: Terracotta Rust AE5238 · Mustard Yellow D39B32 · Deep Teal 225D65 · Olive Green 5C633E · Warm Cream E3D8C6 */
  --bg:#F4EDE1;--bg2:#E3D8C6;--card:#FFFDF8;--border:#D3C6B0;
  --text:#2A2B24;--muted:#625C4E;--subtle:#857D6C;--on:#FFFFFF;
  --pri:#225D65;
  --acc-a:#AE5238;--acc-b:#225D65;--acc-c:#5C633E;--acc-d:#B27D1A;--acc-e:#7A3B2E;
  --green:#5C633E;--gold:#D39B32;--gold-ink:#855B0A;
  --font:'Andika','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --sh:0 2px 12px rgba(60,45,20,.08);--sh2:0 4px 24px rgba(60,45,20,.14);--r:14px;
}

/* ── LAYOUT ──────────────────────────────── */
.wrap{max-width:440px;margin:0 auto;padding:14px 14px calc(72px + env(safe-area-inset-bottom,0px))}

/* ── HEADER ──────────────────────────────── */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0 20px}
.hdr-title{font-family:var(--font);font-weight:700;font-size:1.55rem;color:var(--text);line-height:1}
.hdr-date{font-size:.75rem;font-weight:700;color:var(--muted);margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
.gear-btn{background:none;padding:8px 10px;border-radius:10px;color:var(--subtle);font-size:1rem;border:1.5px solid var(--border);transition:all .2s}
.gear-btn:active{background:var(--bg2)}

/* ── KID TABS ────────────────────────────── */
.kid-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--bg2);border-radius:20px;padding:4px}
.kid-tab{flex:1;padding:10px 8px;border-radius:16px;background:transparent;font-weight:800;font-size:.86rem;color:var(--subtle);transition:all .28s cubic-bezier(.34,1.4,.64,1);display:flex;align-items:center;justify-content:center;gap:6px}
.kid-tab .av{font-size:1.3rem;transition:transform .28s cubic-bezier(.34,1.4,.64,1);line-height:1}
.kid-tab.on{background:var(--card);box-shadow:var(--sh);color:var(--text)}
.kid-tab.on .av{transform:scale(1.12)}
.ca{--kc:var(--acc-a)}.cb{--kc:var(--acc-b)}.cc{--kc:var(--acc-c)}.cd{--kc:var(--acc-d)}.ce{--kc:var(--acc-e)}
.kid-tab.on{color:var(--kc,var(--text))}

/* ── BOTTOM NAV ──────────────────────────── */
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(10px);border-top:1.5px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bot-nav-inner{display:flex;width:100%;max-width:440px}
.wrap.no-nav{padding-bottom:28px}
.bni{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--subtle);font-weight:800;font-size:.75rem;letter-spacing:.2px;text-transform:uppercase;transition:color .2s;border:none}
.bni-em{font-size:1.2rem;line-height:1;transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
.bni.on{color:var(--pri)}
.bni.on .bni-em{transform:scale(1.18)}

/* ── RT PILLS ────────────────────────────── */
.rt-pills{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.rt-pills::-webkit-scrollbar{display:none}
.rt-pill{flex-shrink:0;padding:6px 14px;border-radius:99px;background:transparent;border:1.5px solid var(--border);font-weight:700;font-size:.82rem;color:var(--muted);transition:all .2s}
.rt-pill.on{border-color:transparent;background:var(--pri);color:var(--on)}

/* ── PROGRESS ────────────────────────────── */
.prog{margin-bottom:20px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.prog-label{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.prog-frac{font-family:var(--font);font-weight:700;font-size:1rem;color:var(--text)}
.prog-track{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:var(--pri);transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-fill.done-fill{background:var(--green)}
.s-lbl{font-size:.75rem;font-weight:800;color:var(--subtle);letter-spacing:.5px;text-transform:uppercase;padding:4px 2px 8px;margin-top:4px}

/* ── TASK CARD ───────────────────────────── */
.tc{background:var(--card);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);cursor:pointer;border:1.5px solid var(--border);transition:all .22s cubic-bezier(.34,1.3,.64,1);user-select:none;margin-bottom:8px}
.tc:active{transform:scale(.975)}
.tc.done{background:var(--bg);border-color:var(--border)}
.tc.done .t-lbl{text-decoration:line-through;color:var(--subtle)}
.tc.done .t-sub{color:var(--subtle)}
.t-em{font-size:1.5rem;width:36px;text-align:center;flex-shrink:0;transition:transform .3s cubic-bezier(.34,1.4,.64,1);line-height:1}
.tc.done .t-em{transform:scale(1.15) rotate(5deg);filter:grayscale(.4)}
.t-body{flex:1;min-width:0}
.t-lbl{font-weight:800;font-size:.92rem;color:var(--text);transition:color .2s}
.t-sub{font-size:.75rem;font-weight:600;color:var(--muted);margin-top:2px}
.t-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .28s cubic-bezier(.34,1.4,.64,1);font-size:.8rem;color:var(--on)}
.tc.done .t-chk{background:var(--kc,var(--green));border-color:var(--kc,var(--green));box-shadow:0 0 0 3px color-mix(in srgb,var(--kc,var(--green)) 18%,transparent)}

/* ── BROT / WAHL ─────────────────────────── */
.brot{background:var(--card);border-radius:var(--r);padding:13px 14px;border:1.5px solid var(--border);box-shadow:var(--sh);margin-bottom:8px}
.brot-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brot-t{font-weight:800;font-size:.92rem;color:var(--text)}.brot-s{font-size:.75rem;color:var(--muted);margin-top:1px;font-weight:600}
.brot-row{display:flex;gap:7px}
.brot-btn{flex:1;padding:9px;border-radius:10px;font-weight:800;font-size:.86rem;background:var(--bg2);color:var(--muted);border:1.5px solid var(--border);transition:all .2s}
.brot-btn:active{transform:scale(.96)}
.brot-btn.sel-ja{background:var(--gold);border-color:var(--gold);color:var(--text)}
.brot-btn.sel-nein{background:var(--pri);border-color:var(--pri);color:var(--on)}
.brot-ans{margin-top:8px;font-size:.76rem;font-weight:700;color:var(--muted);text-align:center;min-height:16px}
.brot-ans.loud{color:var(--gold-ink)}
.wahl{background:var(--card);border-radius:var(--r);padding:13px 14px;border:1.5px solid var(--border);box-shadow:var(--sh);margin-bottom:8px}
.wahl-t{font-weight:800;font-size:.92rem;color:var(--text);margin-bottom:3px}
.wahl-s{font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:10px}
.wi{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;margin-bottom:6px}
.wi:last-child{margin-bottom:0}
.wi:active{transform:scale(.975)}
.wi.sel{border-color:var(--acc-b);background:color-mix(in srgb,var(--acc-b) 10%,var(--card))}
.wi.sel .wi-chk{background:var(--acc-b);border-color:var(--acc-b);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-b) 18%,transparent)}
.wi.done-item{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--card))}
.wi.done-item .wi-lbl{text-decoration:line-through;color:var(--subtle)}
.wi.done-item .wi-chk{background:var(--green);border-color:var(--green)}
.wi-em{font-size:1.35rem;flex-shrink:0;line-height:1}.wi-lbl{flex:1;font-weight:800;font-size:.88rem;color:var(--text)}
.wi.faded{opacity:.35;cursor:default}
.wi-chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--on);transition:all .25s}

/* ── STUNDENPLAN VIEW ────────────────────── */
.sp-days{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.sp-days::-webkit-scrollbar{display:none}
.sp-day{flex-shrink:0;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-weight:800;font-size:.82rem;color:var(--muted);transition:all .2s;text-align:center;box-shadow:var(--sh)}
.sp-day.is-today{border-color:var(--acc-a);color:var(--acc-a)}
.sp-day.on{border-color:var(--pri);background:var(--pri);color:var(--on)}
.sp-day.is-today.on{border-color:var(--acc-a);background:var(--acc-a);color:var(--on)}
.sp-today-badge{display:block;font-size:.7rem;font-weight:800;letter-spacing:.2px;opacity:.8;margin-top:1px}
.sp-entry{background:var(--card);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);box-shadow:var(--sh);margin-bottom:8px}
.sp-em{font-size:1.45rem;width:36px;text-align:center;flex-shrink:0;line-height:1}
.sp-lbl{font-weight:800;font-size:.92rem;color:var(--text)}
.sp-time{font-size:.75rem;font-weight:600;color:var(--muted);margin-top:2px}
.sp-empty{text-align:center;padding:32px 20px;color:var(--muted);font-weight:700;font-size:.88rem;line-height:1.6}
.move-btn{background:none;border:1.5px solid var(--border);border-radius:6px;font-size:.75rem;color:var(--muted);padding:3px 5px;line-height:1;transition:all .15s;display:block}
.move-btn:active{background:var(--bg2);color:var(--text)}
.move-btn[disabled]{opacity:.2;cursor:default}

/* ── TASCHENGELD VIEW ────────────────────── */
.tg-kw{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:16px}
.tg-card{background:var(--card);border-radius:var(--r);border:1.5px solid var(--border);box-shadow:var(--sh);padding:16px 14px;margin-bottom:12px}
.tg-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.tg-betrag{font-family:var(--font);font-weight:700;font-size:1.8rem;color:var(--text);line-height:1}
.tg-betrag-lbl{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.tg-week-lbl{font-size:.75rem;font-weight:700;color:var(--muted);text-align:right;line-height:1.5}
.tg-btns{display:flex;gap:8px;margin-bottom:12px}
.tg-btn{flex:1;padding:11px 8px;border-radius:11px;font-weight:800;font-size:.86rem;background:var(--bg2);color:var(--muted);border:1.5px solid var(--border);transition:all .2s cubic-bezier(.34,1.3,.64,1);display:flex;flex-direction:column;align-items:center;gap:3px}
.tg-btn .tg-btn-em{font-size:1.3rem;line-height:1}
.tg-btn:active{transform:scale(.97)}
.tg-btn.on-ausg{background:var(--green);border-color:var(--green);color:var(--on);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.tg-btn.on-spar{background:var(--acc-e);border-color:var(--acc-e);color:var(--on);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-e) 18%,transparent)}
.tg-status{font-size:.77rem;font-weight:700;text-align:center;min-height:17px;color:var(--muted);margin-bottom:12px}
.tg-pig{background:var(--bg2);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--border)}
.tg-pig-em{font-size:1.8rem;line-height:1}
.tg-pig-info{flex:1}
.tg-pig-lbl{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.tg-pig-amt{font-family:var(--font);font-weight:700;font-size:1.35rem;color:var(--text)}
.tg-acts{display:flex;gap:8px;margin-top:10px}
.tg-act{flex:1;padding:10px 8px;border-radius:10px;font-weight:800;font-size:.84rem;transition:all .2s;border:1.5px solid var(--border);background:var(--card);color:var(--text)}
.tg-act:active{transform:scale(.97)}
.tg-act.ein{background:var(--pri);border-color:var(--pri);color:var(--on)}
.tg-act:disabled,.tg-act[disabled]{background:var(--bg2);color:var(--subtle);cursor:default;transform:none}
.tg-hist{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--border)}
.tg-hist-t{font-size:.75rem;font-weight:800;color:var(--subtle);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.tg-h-row{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:.8rem;font-weight:700}
.tg-h-date{color:var(--subtle);font-size:.75rem;width:38px;flex-shrink:0}
.tg-h-note{flex:1;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-h-amt{font-family:var(--font);font-weight:700;font-size:.92rem;flex-shrink:0}
.tg-h-amt.plus{color:var(--green)}
.tg-h-amt.minus{color:var(--acc-a)}
.quick-all{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-weight:800;font-size:.76rem;color:var(--muted);margin-top:6px}
.quick-all:active{background:var(--bg2)}
.tg-inactive{text-align:center;padding:40px 20px;color:var(--muted);font-weight:700;font-size:.88rem;line-height:1.6}

/* ── MISC ────────────────────────────────── */
.add-tc{background:transparent;border:1.5px dashed var(--border);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:.86rem;width:100%;margin-bottom:8px;transition:all .2s}
.add-tc:active{background:var(--bg2)}
.reset-btn{display:block;width:100%;margin-top:14px;padding:11px;background:transparent;border:1.5px solid var(--border);border-radius:var(--r);font-weight:700;font-size:.82rem;color:var(--subtle);transition:all .2s}
.reset-btn{color:var(--muted);min-height:46px}
.reset-btn:hover{border-color:var(--acc-a);color:var(--acc-a)}
.install-hint{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:14px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh)}
.install-hint-txt{flex:1;font-size:.76rem;color:var(--muted);font-weight:700;line-height:1.5}
.install-hint-txt strong{color:var(--text)}
.install-close{background:none;color:var(--subtle);font-size:.95rem;padding:4px 6px}

/* ── DONE OVERLAY ────────────────────────── */
.done-ov{display:none;position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 96%,transparent);z-index:300;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.done-ov.show{display:flex}
.done-em{font-size:76px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);margin-bottom:8px}
.done-stars{display:flex;gap:8px;margin-bottom:16px}
.done-star{font-size:1.5rem;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both}
.done-star:nth-child(2){animation-delay:.08s}.done-star:nth-child(3){animation-delay:.16s}
.done-ov h2{font-family:var(--font);font-weight:700;font-size:2rem;color:var(--text);margin-bottom:6px}
.done-ov p{font-weight:700;color:var(--muted);font-size:.95rem}
.done-cls{margin-top:28px;background:var(--pri);color:var(--on);padding:13px 36px;border-radius:99px;font-family:var(--font);font-weight:700;font-size:1.1rem;box-shadow:var(--sh2)}
.done-cls:active{transform:scale(.96)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:299;overflow:hidden}
.c{position:absolute;animation:cfall linear forwards}
@keyframes cfall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes popIn{from{transform:scale(0) rotate(-8deg)}to{transform:scale(1) rotate(0)}}

/* ── ADMIN ───────────────────────────────── */
.adm{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.4,0,.2,1);overflow:hidden}
.adm.open{transform:translateX(0)}
.adm-hdr{background:var(--card);padding:16px 14px 0;border-bottom:1.5px solid var(--border);flex-shrink:0}
.adm-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.adm-back{background:none;font-size:.85rem;font-weight:800;color:var(--muted);padding:6px 10px;border-radius:8px;border:1.5px solid var(--border)}
.adm-back:active{background:var(--bg2)}
.adm-title{font-family:var(--font);font-weight:700;font-size:1.2rem;color:var(--text);flex:1}
.adm-tabbar{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.adm-tabbar::-webkit-scrollbar{display:none}
.adm-tab{flex-shrink:0;padding:10px 14px;background:none;font-size:.77rem;font-weight:800;color:var(--subtle);border-bottom:2.5px solid transparent;letter-spacing:.2px;transition:all .2s;white-space:nowrap}
.adm-tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.adm-body{flex:1;overflow-y:auto;padding:14px}
.al{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ai{background:var(--card);border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:11px;border:1.5px solid var(--border)}
.ai-em{font-size:1.4rem;flex-shrink:0;line-height:1}
.ai-info{flex:1;min-width:0}
.ai-main{font-weight:800;font-size:.9rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-sub{font-size:.75rem;color:var(--muted);margin-top:1px}
.ai-badge{font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--muted);flex-shrink:0;border:1px solid var(--border)}
.ai-edit{background:none;font-size:.9rem;color:var(--subtle);padding:5px 6px;transition:color .15s}
.ai-del{background:none;font-size:.9rem;color:var(--subtle);padding:5px 6px;transition:color .15s}
.ai-edit:active{color:var(--acc-b)}.ai-del:active{color:var(--acc-a)}
.aa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1.5px dashed var(--border);background:transparent;border-radius:var(--r);font-weight:800;font-size:.86rem;color:var(--muted);transition:all .2s}
.aa:active{background:var(--bg2)}
.tog-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:12px 13px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid var(--border)}
.tog-l{font-weight:800;font-size:.88rem;color:var(--text)}.tog-s{font-size:.75rem;color:var(--muted);margin-top:2px}
.tog{width:40px;height:22px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--border);position:relative;transition:all .28s;flex-shrink:0;cursor:pointer}
.tog.on{background:var(--pri);border-color:var(--pri)}

/* ── EMOJI PICKER ────────────────────────── */

.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font:inherit;font-size:1rem;font-weight:600;color:var(--text);background:var(--bg);outline:none;resize:vertical;min-height:110px;line-height:1.5}

<script>
// ═══ CONSTANTS ════════════════════════════════
const EC=[
  {id:'dinos',l:'🦕 Dinos',e:['🦕','🦖','🐉','🐲','🦎','🐊','🐢','🦏','🐍','🦴','🥚','🌋','🪨','🌿','💀','👾','🔮','⚔️','🛡️','🌑','🌪️','🔥','💥','✨','🌊','🏔️','🦋','🕷️','🦂','🐛']},
  {id:'haus',l:'🏠 Haus',e:['🧹','🧺','🫧','🧴','🗑️','🍽️','🥄','🍴','🧽','🪣','🛒','🛏️','🪥','🧻','🪞','🪑','🚪','🪟','🌿','🪴']},
  {id:'schul',l:'🎒 Schule',e:['📚','📖','✏️','🎒','📐','📏','✂️','🖊️','📓','📝','🖍️','🔬','🎨','📎','📌','📒','🗒️','📋','🖼️','🔭','🔤','➕','➗','✖️','🌍','🎵','⚽','🏊','🤸','🎤']},
  {id:'koerp',l:'🦷 Körper',e:['🦷','🚽','🛁','💊','😴','💪','🏃','🚿','🧖','👣','💤','🩺','🤸','🧘','🏊','🚴','🏋️','🤺','⛹️','🤾']},
  {id:'essen',l:'🍳 Essen',e:['🍳','🥣','🍞','🥤','🍎','🥛','🧃','🍌','🥐','🍓','🍉','🥦','🥕','🫐','🍇','🥚','🧇','🥞','🍪','🍫']},
  {id:'kleid',l:'👕 Kleidung',e:['👕','👖','🧥','👟','🧦','👗','🎩','🧤','👒','🧣','👚','🩴','👜','🕶️','⌚','🎽','🩳','🩱','👘','🎀']},
  {id:'tiere',l:'🐶 Tiere',e:['🐶','🐱','🐸','🦊','🐻','🐼','🦁','🐯','🐨','🐮','🐷','🐙','🦈','🦜','🦔','🐧','🦢','🦩','🐺','🦝']},
  {id:'mehr',l:'⭐ Mehr',e:['⭐','🌟','🏆','💪','🚀','🌈','☀️','🎉','❤️','💛','💚','💙','🦄','🌸','🌺','🌻','🍀','🌙','⚡','💫','✨','🎊','🎈','🎁','🪄','💎','🔑','🎵','🎶','🏠']},
];
const COLORS={a:{label:'Terracotta'},b:{label:'Petrol'},c:{label:'Oliv'},d:{label:'Senf'},e:{label:'Kastanie'}};
const DAYS=[{id:'mo',s:'Mo',l:'Montag'},{id:'di',s:'Di',l:'Dienstag'},{id:'mi',s:'Mi',l:'Mittwoch'},{id:'do',s:'Do',l:'Donnerstag'},{id:'fr',s:'Fr',l:'Freitag'},{id:'sa',s:'Sa',l:'Samstag'},{id:'so',s:'So',l:'Sonntag'}];

// ═══ DEFAULT CONFIG ════════════════════════════
// <<SEED-START>> Neutrale Startdaten. Familiendaten kommen per Import (später Supabase), nie in den Code.
const DEF={
  household:null,
  kids:[],
  routines:{
    morgen:{id:'morgen',label:'Morgen',icon:'☀️',active:true,brot:false,wahl:false,tasks:[
      {id:'t1',em:'👕',lbl:'Anziehen',sub:'',to:'all'},
      {id:'t2',em:'🍳',lbl:'Frühstücken',sub:'',to:'all'},
      {id:'t3',em:'🦷',lbl:'Zähne putzen',sub:'2 Minuten lang!',to:'all'},
      {id:'t4',em:'🚽',lbl:'Toilette',sub:'',to:'all'},
      {id:'t5',em:'🎒',lbl:'Tasche packen',sub:'Alles dabei?',to:'all'},
      {id:'t6',em:'👟',lbl:'Schuhe & Jacke',sub:'Letzter Schritt!',to:'all'},
    ]},
    mittag:{id:'mittag',label:'Mittag',icon:'🌤️',active:false,brot:false,wahl:false,tasks:[]},
    abend:{id:'abend',label:'Abend',icon:'🌙',active:false,brot:false,wahl:false,tasks:[]},
  },
  wahlPool:[
    {id:'w1',em:'🍽️',lbl:'Spülmaschine ausräumen'},
    {id:'w2',em:'🧹',lbl:'Boden aufräumen'},
    {id:'w3',em:'🥄',lbl:'Tisch decken'},
    {id:'w4',em:'🍴',lbl:'Tisch abdecken'},
  ],
  stundenplan:{},
  taschengeld:{},
  essen:{
    meals:{fruehstueck:false,mittag:false,abend:true},
    dishes:[
      {id:'g1',em:'🍝',name:'Spaghetti Bolognese',meals:['mittag','abend'],tags:['fleisch'],ingr:['500 g Spaghetti','400 g Hackfleisch','1 Dose Tomaten','1 Zwiebel'],ratings:{}},
      {id:'g2',em:'🥞',name:'Pfannkuchen',meals:['mittag','abend'],tags:['veg','schnell'],ingr:['250 g Mehl','3 Eier','500 ml Milch'],ratings:{}},
      {id:'g3',em:'🍕',name:'Pizza',meals:['abend'],tags:['we','veg'],ingr:['Pizzateig','Tomatensoße','Mozzarella'],ratings:{}},
      {id:'g4',em:'🐟',name:'Fischstäbchen mit Kartoffelbrei',meals:['mittag','abend'],tags:['fisch','schnell'],ingr:['Fischstäbchen','1 kg Kartoffeln','Milch','Butter'],ratings:{}},
      {id:'g5',em:'🥗',name:'Ofengemüse mit Feta',meals:['mittag','abend'],tags:['veg'],ingr:['Kartoffeln','Paprika','Zucchini','Feta'],ratings:{}},
      {id:'g6',em:'🥣',name:'Müsli mit Obst',meals:['fruehstueck'],tags:['veg','schnell'],ingr:['Haferflocken','Milch','Obst'],ratings:{}},
      {id:'g7',em:'🍳',name:'Rührei mit Brot',meals:['fruehstueck','abend'],tags:['veg','schnell'],ingr:['6 Eier','Brot','Butter'],ratings:{}},
    ],
    plan:{},
  },
  modules:{routine:true,stundenplan:true,taschengeld:true,essen:true},
  installHintDone:false,
  _mv:4,
};
// <<SEED-END>>

// ═══ MODULE-REGISTER ══════════════════════════
// Neuer Bereich = ein Eintrag hier + Build-Funktion im View-Switch von buildApp()
const MEALS=[{id:'fruehstueck',em:'🥐',l:'Frühstück'},{id:'mittag',em:'🌤️',l:'Mittag'},{id:'abend',em:'🌙',l:'Abend'}];
const TAGS=[{id:'veg',em:'🥦',l:'Vegetarisch'},{id:'schnell',em:'⚡',l:'Schnell'},{id:'we',em:'🎉',l:'Wochenende'},{id:'fleisch',em:'🍖',l:'Fleisch'},{id:'fisch',em:'🐟',l:'Fisch'}];
const MODULES=[
  {id:'routine',em:'✅',lbl:'Routine',desc:'Tägliche Aufgaben, Brot-Check, Haushalts-Wahl'},
  {id:'stundenplan',em:'📅',lbl:'Stundenplan',desc:'Schule und Kita pro Wochentag'},
  {id:'taschengeld',em:'🐷',lbl:'Taschengeld',desc:'Wochengeld, Sparschwein, Ein- und Auszahlungen'},
  {id:'essen',em:'🍽️',lbl:'Essen',desc:'Lieblingsgerichte, Würfeln, Wochenplan'},
];
function modOn(id){return S.modules?.[id]!==false;}
function enabledMods(){return MODULES.filter(m=>modOn(m.id));}
function ensureView(){if(!modOn(UI.view))UI.view=enabledMods()[0]?.id||'routine';}

// ═══ STORAGE ══════════════════════════════════
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){toast('Speichern fehlgeschlagen. Speicher voll oder gesperrt?');return false;}}
function lsGet(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function clone(o){return JSON.parse(JSON.stringify(o));}

// ─── Validierung: alles, was aus localStorage oder einem Import kommt, läuft hier durch ───
const LIM={name:40,lbl:60,sub:80,note:80,em:12};
const BAD_IDS=['__proto__','constructor','prototype'];
function sStr(v,max){return typeof v==='string'?v.replace(/[\u0000-\u001f\u007f]/g,'').slice(0,max):'';}
function sId(v){return typeof v==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(v)&&!BAD_IDS.includes(v)?v:null;}
function sEm(v,d){const t=typeof v==='string'?Array.from(v.replace(/[\u0000-\u001f\u007f<>&"'`\\]/g,'')).slice(0,LIM.em).join(''):'';return t||d;}
function sNum(v,min,max){const n=typeof v==='number'?v:parseFloat(v);return Number.isFinite(n)?Math.min(max,Math.max(min,round2(n))):0;}
function sArr(v,n){return Array.isArray(v)?v.slice(0,n):[];}
function sObj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{};}
function sanitizeCfg(c){
  if(!c||typeof c!=='object'||Array.isArray(c))return null;
  const kids=[],ids=new Set();
  sArr(c.kids,12).forEach(k=>{const id=sId(k?.id),name=sStr(k?.name,LIM.name).trim();if(!id||ids.has(id)||!name)return;ids.add(id);
    kids.push({id,name,icon:sEm(k.icon,'😊'),col:typeof k.col==='string'&&Object.hasOwn(COLORS,k.col)?k.col:'b'});});
  const h=c.household;
  const household=h&&typeof h==='object'?{name:sStr(h.name,LIM.name).trim()||'Unser Haushalt',
    adults:sArr(h.adults,8).map(a=>({id:sId(a?.id)||uid(),name:sStr(a?.name,LIM.name).trim(),icon:sEm(a?.icon,'🙂')})).filter(a=>a.name)}:null;
  let routines={};
  Object.keys(sObj(c.routines)).slice(0,6).forEach(key=>{const r=c.routines[key];if(!sId(key)||!r||typeof r!=='object')return;const tids=new Set();
    routines[key]={id:key,label:sStr(r.label,LIM.name).trim()||key,icon:sEm(r.icon,'☀️'),active:!!r.active,brot:!!r.brot,wahl:!!r.wahl,
      tasks:sArr(r.tasks,60).map(t=>{const id=sId(t?.id),lbl=sStr(t?.lbl,LIM.lbl).trim();if(!id||tids.has(id)||!lbl)return null;tids.add(id);
        return{id,em:sEm(t.em,'⭐'),lbl,sub:sStr(t.sub,LIM.sub).trim(),to:t.to==='all'?'all':(sId(t.to)||'all')};}).filter(Boolean)};});
  if(!Object.keys(routines).length)routines=clone(DEF.routines);
  if(!Object.values(routines).some(r=>r.active))Object.values(routines)[0].active=true;
  const wids=new Set();
  const wahlPool=sArr(c.wahlPool,40).map(w=>{const id=sId(w?.id),lbl=sStr(w?.lbl,LIM.lbl).trim();if(!id||wids.has(id)||!lbl)return null;wids.add(id);return{id,em:sEm(w.em,'🏠'),lbl};}).filter(Boolean);
  const stundenplan={},taschengeld={};
  kids.forEach(k=>{
    const sp=sObj(sObj(c.stundenplan)[k.id]);stundenplan[k.id]={};
    DAYS.forEach(d=>{stundenplan[k.id][d.id]=sArr(sp[d.id],30).map(e=>{const lbl=sStr(e?.lbl,LIM.lbl).trim();if(!lbl)return null;
      return{em:sEm(e.em,'📖'),lbl,time:sStr(e.time,30).trim(),teacher:sStr(e.teacher,LIM.name).trim()};}).filter(Boolean);});
    const tg=sObj(sObj(c.taschengeld)[k.id]);
    taschengeld[k.id]={betrag:tg.betrag===undefined?1:sNum(tg.betrag,0,1000),aktiv:!!tg.aktiv};
  });
  const modules={};MODULES.forEach(m=>{modules[m.id]=sObj(c.modules)[m.id]!==false;});
  if(!MODULES.some(m=>modules[m.id]))modules[MODULES[0].id]=true;
  const pin=c.pin&&typeof c.pin.s==='string'&&typeof c.pin.h==='string'&&/^[a-z0-9]{1,16}$/.test(c.pin.s)&&/^[0-9a-f]{8}$/.test(c.pin.h)?{s:c.pin.s,h:c.pin.h}:null;
  const essen=sanitizeEssen(c.essen,kids);
  return{household,kids,routines,wahlPool,stundenplan,taschengeld,modules,essen,pin,installHintDone:!!c.installHintDone,_mv:sNum(c._mv,0,999)||0};
}
function sanitizeEssen(e,kids){
  if(!e||typeof e!=='object'||Array.isArray(e))e=clone(DEF.essen); // ältere Stände: Beispielgerichte
  const kidIds=new Set(kids.map(k=>k.id)),mealIds=MEALS.map(m=>m.id),tagIds=TAGS.map(t=>t.id);
  const meals={};mealIds.forEach(id=>{meals[id]=!!sObj(e.meals)[id];});
  if(!mealIds.some(id=>meals[id]))meals.abend=true;
  const ids=new Set();
  const dishes=sArr(e.dishes,300).map(d=>{const id=sId(d?.id),name=sStr(d?.name,60).trim();if(!id||ids.has(id)||!name)return null;ids.add(id);
    const ms=mealIds.filter(m=>sArr(d.meals,3).includes(m));
    const ratings={};Object.keys(sObj(d.ratings)).forEach(k=>{if(kidIds.has(k)&&(d.ratings[k]===1||d.ratings[k]===-1))ratings[k]=d.ratings[k];});
    return{id,em:sEm(d.em,'🍽️'),name,meals:ms.length?ms:['abend'],tags:tagIds.filter(t=>sArr(d.tags,10).includes(t)),
      ingr:sArr(d.ingr,60).map(x=>sStr(x,80).trim()).filter(Boolean),ratings};}).filter(Boolean);
  const plan={};
  Object.keys(sObj(e.plan)).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-120).forEach(ds=>{const p={};
    mealIds.forEach(m=>{const sl=sObj(sObj(e.plan[ds])[m]);if(ids.has(sl.id))p[m]={id:sl.id,pin:!!sl.pin};});
    if(Object.keys(p).length)plan[ds]=p;});
  return{meals,dishes,plan};
}
function sanitizeDay(d){d=sObj(d);return{date:sStr(d.date,10),chk:sObj(d.chk),brot:sObj(d.brot),wahl:sObj(d.wahl)};}
function sanitizeTgd(t){const o={};Object.keys(sObj(t)).slice(-600).forEach(k=>{if(/^[A-Za-z0-9_-]{1,40}:\d{4}W\d{2}$/.test(k)&&(t[k]==='ausgezahlt'||t[k]==='gespart'))o[k]=t[k];});return o;}
function sanitizeSavings(v){const o={};Object.keys(sObj(v)).slice(0,24).forEach(k=>{if(sId(k))o[k]=sNum(v[k],0,1e6);});return o;}
function sanitizeTx(a){return sArr(Array.isArray(a)?a.slice(-200):[],200).map(x=>{const kid=sId(x?.kid),amt=sNum(x?.amt,-1e6,1e6),t=Number(x?.t);if(!kid||!amt||!Number.isFinite(t))return null;return{t,kid,amt,note:sStr(x.note,LIM.note)};}).filter(Boolean);}

function ensureHousehold(c){
  if(c&&c.household===undefined&&Array.isArray(c.kids)&&c.kids.length){c.household={name:'Unsere Familie',adults:[]};return true;}
  if(c&&c.household&&!Array.isArray(c.household.adults)){c.household.adults=[];return true;}
  return false;
}
function loadCfg(){
  const raw=lsGet('ra_cfg3');
  if(raw&&typeof raw==='object'&&!Array.isArray(raw)){
    const before=JSON.stringify(raw);
    try{
      // Fehlende Bereiche aus den Startdaten ergänzen, bestehende Werte nie überschreiben
      if(!raw.stundenplan)raw.stundenplan=clone(DEF.stundenplan);
      if(!raw.taschengeld)raw.taschengeld=clone(DEF.taschengeld);
      ensureHousehold(raw);
      // Datenmodell-Version; künftige Migrationen hier, nur wenn die Version zurückliegt
      if((raw._mv||0)<4)raw._mv=4;
    }catch(e){}
    const c=sanitizeCfg(raw);
    if(c){if(JSON.stringify(c)!==before)lsSet('ra_cfg3',JSON.stringify(c));return c;}
  }
  return sanitizeCfg(clone(DEF));
}
function saveCfg(){return lsSet('ra_cfg3',JSON.stringify(S));}
function loadDay(){const d=sanitizeDay(lsGet('ra_day3'));return d.date===today()?d:{date:today(),chk:{},brot:{},wahl:{}};}
function saveDay(){lsSet('ra_day3',JSON.stringify(D));}
// Tageswechsel bei offen gelassener App (Tablet an der Wand): alter Tagesstand wird verworfen
function dayGuard(){if(D.date===today())return false;D=loadDay();return true;}
function loadTgd(){return sanitizeTgd(lsGet('ra_tgd'));}
function saveTgd(){lsSet('ra_tgd',JSON.stringify(TGD));}
function loadSavings(){return sanitizeSavings(lsGet('ra_savings'));}

function loadTx(){return sanitizeTx(lsGet('ra_tx'));}
function saveTx(){if(TX.length>200)TX=TX.slice(-200);lsSet('ra_tx',JSON.stringify(TX));}
let _toastT=null;
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),3200);}
function round2(n){return Math.round(n*100)/100;}
// Bucht einen Betrag ins Sparschwein (positiv = ein, negativ = aus) und protokolliert ihn
function bookSavings(kidId,amt,note){
  amt=round2(amt);if(!amt)return;
  SAVINGS[kidId]=Math.max(0,round2((SAVINGS[kidId]||0)+amt));
  TX.push({t:Date.now(),kid:kidId,amt,note:note||''});
  saveSavings();saveTx();}
function parseAmount(s){const v=parseFloat(String(s).trim().replace(/\s/g,'').replace(',','.'));return isNaN(v)?NaN:round2(v);}

// ═══ HELPERS ══════════════════════════════════
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function firstActiveRt(){return Object.keys(S.routines).find(k=>S.routines[k].active)||'morgen';}
function todayDow(){return{0:'so',1:'mo',2:'di',3:'mi',4:'do',5:'fr',6:'sa'}[new Date().getDay()]||'mo';}
function weekKey(){const d=new Date(),thu=new Date(d);thu.setDate(d.getDate()-(d.getDay()+6)%7+3);const ft=new Date(thu.getFullYear(),0,4);const kw=Math.round(1+(thu-ft)/6048e5);return`${thu.getFullYear()}W${String(kw).padStart(2,'0')}`;}
function getKW(){const d=new Date(),thu=new Date(d);thu.setDate(d.getDate()-(d.getDay()+6)%7+3);const ft=new Date(thu.getFullYear(),0,4);return Math.round(1+(thu-ft)/6048e5);}
function fmt(n){return n.toFixed(2).replace('.',',')+' €';}

// ═══ ROUTINE HELPERS ══════════════════════════
function kidTasks(rtId,kidId){return(S.routines[rtId]?.tasks||[]).filter(t=>t.to==='all'||t.to===kidId);}
function kidChks(rtId,kidId){return D.chk?.[rtId]?.[kidId]||{};}
function kidWahl(rtId,kidId){return D.wahl?.[rtId]?.[kidId]||null;}
function doneCount(rtId,kidId){const tasks=kidTasks(rtId,kidId),chks=kidChks(rtId,kidId),wahlId=kidWahl(rtId,kidId),wahlOn=S.routines[rtId]?.wahl;let n=tasks.filter(t=>chks[t.id]).length;if(wahlOn&&wahlId&&chks['w_'+wahlId])n++;return n;}
function totalCount(rtId,kidId){return kidTasks(rtId,kidId).length+(S.routines[rtId]?.wahl&&kidWahl(rtId,kidId)?1:0);}

function applyImport(data){

  if(!raw||typeof raw!=='object'||!Array.isArray(raw.kids))return false;
  ensureHousehold(raw);

  S=c;saveCfg();
  if(data.tgd){TGD=sanitizeTgd(data.tgd);saveTgd();}
  if(data.savings){SAVINGS=sanitizeSavings(data.savings);saveSavings();}

function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;
  if(file.size>1e6){toast('Datei ist zu groß für ein FamOS-Backup.');return;}
  const reader=new FileReader();reader.onload=ev=>{let data=null;try{data=JSON.parse(ev.target.result);}catch(err){}
    if(!data){toast('Das ist keine gültige Backup-Datei.');return;}
    if(S.household&&!confirm('Import ersetzt alle Daten auf diesem Gerät. Fortfahren?'))return;

// ═══ ESSEN ════════════════════════════════════
// Lieblingsgerichte, Würfeln (gewichtet nach Bewertung und zuletzt gegessen), Wochenplan mit 📌
function activeMeals(){return MEALS.filter(m=>S.essen.meals[m.id]);}
function mealOf(id){return MEALS.find(m=>m.id===id);}
function dishById(id){return S.essen.dishes.find(d=>d.id===id)||null;}
function dstr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function pdate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function addDays(s,n){const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);}
function daysBetween(a,b){return Math.round((pdate(b)-pdate(a))/864e5);}
function weekDates(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+7*(off||0));const mo=dstr(d);return DAYS.map((_,i)=>addDays(mo,i));}
function planSlot(ds,meal){const sl=S.essen.plan[ds]?.[meal];return sl&&dishById(sl.id)?sl:null;}
function setSlot(ds,meal,id,pin){const P=S.essen.plan;if(id){if(!P[ds])P[ds]={};P[ds][meal]={id,pin:!!pin};}else if(P[ds]){delete P[ds][meal];if(!Object.keys(P[ds]).length)delete P[ds];}}
function pruneEssen(){const min=addDays(today(),-35);Object.keys(S.essen.plan).forEach(k=>{if(k<min)delete S.essen.plan[k];});}
function lastPlanned(id,before){let best=null;for(const ds in S.essen.plan){if(ds>=before)continue;if(Object.values(S.essen.plan[ds]).some(sl=>sl.id===id)&&(!best||ds>best))best=ds;}return best;}
function weekIds(dates,skipDs,skipMeal){const ids=new Set();dates.forEach(ds=>Object.entries(S.essen.plan[ds]||{}).forEach(([m,sl])=>{if(!(ds===skipDs&&m===skipMeal))ids.add(sl.id);}));return ids;}
// Gewicht: 👍 eines Kindes ×1,6, 👎 ×0,4 (seltener, nie ausgeschlossen); kürzlich gegessen deutlich seltener; schon in dieser Woche ×0,15
function dishWeight(d,meal,ds,avoid){
  if(!d.meals.includes(meal))return 0;
  let w=1;
  Object.entries(d.ratings).forEach(([k,v])=>{if(S.kids.some(x=>x.id===k))w*=v>0?1.6:0.4;});
  const last=lastPlanned(d.id,ds);
  if(last){const n=daysBetween(last,ds);w*=n<=3?0.1:n<=7?0.35:n<=14?0.7:1;}
  if(avoid&&avoid.has(d.id))w*=0.15;
  return w;
}
function pickDish(meal,ds,avoid,tag,exclude){
  let c=S.essen.dishes.filter(d=>!tag||d.tags.includes(tag)).map(d=>[d,dishWeight(d,meal,ds,avoid)]).filter(x=>x[1]>0);
  if(exclude&&c.length>1)c=c.filter(x=>x[0].id!==exclude);
  if(!c.length)return null;
  let r=Math.random()*c.reduce((sum,x)=>sum+x[1],0);
  for(const[d,w]of c){if((r-=w)<0)return d.id;}
  return c[c.length-1][0].id;
}
function rollToday(meal){
  const td=today(),cur=planSlot(td,meal);if(cur?.pin)return;
  const id=pickDish(meal,td,weekIds(weekDates(0),td,meal),UI.essTag,cur?.id);
  if(!id){toast(`Kein passendes Gericht für ${mealOf(meal).l}${UI.essTag?' mit diesem Filter':''}.`);return;}
  setSlot(td,meal,id,false);pruneEssen();saveCfg();render();
}
function rollWeek(){
  const dates=weekDates(UI.essWeek),td=today(),meals=activeMeals();let n=0;
  dates.forEach(ds=>{if(ds<td)return;meals.forEach(m=>{if(!planSlot(ds,m.id)?.pin)setSlot(ds,m.id,null);});});
  dates.forEach(ds=>{if(ds<td)return;meals.forEach(m=>{if(planSlot(ds,m.id))return;const id=pickDish(m.id,ds,weekIds(dates),null,null);if(id){setSlot(ds,m.id,id,false);n++;}});});
  pruneEssen();saveCfg();render();
  toast(n?`${n} ${n===1?'Mahlzeit':'Mahlzeiten'} gewürfelt`:'Nichts zu würfeln: alles festgelegt oder keine passenden Gerichte.');
}
function togPin(ds,meal){const sl=planSlot(ds,meal);if(!sl)return;sl.pin=!sl.pin;saveCfg();render();}
function rateDish(id,v){const d=dishById(id),k=UI.kid;if(!d||!k)return;if(d.ratings[k]===v)delete d.ratings[k];else d.ratings[k]=v;saveCfg();render();}

}
function buildEssToday(){
  const td=today();
  return essTagChips()+activeMeals().map(m=>{const sl=planSlot(td,m.id),d=sl&&dishById(sl.id);
    return`<div class="tg-card"><div class="ess-meal">${m.em} ${m.l}</div>
    ${d?`<button class="ess-dish" onclick="openEssPick('${td}','${m.id}')"><span class="ess-em">${esc(d.em)}</span><span class="ess-name">${esc(d.name)}</span></button>${d.ingr.length?`<div class="ess-ingr">${d.ingr.map(x=>esc(x)).join(' · ')}</div>`:''}`:`<div class="ess-none">Noch nichts geplant</div>`}
    <div class="ess-acts"><button class="tg-act ein" onclick="rollToday('${m.id}')" ${sl?.pin?'disabled':''}>🎲 ${d?'Nochmal':'Würfeln'}</button>${d?`<button class="tg-act${sl.pin?' pinned':''}" aria-pressed="${sl.pin?'true':'false'}" onclick="togPin('${td}','${m.id}')">📌 ${sl.pin?'Festgelegt':'Festlegen'}</button>`:''}</div></div>`;}).join('');
}
function buildEssWeek(){
  const dates=weekDates(UI.essWeek),meals=activeMeals(),td=today();
  return`<div class="rt-pills"><button class="rt-pill${UI.essWeek===0?' on':''}" onclick="setEssWeek(0)">Diese Woche</button><button class="rt-pill${UI.essWeek===1?' on':''}" onclick="setEssWeek(1)">Nächste Woche</button></div>

// ═══ ELTERN-PIN ═══════════════════════════════
// Kindersicherung, kein Tresor: die PIN liegt als gesalzener Hash auf dem Gerät.
const PIN_WINDOW=120000;
let _pinCb=null;
function pinHash(pin,salt){let h=0x811c9dc5;const t=salt+':'+pin;for(let r=0;r<2000;r++){for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}h=(h^r)>>>0;}return h.toString(16).padStart(8,'0');}
function pinUnlocked(){return !S.pin||Date.now()<(UI.unlockUntil||0);}
function requirePin(cb){if(pinUnlocked()){cb();return;}UI.form={mode:'pin',pin:'',forgot:null,answer:''};openModal();_pinCb=cb;setTimeout(()=>document.getElementById('pinIn')?.focus(),50);}
function renderPinModal(){const f=UI.form;
  if(f.forgot)return`<h3>PIN vergessen</h3>
  <div style="font-size:.9rem;color:var(--muted);font-weight:700;margin-bottom:14px;line-height:1.5">Nur für Erwachsene: Wie viel ist <strong style="color:var(--text)">${f.forgot.a} × ${f.forgot.b}</strong>?</div>
  <div class="field"><label>Ergebnis</label><input id="pinIn" type="text" inputmode="numeric" autocomplete="off" maxlength="4" oninput="UI.form.answer=this.value"></div>
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="pinForgotCheck()">PIN löschen</button></div>`;
  return`<h3>🔒 Eltern-PIN</h3>
  <div class="field"><label>PIN eingeben</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="6" oninput="UI.form.pin=this.value" onkeydown="if(event.key==='Enter')pinSubmit()" style="font-size:1.3rem;letter-spacing:.3em"></div>
  <button class="quick-all" onclick="pinForgot()">PIN vergessen?</button>
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="pinSubmit()">Entsperren</button></div>`;}
function pinDone(){const cb=_pinCb;closeModal();if(cb)cb();}
function pinSubmit(){const f=UI.form,now=Date.now();
  if(now<(UI.pinBlockUntil||0)){toast('Zu viele Fehlversuche. Bitte kurz warten.');return;}
  if(S.pin&&pinHash(String(f.pin||''),S.pin.s)===S.pin.h){UI.pinFails=0;UI.unlockUntil=now+PIN_WINDOW;pinDone();return;}
  UI.pinFails=(UI.pinFails||0)+1;if(UI.pinFails>=3){UI.pinBlockUntil=now+30000;UI.pinFails=0;}
  f.pin='';const el=document.getElementById('pinIn');if(el)el.value='';toast('Falsche PIN');}
function pinForgot(){const cb=_pinCb;UI.form.forgot={a:12+Math.floor(Math.random()*8),b:6+Math.floor(Math.random()*4)};UI.form.answer='';openModal();_pinCb=cb;}
function pinForgotCheck(){const f=UI.form;
  if(parseInt(f.answer,10)!==f.forgot.a*f.forgot.b){toast('Das stimmt nicht.');pinForgot();return;}
  S.pin=null;saveCfg();UI.unlockUntil=0;pinDone();toast('PIN gelöscht. In den Einstellungen neu festlegen.');}
function openPinSetModal(){UI.form={mode:'pinSet',p1:'',p2:''};openModal();}
function renderPinSetModal(){return`<h3>Eltern-PIN festlegen</h3>
  <div class="field"><label>Neue PIN (4 bis 6 Ziffern)</label><input type="password" inputmode="numeric" autocomplete="off" maxlength="6" oninput="UI.form.p1=this.value"></div>
  <div class="field"><label>Wiederholen</label><input type="password" inputmode="numeric" autocomplete="off" maxlength="6" oninput="UI.form.p2=this.value"></div>
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="savePin()">Speichern</button></div>`;}
function savePin(){const f=UI.form;
  if(!/^\d{4,6}$/.test(f.p1)){toast('Die PIN braucht 4 bis 6 Ziffern.');return;}
  if(f.p1!==f.p2){toast('Die beiden Eingaben stimmen nicht überein.');return;}
  const salt=uid();S.pin={s:salt,h:pinHash(f.p1,salt)};saveCfg();UI.unlockUntil=Date.now()+PIN_WINDOW;closeModal();renderAdmin();toast('Eltern-PIN gesetzt');}
function removePin(){if(!confirm('Eltern-PIN entfernen?'))return;S.pin=null;saveCfg();renderAdmin();}

// ═══ ACTIONS ══════════════════════════════════
function setKid(id){UI.kid=id;render();}
function setRt(id){UI.rt=id;render();}
function setView(v){UI.view=v;if(v==='stundenplan'&&!UI.spDay)UI.spDay=todayDow();render();}
function setSpDay(d){UI.spDay=d;render();}

function toggleTask(rtId,kidId,taskId){dayGuard();if(!D.chk[rtId])D.chk[rtId]={};if(!D.chk[rtId][kidId])D.chk[rtId][kidId]={};D.chk[rtId][kidId][taskId]=!D.chk[rtId][kidId][taskId];saveDay();render();checkDone(rtId,kidId);}
function setBrot(val){dayGuard();if(!D.brot[UI.rt])D.brot[UI.rt]={};D.brot[UI.rt][UI.kid]=val;saveDay();render();}
function setWahl(rtId,kidId,wahlId){dayGuard();const cur=kidWahl(rtId,kidId);if(cur&&kidChks(rtId,kidId)['w_'+cur])return;if(!D.wahl[rtId])D.wahl[rtId]={};D.wahl[rtId][kidId]=wahlId;saveDay();render();}
function toggleWahlDone(rtId,kidId,wahlId){dayGuard();const key='w_'+wahlId;if(!D.chk[rtId])D.chk[rtId]={};if(!D.chk[rtId][kidId])D.chk[rtId][kidId]={};D.chk[rtId][kidId][key]=!D.chk[rtId][kidId][key];saveDay();render();checkDone(rtId,kidId);}

function setTgStatus(status){requirePin(()=>_setTgStatus(status));}
// Nochmal auf den aktiven Status tippen nimmt ihn zurück
function _setTgStatus(status){
  const wk=weekKey(),key=UI.kid+':'+wk,prev=TGD[key]||null;
  if(prev===status)status=null;
  const betrag=S.taschengeld?.[UI.kid]?.betrag||0,kw=getKW();
  if(prev==='gespart'){const back=Math.min(betrag,SAVINGS[UI.kid]||0);bookSavings(UI.kid,-back,`Sparen zurückgenommen (KW ${kw})`);}
  if(status==='gespart')bookSavings(UI.kid,betrag,`Wochengeld gespart (KW ${kw})`);
  if(status)TGD[key]=status;else delete TGD[key];
  saveTgd();render();}

function resetSavings(kidId){
  const kid=S.kids.find(k=>k.id===kidId);
  if(!confirm(`Sparschwein von ${kid?.name} auf 0 zurücksetzen?`))return;
  bookSavings(kidId,-(SAVINGS[kidId]||0),'Zurückgesetzt');renderAdmin();}

function checkDone(rtId,kidId){const d=doneCount(rtId,kidId),t=totalCount(rtId,kidId);if(t>0&&d>=t)setTimeout(()=>showDone(kidId),380);}
function showDone(kidId){const kid=S.kids.find(k=>k.id===kidId);const msgs=[`${kid?.name}, du bist der/die Beste! 🏆`,`Wow ${kid?.name} — alles fertig! ⚡`,`${kid?.name} schafft alles! 🚀`];document.getElementById('doneEm').textContent=kid?.icon||'🎉';document.getElementById('doneTitle').textContent=`Super, ${kid?.name}!`;document.getElementById('doneTxt').textContent=msgs[Math.floor(Math.random()*msgs.length)];document.getElementById('doneOv').classList.add('show');launchConfetti();}
function closeDone(){document.getElementById('doneOv').classList.remove('show');document.getElementById('cf').innerHTML='';}
function launchConfetti(){const el=document.getElementById('cf');el.innerHTML='';const cols=['var(--acc-a)','var(--gold)','var(--green)','var(--acc-b)','var(--acc-d)'];for(let i=0;i<55;i++){const d=document.createElement('div');d.className='c';const s=5+Math.random()*8;d.style.cssText=`left:${Math.random()*100}%;top:-10px;width:${s}px;height:${s}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${Math.random()*.7}s;animation-duration:${1.4+Math.random()*.7}s`;el.appendChild(d);}}
function resetDay(){if(!confirm('Alle Haken von heute zurücksetzen, für alle Kinder?'))return;D={date:today(),chk:{},brot:{},wahl:{}};saveDay();render();toast('Heutige Haken zurückgesetzt');}
function dismissInstall(){S.installHintDone=true;saveCfg();render();}

// Admin actions
function openAdmin(){requirePin(_openAdmin);}
function _openAdmin(){renderAdmin();requestAnimationFrame(()=>document.getElementById('adm').classList.add('open'));}
function closeAdmin(){UI.unlockUntil=0;document.getElementById('adm').classList.remove('open');setTimeout(()=>{UI.rt=firstActiveRt();if(!UI.kid||!S.kids.find(k=>k.id===UI.kid))UI.kid=S.kids[0]?.id;render();},340);}
function setATab(t){UI.aTab=t;renderAdmin();}
function setARt(id){UI.aRt=id;renderAdmin();}
function setASpKid(id){UI.aSpKid=id;renderAdmin();}
function setASpDay(d){UI.aSpDay=d;renderAdmin();}
function togRtActive(id){const r=S.routines[id];if(r.active&&Object.values(S.routines).filter(rt=>rt.active).length<=1){toast('Mindestens eine Routine muss aktiv sein!');return;}r.active=!r.active;saveCfg();renderAdmin();}
function togBrot(id){S.routines[id].brot=!S.routines[id].brot;saveCfg();renderAdmin();}
function togWahl(id){S.routines[id].wahl=!S.routines[id].wahl;saveCfg();renderAdmin();}
function togTgAktiv(kidId){if(!S.taschengeld)S.taschengeld={};if(!S.taschengeld[kidId])S.taschengeld[kidId]={betrag:1,aktiv:false};S.taschengeld[kidId].aktiv=!S.taschengeld[kidId].aktiv;saveCfg();renderAdmin();}

// ═══ PWA ══════════════════════════════════════
(()=>{const m={name:'FamOS',short_name:'FamOS',start_url:'.',display:'standalone',background_color:'#F4EDE1',theme_color:'#F4EDE1',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23F4EDE1'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml'}]};const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);})();

// ═══ INIT ═════════════════════════════════════
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&dayGuard())render();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(document.getElementById('epBg').classList.contains('open'))epClose();else closeModal();});
UI.kid=S.kids[0]?.id;
UI.rt=firstActiveRt();
UI.spDay=todayDow();
UI.aSpKid=S.kids[0]?.id;
render();
</script>
</body>
</html>
