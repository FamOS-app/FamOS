*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--text)}
button{font-family:var(--font);cursor:pointer;border:none}
input{font-family:var(--font)}
:root{
  /* Palette: Terracotta Rust AE5238 · Mustard Yellow D39B32 · Deep Teal 225D65 · Olive Green 5C633E · Warm Cream E3D8C6 */
  --bg:#F4EDE1;--bg2:#E3D8C6;--card:#FFFDF8;--border:#D3C6B0;
  --text:#2A2B24;--muted:#625C4E;--subtle:#857D6C;--on:#FFFFFF;
  --pri:#225D65;
  --acc-a:#AE5238;--acc-b:#225D65;--acc-c:#5C633E;--acc-d:#B27D1A;--acc-e:#7A3B2E;
  --green:#5C633E;--gold:#D39B32;--gold-ink:#855B0A;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --sh:0 2px 12px rgba(60,45,20,.08);--sh2:0 4px 24px rgba(60,45,20,.14);--r:14px;
}

/* ── LAYOUT ──────────────────────────────── */
.wrap{max-width:440px;margin:0 auto;padding:14px 14px calc(72px + env(safe-area-inset-bottom,0px))}

/* ── HEADER ──────────────────────────────── */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0 20px}
.hdr-title{font-family:var(--font);font-weight:700;font-size:1.55rem;color:var(--text);line-height:1}
.hdr-date{font-size:.75rem;font-weight:700;color:var(--muted);margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
.gear-btn{background:none;padding:8px 10px;border-radius:10px;color:var(--subtle);font-size:1rem;border:1.5px solid var(--border);transition:all .2s}
.gear-btn:active{background:var(--bg2)}

/* ── KID TABS ────────────────────────────── */
.kid-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--bg2);border-radius:20px;padding:4px}
.kid-tab{flex:1;padding:10px 8px;border-radius:16px;background:transparent;font-weight:800;font-size:.86rem;color:var(--subtle);transition:all .28s cubic-bezier(.34,1.4,.64,1);display:flex;align-items:center;justify-content:center;gap:6px}
.kid-tab .av{font-size:1.3rem;transition:transform .28s cubic-bezier(.34,1.4,.64,1);line-height:1}
.kid-tab.on{background:var(--card);box-shadow:var(--sh);color:var(--text)}
.kid-tab.on .av{transform:scale(1.12)}
.ca{--kc:var(--acc-a)}.cb{--kc:var(--acc-b)}.cc{--kc:var(--acc-c)}.cd{--kc:var(--acc-d)}.ce{--kc:var(--acc-e)}
.kid-tab.on{color:var(--kc,var(--text))}

/* ── BOTTOM NAV ──────────────────────────── */
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(10px);border-top:1.5px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bot-nav-inner{display:flex;width:100%;max-width:440px}
.wrap.no-nav{padding-bottom:28px}
.bni{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--subtle);font-weight:800;font-size:.75rem;letter-spacing:.2px;text-transform:uppercase;transition:color .2s;border:none}
.bni-em{font-size:1.2rem;line-height:1;transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
.bni.on{color:var(--pri)}
.bni.on .bni-em{transform:scale(1.18)}

/* ── RT PILLS ────────────────────────────── */
.rt-pills{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.rt-pills::-webkit-scrollbar{display:none}
.rt-pill{flex-shrink:0;padding:6px 14px;border-radius:99px;background:transparent;border:1.5px solid var(--border);font-weight:700;font-size:.82rem;color:var(--muted);transition:all .2s}
.rt-pill.on{border-color:transparent;background:var(--pri);color:var(--on)}

/* ── PROGRESS ────────────────────────────── */
.prog{margin-bottom:20px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.prog-label{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.prog-frac{font-family:var(--font);font-weight:700;font-size:1rem;color:var(--text)}
.prog-track{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}

/* ── TASK CARD ───────────────────────────── */

.t-em{font-size:1.5rem;width:36px;text-align:center;flex-shrink:0;transition:transform .3s cubic-bezier(.34,1.4,.64,1);line-height:1}

.tc.done .t-chk{background:var(--kc,var(--green));border-color:var(--kc,var(--green));box-shadow:0 0 0 3px color-mix(in srgb,var(--kc,var(--green)) 18%,transparent)}

/* ── BROT / WAHL ─────────────────────────── */
.brot{background:var(--card);border-radius:var(--r);padding:13px 14px;border:1.5px solid var(--border);box-shadow:var(--sh);margin-bottom:8px}

.wahl{background:var(--card);border-radius:var(--r);padding:13px 14px;border:1.5px solid var(--border);box-shadow:var(--sh);margin-bottom:8px}

.wi.sel{border-color:var(--acc-b);background:color-mix(in srgb,var(--acc-b) 10%,var(--card))}
.wi.sel .wi-chk{background:var(--acc-b);border-color:var(--acc-b);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-b) 18%,transparent)}

/* ── STUNDENPLAN VIEW ────────────────────── */

.sync-or{text-align:center;font-size:.8rem;color:var(--muted);font-weight:700;margin:8px 0}
.sync-err{background:color-mix(in srgb,var(--acc-a) 12%,var(--card));color:var(--acc-a);border-radius:10px;padding:10px 12px;font-size:.88rem;font-weight:700;margin-bottom:12px}
.sync-privacy{font-size:.78rem;color:var(--muted);font-weight:600;line-height:1.55;margin:4px 0 12px}
.sync-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.9rem}
.sync-at{color:var(--muted);font-size:.8rem;font-weight:600}
.sync-code{font-size:1.6rem;font-weight:700;letter-spacing:.18em;text-align:center;padding:12px;background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--r);font-variant-numeric:tabular-nums}
.sync-danger{color:var(--acc-a);border-color:color-mix(in srgb,var(--acc-a) 40%,var(--border))}
.install-close{background:none;color:var(--subtle);font-size:.95rem;padding:4px 6px}

/* ── DONE OVERLAY ────────────────────────── */
.done-ov{display:none;position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 96%,transparent);z-index:300;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.done-ov.show{display:flex}
.done-em{font-size:76px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);margin-bottom:8px}
.done-stars{display:flex;gap:8px;margin-bottom:16px}
.done-star{font-size:1.5rem;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both}
.done-star:nth-child(2){animation-delay:.08s}.done-star:nth-child(3){animation-delay:.16s}
.done-ov h2{font-family:var(--font);font-weight:700;font-size:2rem;color:var(--text);margin-bottom:6px}
.done-ov p{font-weight:700;color:var(--muted);font-size:.95rem}
.done-cls{margin-top:28px;background:var(--pri);color:var(--on);padding:13px 36px;border-radius:99px;font-family:var(--font);font-weight:700;font-size:1.1rem;box-shadow:var(--sh2)}
.done-cls:active{transform:scale(.96)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:299;overflow:hidden}
.c{position:absolute;animation:cfall linear forwards}
@keyframes cfall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes popIn{from{transform:scale(0) rotate(-8deg)}to{transform:scale(1) rotate(0)}}

/* ── ADMIN ───────────────────────────────── */
.adm{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.4,0,.2,1);overflow:hidden}
.adm.open{transform:translateX(0)}
.adm-hdr{background:var(--card);padding:16px 14px 0;border-bottom:1.5px solid var(--border);flex-shrink:0}
.adm-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.adm-back{background:none;font-size:.85rem;font-weight:800;color:var(--muted);padding:6px 10px;border-radius:8px;border:1.5px solid var(--border)}
.adm-back:active{background:var(--bg2)}
.adm-title{font-family:var(--font);font-weight:700;font-size:1.2rem;color:var(--text);flex:1}
.adm-tabbar{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.adm-tabbar::-webkit-scrollbar{display:none}
.adm-tab{flex-shrink:0;padding:10px 14px;background:none;font-size:.77rem;font-weight:800;color:var(--subtle);border-bottom:2.5px solid transparent;letter-spacing:.2px;transition:all .2s;white-space:nowrap}
.adm-tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.adm-body{flex:1;overflow-y:auto;padding:14px}
.al{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ai{background:var(--card);border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:11px;border:1.5px solid var(--border)}
.ai-em{font-size:1.4rem;flex-shrink:0;line-height:1}
.ai-info{flex:1;min-width:0}
.ai-main{font-weight:800;font-size:.9rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-sub{font-size:.75rem;color:var(--muted);margin-top:1px}
.ai-badge{font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--muted);flex-shrink:0;border:1px solid var(--border)}
.ai-edit{background:none;font-size:.9rem;color:var(--subtle);padding:5px 6px;transition:color .15s}
.ai-del{background:none;font-size:.9rem;color:var(--subtle);padding:5px 6px;transition:color .15s}
.ai-edit:active{color:var(--acc-b)}.ai-del:active{color:var(--acc-a)}
.aa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1.5px dashed var(--border);background:transparent;border-radius:var(--r);font-weight:800;font-size:.86rem;color:var(--muted);transition:all .2s}
.aa:active{background:var(--bg2)}
.tog-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:12px 13px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid var(--border)}
.tog-l{font-weight:800;font-size:.88rem;color:var(--text)}.tog-s{font-size:.75rem;color:var(--muted);margin-top:2px}
.tog{width:40px;height:22px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--border);position:relative;transition:all .28s;flex-shrink:0;cursor:pointer}
.tog.on{background:var(--pri);border-color:var(--pri)}
.tog::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:1px;left:1px;transition:transform .28s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on::after{transform:translateX(18px)}
.rt-sel{display:flex;gap:6px;margin-bottom:14px}
.rt-sel-btn{flex:1;padding:8px 4px;border:1.5px solid var(--border);background:var(--card);border-radius:10px;font-weight:800;font-size:.82rem;color:var(--muted);transition:all .2s;text-align:center}
.rt-sel-btn.on{border-color:var(--pri);color:var(--pri);background:var(--bg2)}
.as-lbl{font-size:.75rem;font-weight:800;color:var(--subtle);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;margin-top:4px}

/* ── MODAL ───────────────────────────────── */
.mb{display:none;position:fixed;inset:0;background:color-mix(in srgb,var(--text) 45%,transparent);z-index:200;align-items:flex-end;justify-content:center}
.mb.open{display:flex}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:440px;padding:22px 18px 32px;animation:slideUp .3s cubic-bezier(.34,1.3,.64,1);max-height:88vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-family:var(--font);font-weight:700;font-size:1.15rem;color:var(--text);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.7rem;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.92rem;font-weight:700;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--pri);background:var(--card)}
.em-btn{font-size:1.9rem;padding:8px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;transition:all .2s;line-height:1}
.em-btn:active{transform:scale(.93)}
.ap-wrap{display:flex;flex-wrap:wrap;gap:6px}
.ap{padding:7px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--bg);font-weight:800;font-size:.8rem;color:var(--muted);transition:all .2s}
.ap.on{border-color:var(--pri);background:var(--pri);color:var(--on)}
.cp-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.color-dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;transition:all .2s;cursor:pointer}
.color-dot.sel{border-color:var(--text);transform:scale(1.18);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.m-btns{display:flex;gap:8px;margin-top:20px}
.m-cancel{flex:1;padding:11px;border-radius:10px;background:var(--bg2);color:var(--muted);font-weight:800;font-size:.9rem;border:1.5px solid var(--border)}
.m-save{flex:2;padding:11px;border-radius:10px;background:var(--pri);color:var(--on);font-weight:800;font-size:.9rem}
.m-save:active{transform:scale(.97)}

/* ── EMOJI PICKER ────────────────────────── */
.ep-bg{display:none;position:fixed;inset:0;background:color-mix(in srgb,var(--text) 45%,transparent);z-index:250;align-items:flex-end}
.ep-bg.open{display:flex}
.ep{background:var(--card);border-radius:22px 22px 0 0;width:100%;padding:14px 12px 28px;max-height:72vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.34,1.3,.64,1)}
.ep-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;flex-shrink:0}
.ep-cats::-webkit-scrollbar{display:none}
.ep-cat{flex-shrink:0;padding:6px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--bg);font-size:.76rem;font-weight:800;color:var(--muted);transition:all .2s}
.ep-cat.on{border-color:var(--pri);background:var(--pri);color:var(--on)}
.ep-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;overflow-y:auto;flex:1;padding-top:4px}
.ep-em{font-size:1.5rem;padding:7px 4px;text-align:center;cursor:pointer;border-radius:8px;transition:background .15s;line-height:1}
.ep-em:active{background:var(--bg2);transform:scale(1.2)}

/* ── TYPO: Blockschrift, Überschriften in Großbuchstaben ── */
.hdr-title,.adm-title,.modal h3,.done-ov h2,.done-cls,.wahl-t,.brot-t{text-transform:uppercase;letter-spacing:.045em;font-weight:700}
.hdr-title{font-size:1.4rem;line-height:1.15}
.hdr-date,.prog-label,.s-lbl,.as-lbl,.tg-kw,.tg-betrag-lbl,.tg-pig-lbl,.tg-hist-t,.field label,.bni{letter-spacing:.06em}
body{line-height:1.35;-webkit-text-size-adjust:100%}

/* ── BEDIENBARKEIT ───────────────────────── */
button{font-size:inherit;color:inherit}
.tc,.wi{width:100%;text-align:left;font:inherit}
.t-em,.t-body,.t-lbl,.t-sub{display:block}
.t-chk{width:30px;height:30px}
.tc{min-height:60px}
.wi{min-height:52px}
.wi[disabled]{cursor:default}
.ep-em{background:none}
.color-dot{padding:0;width:38px;height:38px}
.gear-btn,.ai-edit,.ai-del,.install-close,.adm-back{min-width:44px;min-height:44px}
.move-btn{min-width:36px;min-height:30px}
.adm-tab{min-height:44px}
.rt-pill,.ap,.ep-cat{min-height:40px}
.tog{width:52px;height:30px;border-radius:15px;padding:0}
.tog::after{width:24px;height:24px}
.tog.on::after{transform:translateX(22px)}
.field input{font-size:1rem;min-height:46px}
.m-cancel,.m-save{min-height:48px}
.bni{min-height:56px}
:focus-visible{outline:3px solid var(--acc-a);outline-offset:2px}
.field input:focus-visible{outline:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(400px,calc(100vw - 32px));background:var(--text);color:var(--on);padding:12px 18px;border-radius:12px;font-weight:700;font-size:.9rem;line-height:1.4;box-shadow:var(--sh2);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}#cf{display:none}}

/* ── ESSEN ───────────────────────────────── */
.ess-tags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.ess-tags::-webkit-scrollbar{display:none}
.ess-tags .ap{flex-shrink:0}
.ess-meal{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.ess-dish{display:flex;align-items:center;gap:12px;width:100%;background:none;text-align:left;font:inherit;padding:0;margin-bottom:6px}
.ess-em{font-size:2.4rem;line-height:1}
.ess-name{font-weight:700;font-size:1.2rem;line-height:1.25}
.ess-ingr{font-size:.8rem;color:var(--muted);font-weight:600;line-height:1.5}
.ess-none{font-size:.9rem;color:var(--muted);font-weight:700;padding:6px 0}
.ess-acts{display:flex;gap:8px;margin-top:12px}
.ess-acts .tg-act{min-height:46px}
.tg-act.pinned{border-color:var(--acc-a);color:var(--acc-a)}
.ess-rollweek{width:100%;margin:0 0 14px;min-height:46px}
.ess-day{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--sh)}
.ess-day.is-today{border-color:var(--acc-a)}
.ess-day.past{opacity:.55}
.ess-dlbl{width:42px;flex-shrink:0;font-weight:700;font-size:.9rem;padding-top:9px;text-transform:uppercase}
.ess-dlbl span{display:block;font-size:.75rem;color:var(--muted);font-weight:600;text-transform:none}
.ess-slots{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ess-slot{display:flex;align-items:center;gap:4px}
.ess-pick{flex:1;min-width:0;min-height:44px;text-align:left;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-weight:700;font-size:.88rem;line-height:1.3;overflow-wrap:anywhere}
.ess-list .ai-main{white-space:normal;line-height:1.25}
.ess-mi{margin-right:6px}
.ess-empty{color:var(--subtle)}
.ess-pin{min-width:44px;min-height:44px;background:none;border-radius:10px;filter:grayscale(1);opacity:.35;font-size:1rem}
.ess-pin.on{filter:none;opacity:1}
.ess-hint{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:10px}
.ess-rate{min-width:40px;min-height:40px;border-radius:10px;background:var(--bg);border:1.5px solid var(--border);font-size:1.05rem;filter:grayscale(1);opacity:.55;flex-shrink:0}
.ess-rate.on{filter:none;opacity:1;border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.ess-pickrow{width:100%;text-align:left;font:inherit}
.ess-pickrow.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--card))}
.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font:inherit;font-size:1rem;font-weight:600;color:var(--text);background:var(--bg);outline:none;resize:vertical;min-height:110px;line-height:1.5}
.field textarea:focus{border-color:var(--pri);background:var(--card)}
.bni{font-size:.64rem;letter-spacing:0;padding-left:1px;padding-right:1px}
/* ── EINKAUF ─────────────────────────────── */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ek-add{display:flex;gap:8px;margin-bottom:10px}
.ek-add input{flex:1;min-width:0;min-height:50px;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);font:inherit;font-size:1.05rem;font-weight:700;color:var(--text);background:var(--card);outline:none;box-shadow:var(--sh)}
.ek-add input:focus{border-color:var(--pri)}
.ek-plus{flex:0 0 54px;min-height:50px;border-radius:var(--r);font-size:1.4rem}
.ek-plan{margin-bottom:6px}
.ek-quick{margin-bottom:6px}
.ek-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ek-item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);text-align:left;font:inherit}
.ek-name{flex:1;min-width:0;font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.ek-row.done .ek-item{background:var(--bg);box-shadow:none}
.ek-row.done .ek-name{text-decoration:line-through;color:var(--subtle)}
.ek-row.done .t-chk{background:var(--green);border-color:var(--green)}
.ek-del{min-width:44px;min-height:44px;background:none;color:var(--subtle);font-size:1rem;border-radius:10px}
.ess-pickrow[disabled]{opacity:.5;cursor:default}

/* ═══ LOOK 2.0: minimalistisch, gerade Schrift, zwei Farbwelten ═══════════════
   Petrol (Standard) und Pop (data-look="pop"). Alle Farben als Tokens. */
:root{
  --bg:#F3EFE7;--bg2:#E9E3D8;--card:#FFFFFF;--border:#E2DBCE;
  --text:#17262A;--muted:#5B6667;--subtle:#8A9394;--on:#FFFFFF;
  --pri:#225D65;--hl:#225D65;
  --acc-a:#AE5238;--acc-b:#225D65;--acc-c:#5C633E;--acc-d:#B27D1A;--acc-e:#7A3B2E;
  --green:#2F7D5B;--gold:#D39B32;--gold-ink:#855B0A;
  --sh:none;--sh2:0 10px 32px rgba(23,38,42,.14);--r:12px;
}
:root[data-look="pop"]{
  --bg:#EFE7DA;--bg2:#E5DBCB;--card:#FBF8F2;--border:#DDD2C0;
  --text:#141210;--muted:#5C5449;--subtle:#8B8274;--on:#FFFFFF;
  --pri:#141210;--hl:#FF5B1F;
  --acc-a:#FF5B1F;--acc-b:#FF3D8B;--acc-c:#14B866;--acc-d:#F2A900;--acc-e:#6B4EFF;
  --green:#14B866;--gold:#FF5B1F;--gold-ink:#C2410C;
  --sh2:0 10px 32px rgba(20,18,16,.16);
}
html{background:var(--bg)}
body{font-family:var(--font);font-weight:500;letter-spacing:-.005em;line-height:1.4}
button,input,textarea{font-family:var(--font)}
/* Kopf */
.hdr{padding:18px 0 22px;align-items:center}
.hdr-title{font-weight:800;font-size:1.65rem;letter-spacing:-.015em;line-height:1.05;text-transform:uppercase}
.hdr-date{font-size:.72rem;font-weight:700;letter-spacing:.12em;margin-top:6px;color:var(--muted)}
:root[data-look="pop"] .hdr-date{color:var(--acc-b)}
.gear-btn{border:none;background:var(--card);border-radius:50%;width:44px;height:44px;padding:0;display:grid;place-items:center;color:var(--text)}
.gear-btn svg,.bni-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Überschriften und Labels */
.adm-title,.modal h3,.done-ov h2,.wahl-t,.brot-t{font-weight:800;letter-spacing:-.005em}
.modal h3{font-size:1.15rem}
.s-lbl,.as-lbl,.prog-label,.tg-kw,.tg-betrag-lbl,.tg-pig-lbl,.tg-hist-t,.field label,.ess-meal{font-weight:700;font-size:.68rem;letter-spacing:.14em;color:var(--muted)}
/* Flächen: flach, 1px-Linien, keine Schatten */
.tc,.tg-card,.ai,.brot,.wahl,.sp-entry,.ess-day,.ek-item,.tog-row,.install-hint,.wi,.sp-day,.tg-pig,.add-tc,.aa,.reset-btn,.field input,.field textarea,.ek-add input,.ess-pick,.rt-sel-btn,.brot-btn,.tg-btn,.tg-act,.m-cancel,.ap,.ep-cat,.rt-pill,.adm-back,.em-btn,.quick-all,.move-btn,.ess-rate,.rc-step{border-width:1px;box-shadow:none}
.tc,.tg-card,.ai,.brot,.wahl,.sp-entry,.ess-day,.ek-item,.tog-row,.install-hint{background:var(--card);border-color:var(--border)}
.tc{padding:14px 16px;gap:14px;min-height:62px}
.t-lbl,.ai-main,.sp-lbl,.ek-name,.wi-lbl{font-weight:700;letter-spacing:-.005em}
.t-sub,.ai-sub,.sp-time{font-weight:500}
.t-chk{border-width:1.5px}
.tc.done{background:transparent}
.add-tc,.aa{border-style:dashed}
.reset-btn{border-radius:var(--r)}
/* Knöpfe */
.m-save,.tg-act.ein,.done-cls{background:var(--pri);color:var(--on);font-weight:700;letter-spacing:.01em}
.m-save,.m-cancel,.tg-act,.brot-btn,.tg-btn{border-radius:10px}
.m-cancel{background:transparent;color:var(--text);border:1px solid var(--border)}
.done-cls{border-radius:99px}
.tg-act:disabled,.tg-act[disabled],.m-save:disabled{background:var(--bg2);color:var(--subtle);border-color:var(--border);cursor:default}
/* Kinder-Umschalter als Segment-Steuerung */
.kid-tabs{background:var(--bg2);border-radius:14px;padding:4px}
.kid-tab{border-radius:10px;font-weight:700;color:var(--muted)}
.kid-tab.on{background:var(--card);box-shadow:none;color:var(--kc,var(--text))}
/* Fortschritt */
.prog-track{height:4px;background:var(--bg2)}
.prog-fill{background:var(--hl)}
.prog-frac{font-weight:800;font-size:1rem}
.tg-betrag,.tg-pig-amt{font-weight:800;letter-spacing:-.02em}
.tg-h-amt{font-weight:700}
/* Pillen und Chips */
.rt-pill,.ap,.ep-cat{font-weight:700}
.rt-pill.on,.ap.on,.ep-cat.on,.sp-day.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.sp-day{background:var(--card)}

/* Navigation unten: Linien-Icons, aktiver Punkt */
.bot-nav{background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--border)}
.bni{gap:4px;color:var(--subtle);font-size:.6rem;letter-spacing:.08em;font-weight:700;padding-top:9px;position:relative}
.bni.on{color:var(--text)}
.bni.on::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--hl)}
.bni-ic{display:block;line-height:0}
/* Pop: knallige Akzente gezielt */
:root[data-look="pop"] .tg-act.pinned{border-color:var(--acc-b);color:var(--acc-b)}
:root[data-look="pop"] .ess-pin.on{filter:none}
:root[data-look="pop"] .ek-row.done .t-chk{background:var(--acc-c);border-color:var(--acc-c)}
:root[data-look="pop"] .ess-rate.on{border-color:var(--acc-b);background:color-mix(in srgb,var(--acc-b) 14%,var(--card))}
:root[data-look="pop"] .brot-btn.sel-ja{background:var(--acc-a);border-color:var(--acc-a);color:var(--text)}

:root[data-look="pop"] .ins-steps li::before{background:var(--acc-a);color:var(--text)}

/* Modale */
.modal,.ep{border-radius:20px 20px 0 0;background:var(--card)}
.mb,.ep-bg{background:color-mix(in srgb,var(--text) 40%,transparent)}
.field input,.field textarea{background:var(--bg);border-color:var(--border);font-weight:600}
.field input:focus,.field textarea:focus{border-color:var(--text);background:var(--card)}
/* Aussehen-Auswahl */
.look-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.look-opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);font:inherit;color:var(--text);min-height:44px}
.look-opt.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.look-opt strong{font-weight:800;font-size:.95rem}
.look-opt span:last-child{font-size:.75rem;color:var(--muted);font-weight:600;line-height:1.35}
.look-sw{display:flex;gap:4px}
.look-sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.08);display:block}

  if(!Object.keys(routines).length)routines=clone(DEF.routines);

  const wids=new Set();

  return{household,kids,routines,wahlPool,stundenplan,taschengeld,tgPay,tgPaySince,modules,essen,einkauf,aufgaben,kalender,wuensche,pin,installHintDone:!!c.installHintDone,_mv:sNum(c._mv,0,999)||0};
}
function sanitizeEssen(e,kids,adults){
  if(!e||typeof e!=='object'||Array.isArray(e))e=clone(DEF.essen); // ältere Stände: Beispielgerichte
  const kidIds=new Set([...kids,...(adults||[])].map(k=>k.id)),mealIds=MEALS.map(m=>m.id),tagIds=TAGS.map(t=>t.id);
  const meals={};mealIds.forEach(id=>{meals[id]=!!sObj(e.meals)[id];});
  if(!mealIds.some(id=>meals[id]))meals.abend=true;
  const ids=new Set();
  const dishes=sArr(e.dishes,300).map(d=>{const id=sId(d?.id),name=sStr(d?.name,60).trim();if(!id||ids.has(id)||!name)return null;ids.add(id);
    const ms=mealIds.filter(m=>sArr(d.meals,3).includes(m));
    const ratings={};Object.keys(sObj(d.ratings)).forEach(k=>{if(kidIds.has(k)&&(d.ratings[k]===1||d.ratings[k]===-1))ratings[k]=d.ratings[k];});
    return{id,em:sEm(d.em,'🍽️'),name,meals:ms.length?ms:['abend'],tags:tagIds.filter(t=>sArr(d.tags,10).includes(t)),
      ingr:sArr(d.ingr,100).map(x=>sStr(x,80).trim()).filter(Boolean).slice(0,60),ratings,
      portions:Math.round(sNum(d.portions,1,20))||4,steps:sArr(d.steps,100).map(x=>sStr(x,300).trim()).filter(Boolean).slice(0,30)};}).filter(Boolean);
  const plan={};
  Object.keys(sObj(e.plan)).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-120).forEach(ds=>{const p={};
    mealIds.forEach(m=>{const sl=sObj(sObj(e.plan[ds])[m]);if(ids.has(sl.id))p[m]={id:sl.id,pin:!!sl.pin};});
    if(Object.keys(p).length)plan[ds]=p;});
  return{meals,persons:Math.round(sNum(e.persons,1,20))||4,dishes,plan};
}
function sanitizeEinkauf(e){
  e=sObj(e);const ids=new Set();
  const items=sArr(e.items,300).map(x=>{const id=sId(x?.id),name=sStr(x?.name,80).trim();if(!id||ids.has(id)||!name)return null;ids.add(id);
    const n=Math.round(sNum(x.n,1,99))||1;return{id,name,n,done:!!x.done};}).filter(Boolean);
  const seen=new Set(),recent=[];
  sArr(e.recent,40).forEach(r=>{const name=sStr(r,80).trim(),k=ekKey(name);if(name&&!seen.has(k)&&recent.length<20){seen.add(k);recent.push(name);}});
  const cats={};Object.keys(sObj(e.cats)).slice(0,400).forEach(k=>{const key=sStr(k,80).toLowerCase().trim(),v=e.cats[k];if(key&&!BAD_IDS.includes(key)&&EK_CATS.some(c=>c.id===v))cats[key]=v;});
  const order=[];sArr(e.order,20).forEach(id=>{if(EK_CATS.some(c=>c.id===id)&&!order.includes(id))order.push(id);});
  EK_CATS.forEach(c=>{if(!order.includes(c.id))order.push(c.id);});
  const std=[],sk=new Set();sArr(e.std,100).forEach(r=>{const name=sStr(r,80).trim(),k=ekKey(name);if(name&&!sk.has(k)&&std.length<60){sk.add(k);std.push(name);}});
  return{items,recent,cats,order,std};
}

// Fehlklick-Paare entfernen: Pro Kind und Kalenderwoche heben sich „Wochengeld gespart (KW n)“ und
// „Sparen zurückgenommen (KW n)“ mit gleichem Betrag auf, unabhängig von der Reihenfolge (Uhren zweier
// Handys können abweichen). Übrig bleibt höchstens die jüngste Sparbuchung. Der Kontostand ändert sich nicht.
function compactTx(tx){
  const groups={};
  tx.forEach((x,i)=>{
    const g=/^Wochengeld gespart \(KW (\d+)\)$/.exec(x.note),z=/^Sparen zurückgenommen \(KW (\d+)\)$/.exec(x.note);
    const m=g&&x.amt>0?['g',g[1]]:z&&x.amt<0?['z',z[1]]:null;if(!m)return;
    const k=x.kid+'|'+m[1]+'|'+Math.abs(x.amt);(groups[k]||={g:[],z:[]})[m[0]].push(i);
  });
  const drop=new Set();
  Object.values(groups).forEach(({g,z})=>{const n=Math.min(g.length,z.length);
    z.slice(0,n).forEach(i=>drop.add(i));g.slice(0,n).forEach(i=>drop.add(i));}); // älteste Sparbuchungen fallen weg, jüngste bleibt
  return drop.size?tx.filter((_,i)=>!drop.has(i)):tx;
}

function loadCfg(){
  const raw=lsGet('ra_cfg3');
  if(raw&&typeof raw==='object'&&!Array.isArray(raw)){
    const before=JSON.stringify(raw);
    try{
      // Fehlende Bereiche aus den Startdaten ergänzen, bestehende Werte nie überschreiben
      if(!raw.stundenplan)raw.stundenplan=clone(DEF.stundenplan);
      if(!raw.taschengeld)raw.taschengeld=clone(DEF.taschengeld);
      ensureHousehold(raw);
      // Datenmodell-Version; künftige Migrationen hier, nur wenn die Version zurückliegt
      if((raw._mv||0)<4)raw._mv=4;
    }catch(e){}
    const c=sanitizeCfg(raw);
    if(c){if(JSON.stringify(c)!==before)lsSet('ra_cfg3',JSON.stringify(c));return c;}
  }
  return sanitizeCfg(clone(DEF));
}

// ═══ HELPERS ══════════════════════════════════
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function firstActiveRt(){return Object.keys(S.routines).find(k=>S.routines[k].active)||'morgen';}
function todayDow(){return{0:'so',1:'mo',2:'di',3:'mi',4:'do',5:'fr',6:'sa'}[new Date().getDay()]||'mo';}
function weekKey(){const d=new Date(),thu=new Date(d);thu.setDate(d.getDate()-(d.getDay()+6)%7+3);const ft=new Date(thu.getFullYear(),0,4);const kw=Math.round(1+(thu-ft)/6048e5);return`${thu.getFullYear()}W${String(kw).padStart(2,'0')}`;}
function weekKeyOf(ds){const d=pdate(ds),thu=new Date(d);thu.setDate(d.getDate()-(d.getDay()+6)%7+3);const ft=new Date(thu.getFullYear(),0,4);const kw=Math.round(1+(thu-ft)/6048e5);return`${thu.getFullYear()}W${String(kw).padStart(2,'0')}`;}
function getKW(){const d=new Date(),thu=new Date(d);thu.setDate(d.getDate()-(d.getDay()+6)%7+3);const ft=new Date(thu.getFullYear(),0,4);return Math.round(1+(thu-ft)/6048e5);}
function fmt(n){return n.toFixed(2).replace('.',',')+' €';}

// ═══ ROUTINE HELPERS ══════════════════════════
function kidTasks(rtId,kidId){return(S.routines[rtId]?.tasks||[]).filter(t=>t.to==='all'||t.to===kidId);}
function kidChks(rtId,kidId){return D.chk?.[rtId]?.[kidId]||{};}
function kidWahl(rtId,kidId){return D.wahl?.[rtId]?.[kidId]||null;}
function doneCount(rtId,kidId){const tasks=kidTasks(rtId,kidId),chks=kidChks(rtId,kidId),wahlId=kidWahl(rtId,kidId),wahlOn=S.routines[rtId]?.wahl;let n=tasks.filter(t=>chks[t.id]).length;if(wahlOn&&wahlId&&chks['w_'+wahlId])n++;return n;}
function totalCount(rtId,kidId){return kidTasks(rtId,kidId).length+(S.routines[rtId]?.wahl&&kidWahl(rtId,kidId)?1:0);}

function buildApp(){
  if(!S.household)return buildOnboarding();
  ensureView();
  const kid=S.kids.find(k=>k.id===UI.kid);
  const col=kid?.col||'b';
  const dateStr=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});

  // MAIN CONTENT
  let content='';
  if(UI.view==='routine') content=buildRoutineContent(kid,col);
  else if(UI.view==='stundenplan') content=buildSpContent(kid);
  else if(UI.view==='taschengeld') content=buildTgContent(kid);
  else if(UI.view==='essen') content=buildEssenContent();
  else if(UI.view==='einkauf') content=buildEinkaufContent();
  else if(UI.view==='aufgaben') content=buildAufgabenContent();
  else if(UI.view==='kalender') content=buildKalenderContent();
  else if(UI.view==='heute') content=buildHeute();
  else if(UI.view==='wuensche') content=buildWishContent(kid);

  const viewTitle={routine:`${esc(S.routines[UI.rt]?.label||'Morgen')}routine`,essen:'Essen',einkauf:'Einkauf',aufgaben:'Aufgaben',kalender:'Kalender',heute:'Heute',stundenplan:'Stundenplan',taschengeld:'Taschengeld',wuensche:'Wünsche'}[UI.view];

  </div>

  ${kidSeg}
  ${!isKidView(UI.view)||!S.kids.length?'':`<div class="kid-tabs" role="tablist" aria-label="Kind wählen">${S.kids.map(k=>`<button class="kid-tab${k.id===UI.kid?' on c'+k.col:''}" onclick="setKid('${k.id}')"><span class="av">${esc(k.icon)}</span>${esc(k.name)}</button>`).join('')}</div>`}

  </div></nav>`:''}`;
}

// ─── ROUTINE VIEW ──────────────────────────────
function buildRoutineContent(kid,col){
  if(!kid||!S.routines[UI.rt]) return '<p style="padding:40px;text-align:center;color:var(--muted);font-weight:700">Keine Kinder vorhanden</p>';
  const rt=S.routines[UI.rt];
  const tasks=kidTasks(UI.rt,UI.kid),chks=kidChks(UI.rt,UI.kid),wahlId=kidWahl(UI.rt,UI.kid);
  const done=doneCount(UI.rt,UI.kid),total=totalCount(UI.rt,UI.kid),pct=total>0?Math.round(done/total*100):0;
  const brotVal=D.brot?.[UI.rt]?.[UI.kid]||null;
  const activeRts=Object.values(S.routines).filter(r=>r.active);
  const allDone=total>0&&done>=total;
  return`${activeRts.length>1?`<div class="rt-pills">${activeRts.map(r=>`<button class="rt-pill${r.id===UI.rt?' on':''}" onclick="setRt('${r.id}')">${esc(r.icon)} ${esc(r.label)}</button>`).join('')}</div>`:''}
  <div class="prog"><div class="prog-row"><span class="prog-label">Fortschritt</span><span class="prog-frac">${done} / ${total}</span></div><div class="prog-track"><div class="prog-fill${allDone?' done-fill':''}" style="width:${pct}%"></div></div></div>
  ${rt.brot?`<div class="brot"><div class="brot-h"><span style="font-size:1.5rem;line-height:1">🍞</span><div><div class="brot-t">Brauch ich ein Brot?</div><div class="brot-s">Kurz überlegen!</div></div></div><div class="brot-row"><button class="brot-btn${brotVal==='ja'?' sel-ja':''}" onclick="setBrot('ja')">Ja, bitte!</button><button class="brot-btn${brotVal==='nein'?' sel-nein':''}" onclick="setBrot('nein')">Nein, passt!</button></div><div class="brot-ans${brotVal==='ja'?' loud':''}">${brotVal==='ja'?'📢 Mama oder Papa Bescheid sagen!':brotVal==='nein'?'Kein Brot heute ✓':''}</div></div>`:''}
  <div class="s-lbl">Aufgaben</div>
  ${tasks.map(t=>`<button type="button" class="tc${chks[t.id]?' done c'+col:''}" aria-pressed="${chks[t.id]?'true':'false'}" onclick="toggleTask('${UI.rt}','${UI.kid}','${t.id}')"><span class="t-em">${esc(t.em)}</span><span class="t-body"><span class="t-lbl">${esc(t.lbl)}</span>${t.sub?`<span class="t-sub">${esc(t.sub)}</span>`:''}</span><span class="t-chk">${chks[t.id]?'✓':''}</span></button>`).join('')}
  ${rt.wahl?buildWahlWidget(UI.rt,UI.kid,wahlId,chks):''}
  <button class="add-tc" onclick="openTaskModal('${UI.rt}',null)">＋ Aufgabe hinzufügen</button>
  ${modOn('aufgaben')?kidTodos(UI.kid):''}
  ${modOn('kalender')?kidEvents(UI.kid):''}`;
}

function buildWahlWidget(rtId,kidId,wahlId,chks){
  const pool=S.wahlPool,wahlDone=wahlId&&chks['w_'+wahlId];
  return`<div class="wahl"><div class="wahl-t">🏠 Meine Aufgabe heute</div><div class="wahl-s">${!wahlId?'Wähle eine Aufgabe aus:':wahlDone?'Erledigt!':'Tippe zum Abhaken. Andere antippen zum Wechseln.'}</div>${pool.map(w=>{const isSel=w.id===wahlId,isDone=isSel&&wahlDone;return`<button type="button" class="wi${isSel?(isDone?' done-item':' sel'):(wahlDone?' faded':'')}" onclick="${isSel?`toggleWahlDone('${rtId}','${kidId}','${w.id}')`:`setWahl('${rtId}','${kidId}','${w.id}')`}" ${wahlDone&&!isSel?'disabled':''}><span class="wi-em">${esc(w.em)}</span><span class="wi-lbl">${esc(w.lbl)}</span>${isSel?`<span class="wi-chk">${isDone?'✓':''}</span>`:''}</button>`;}).join('')}</div>`;
}

// ─── STUNDENPLAN VIEW ──────────────────────────
function buildSpContent(kid){
  if(!kid)return'';
  const day=UI.spDay||todayDow();
  const todayD=todayDow();
  const entries=(S.stundenplan?.[UI.kid]?.[day])||[];
  return`<div class="sp-days">${DAYS.map(d=>`<button class="sp-day${d.id===day?' on':''}${d.id===todayD?' is-today':''}" onclick="setSpDay('${d.id}')"><span>${esc(d.s)}</span>${d.id===todayD?'<span class="sp-today-badge">Heute</span>':''}</button>`).join('')}</div>
  ${entries.length>0?entries.map(e=>{const sub=[e.time,e.teacher].filter(Boolean).join(' · ');return`<div class="sp-entry"><div class="sp-em">${esc(e.em)}</div><div style="flex:1"><div class="sp-lbl">${esc(e.lbl)}</div>${sub?`<div class="sp-time">${esc(sub)}</div>`:''}</div></div>`;}).join(''):`<div class="sp-empty">Noch keine Einträge für ${DAYS.find(d=>d.id===day)?.l||day}.<br>Im ⚙️ Menü → Stundenplan hinzufügen.</div>`}`;
}

// ─── TASCHENGELD VIEW ──────────────────────────
function buildTgContent(kid){
  if(!kid)return'';
  const tg=S.taschengeld?.[UI.kid];
  if(!tg?.aktiv)return`<div class="tg-inactive">Taschengeld für ${esc(kid.name)} ist nicht aktiv.<br>Im ⚙️ Menü → Taschengeld aktivieren.</div>`;
  const wk=weekKey(),kw=getKW();
  const status=TGD[`${UI.kid}:${wk}`]||null;
  const savings=SAVINGS[UI.kid]||0;
  const statusTxt=status==='ausgezahlt'?'✓ Diese Woche ausgezahlt · nochmal tippen nimmt es zurück':status==='gespart'?'🐷 Diese Woche gespart · nochmal tippen nimmt es zurück':'Noch nicht festgelegt';
  return`<div class="tg-kw">KW ${kw} — ${new Date().getFullYear()}</div>
  <div class="tg-card">
    <div class="tg-top">
      <div><div class="tg-betrag">${fmt(tg.betrag)}</div><div class="tg-betrag-lbl">pro Woche</div></div>
      <div class="tg-week-lbl">diese<br>Woche</div>
    </div>
    <div class="tg-btns">
      <button class="tg-btn${status==='ausgezahlt'?' on-ausg':''}" onclick="setTgStatus('ausgezahlt')"><span class="tg-btn-em">💰</span>Ausgezahlt</button>
      <button class="tg-btn${status==='gespart'?' on-spar':''}" onclick="setTgStatus('gespart')"><span class="tg-btn-em">🐷</span>Sparen</button>
    </div>
    <div class="tg-status">${statusTxt}</div>
    <div class="tg-pig">
      <div class="tg-pig-em">🐷</div>
      <div class="tg-pig-info"><div class="tg-pig-lbl">Sparschwein</div><div class="tg-pig-amt">${fmt(savings)}</div></div>
    </div>
    <div class="tg-acts">
      <button class="tg-act ein" onclick="openTgMoveModal('ein')">＋ Einzahlen</button>
      <button class="tg-act" onclick="openTgMoveModal('aus')" ${savings<=0?'disabled':''}>Auszahlen</button>
    </div>
    ${buildTgHist(UI.kid)}
  </div>`;
}
function buildTgHist(kidId){
  const rows=TX.filter(x=>x.kid===kidId).slice(-5).reverse();
  if(!rows.length)return'';
  return`<div class="tg-hist"><div class="tg-hist-t">Letzte Buchungen</div>${rows.map(x=>{
    const d=new Date(x.t);const ds=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
    const plus=x.amt>0;
    return`<div class="tg-h-row"><span class="tg-h-date">${ds}</span><span class="tg-h-note">${esc(x.note||(plus?'Einzahlung':'Auszahlung'))}</span><span class="tg-h-amt ${plus?'plus':'minus'}">${plus?'+':'−'}${fmt(Math.abs(x.amt))}</span></div>`;}).join('')}</div>`;
}

function applyImport(data){
  if(!data||typeof data!=='object'||Array.isArray(data))return false;
  const raw=data.cfg;
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.kids))return false;
  ensureHousehold(raw);
  const c=sanitizeCfg(raw);if(!c)return false;
  S=c;saveCfg();
  if(data.tgd){TGD=sanitizeTgd(data.tgd);saveTgd();}
  if(data.savings){SAVINGS=sanitizeSavings(data.savings);saveSavings();}
  if(data.tx){TX=sanitizeTx(data.tx);saveTx();}
  UI.ob=null;UI.kid=S.kids[0]?.id||null;UI.aSpKid=UI.kid;UI.rt=firstActiveRt();
  return true;
}
function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;
  if(file.size>1e6){toast('Datei ist zu groß für ein FamOS-Backup.');return;}
  const reader=new FileReader();reader.onload=ev=>{let data=null;try{data=JSON.parse(ev.target.result);}catch(err){}
    if(!data){toast('Das ist keine gültige Backup-Datei.');return;}
    if(S.household&&!confirm('Import ersetzt alle Daten auf diesem Gerät. Fortfahren?'))return;
    if(applyImport(data)){closeModal();closeAdmin();render();toast('✓ Import erfolgreich');}else toast('Import fehlgeschlagen. Datei passt nicht zu FamOS.');};

// Lieblingsgerichte, Würfeln (gewichtet nach Bewertung und zuletzt gegessen), Wochenplan mit 📌
function activeMeals(){return MEALS.filter(m=>S.essen.meals[m.id]);}
function mealOf(id){return MEALS.find(m=>m.id===id);}
function dishById(id){return S.essen.dishes.find(d=>d.id===id)||null;}
function dstr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function pdate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function addDays(s,n){const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);}
function daysBetween(a,b){return Math.round((pdate(b)-pdate(a))/864e5);}
function weekDates(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+7*(off||0));const mo=dstr(d);return DAYS.map((_,i)=>addDays(mo,i));}
function planSlot(ds,meal){const sl=S.essen.plan[ds]?.[meal];return sl&&dishById(sl.id)?sl:null;}
function setSlot(ds,meal,id,pin){const P=S.essen.plan;if(id){if(!P[ds])P[ds]={};P[ds][meal]={id,pin:!!pin};}else if(P[ds]){delete P[ds][meal];if(!Object.keys(P[ds]).length)delete P[ds];}}
function pruneEssen(){const min=addDays(today(),-35);Object.keys(S.essen.plan).forEach(k=>{if(k<min)delete S.essen.plan[k];});}
function lastPlanned(id,before){let best=null;for(const ds in S.essen.plan){if(ds>=before)continue;if(Object.values(S.essen.plan[ds]).some(sl=>sl.id===id)&&(!best||ds>best))best=ds;}return best;}
function weekIds(dates,skipDs,skipMeal){const ids=new Set();dates.forEach(ds=>Object.entries(S.essen.plan[ds]||{}).forEach(([m,sl])=>{if(!(ds===skipDs&&m===skipMeal))ids.add(sl.id);}));return ids;}
// Gewicht: 👍 eines Kindes ×1,6, 👎 ×0,4 (seltener, nie ausgeschlossen); kürzlich gegessen deutlich seltener; schon in dieser Woche ×0,15
function dishWeight(d,meal,ds,avoid){
  if(!d.meals.includes(meal))return 0;
  let w=1;
  const who=new Set(raters().map(p=>p.id));
  Object.entries(d.ratings).forEach(([k,v])=>{if(who.has(k))w*=v>0?1.6:0.4;});
  const last=lastPlanned(d.id,ds);
  if(last){const n=daysBetween(last,ds);w*=n<=3?0.1:n<=7?0.35:n<=14?0.7:1;}
  if(avoid&&avoid.has(d.id))w*=0.15;
  return w;
}
function pickDish(meal,ds,avoid,tag,exclude){
  let c=S.essen.dishes.filter(d=>!tag||d.tags.includes(tag)).map(d=>[d,dishWeight(d,meal,ds,avoid)]).filter(x=>x[1]>0);
  if(exclude&&c.length>1)c=c.filter(x=>x[0].id!==exclude);
  if(!c.length)return null;
  let r=Math.random()*c.reduce((sum,x)=>sum+x[1],0);
  for(const[d,w]of c){if((r-=w)<0)return d.id;}
  return c[c.length-1][0].id;
}
function rollToday(meal){
  const td=today(),cur=planSlot(td,meal);if(cur?.pin)return;
  const id=pickDish(meal,td,weekIds(weekDates(0),td,meal),null,cur?.id);
  if(!id){toast(`Noch kein Gericht für ${mealOf(meal).l} im Kochbuch.`);return;}
  setSlot(td,meal,id,false);pruneEssen();saveCfg();render();
}
function rollWeek(){
  const dates=weekDates(UI.essWeek),td=today(),meals=activeMeals();let n=0;
  dates.forEach(ds=>{if(ds<td)return;meals.forEach(m=>{if(!planSlot(ds,m.id)?.pin)setSlot(ds,m.id,null);});});
  dates.forEach(ds=>{if(ds<td)return;meals.forEach(m=>{if(planSlot(ds,m.id))return;const id=pickDish(m.id,ds,weekIds(dates),null,null);if(id){setSlot(ds,m.id,id,false);n++;}});});
  pruneEssen();saveCfg();render();
  toast(n?`${n} ${n===1?'Mahlzeit':'Mahlzeiten'} gewürfelt`:'Nichts zu würfeln: alles festgelegt oder keine passenden Gerichte.');
}
function togPin(ds,meal){const sl=planSlot(ds,meal);if(!sl)return;sl.pin=!sl.pin;saveCfg();render();}
// Alle, die bewerten dürfen: Kinder und Erwachsene des Haushalts
function raters(){return[...S.kids.map(k=>({id:k.id,icon:k.icon,name:k.name})),...(S.household?.adults||[]).map(a=>({id:a.id,icon:a.icon,name:a.name}))];}
// Antippen schaltet durch: keine Meinung → 👍 → 👎 → keine Meinung
function rateDish(id,who){const d=dishById(id);if(!d||!raters().some(p=>p.id===who))return;
  const v=d.ratings[who];if(v===1)d.ratings[who]=-1;else if(v===-1)delete d.ratings[who];else d.ratings[who]=1;
  saveCfg();if(document.getElementById('mb').classList.contains('open')&&UI.form?.mode==='recipe')openModal();render();}
function rateRow(d){const ps=raters();if(!ps.length)return'';
  return`<div class="rate-row" role="group" aria-label="Bewertung">${ps.map(p=>{const v=d.ratings[p.id]||0,l=v>0?'mag es':v<0?'mag es nicht':'noch keine Meinung';
    return`<button class="rate-chip${v>0?' up':v<0?' down':''}" aria-label="${esc(p.name)}: ${l}. Tippen zum Ändern" onclick="event.stopPropagation();rateDish('${d.id}','${p.id}')"><span class="rate-who">${esc(p.icon)}</span><span class="rate-v">${v>0?'👍':v<0?'👎':'·'}</span></button>`;}).join('')}</div>`;}

function buildEssPlan(){
  const dates=weekDates(UI.essWeek),meals=activeMeals(),td=today(),showToday=dates.includes(td);
  const todayCard=m=>{const sl=planSlot(td,m.id),d=sl&&dishById(sl.id);

    ${d?`<button class="ess-dish" onclick="openRecipe('${d.id}','${td}','${m.id}')"><span class="ess-em">${dishIc(d,64)}</span><span class="ess-name">${esc(d.name)}</span></button><button class="ess-rc" onclick="openRecipe('${d.id}','${td}','${m.id}')">Rezept ansehen${d.steps.length?` · ${d.steps.length} Schritte`:''} →</button>`:`<div class="ess-none">Noch nichts geplant</div>`}

  const rest=dates.filter(ds=>ds>td||(!showToday&&ds>=td));
  return`${showToday?`<div class="s-lbl">Heute</div>${meals.map(todayCard).join('')}`:''}
  <div class="ess-weekhead"><div class="rt-pills" style="margin:0"><button class="rt-pill${UI.essWeek===0?' on':''}" onclick="setEssWeek(0)">Diese Woche</button><button class="rt-pill${UI.essWeek===1?' on':''}" onclick="setEssWeek(1)">Nächste</button></div><button class="ess-roll" onclick="rollWeek()">Woche würfeln</button></div>

// ─── Mengen: „500 g Mehl“ erkennen, umrechnen, zusammenzählen ───
const UNITS={g:['g',1],gr:['g',1],gramm:['g',1],kg:['g',1000],mg:['g',.001],ml:['ml',1],l:['ml',1000],liter:['ml',1000],cl:['ml',10],dl:['ml',100],
  el:['EL',1],tl:['TL',1],prise:['Prise',1],prisen:['Prise',1],dose:['Dose',1],dosen:['Dose',1],pck:['Pck.',1],packung:['Pck.',1],packungen:['Pck.',1],'päckchen':['Pck.',1],
  bund:['Bund',1],'stück':['',1],stk:['',1],becher:['Becher',1],zehe:['Zehe',1],zehen:['Zehe',1],scheibe:['Scheibe',1],scheiben:['Scheibe',1],
  tasse:['Tasse',1],tassen:['Tasse',1],glas:['Glas',1],'gläser':['Glas',1],flasche:['Flasche',1],flaschen:['Flasche',1]};
const COUNTABLE=new Set(['','Dose','Pck.','Bund','Becher','Zehe','Scheibe','Glas','Flasche']);
const FRAC={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
function parseIngr(line){
  const t=String(line).trim(),m=t.match(/^(\d+(?:[.,]\d+)?|\d+\/\d+|[½¼¾⅓⅔])\s*([A-Za-zÄÖÜäöüß]+\.?)?\s+(.+)$/)||t.match(/^(\d+(?:[.,]\d+)?)([A-Za-zÄÖÜäöüß]+\.?)$/);
  if(!m)return{q:null,u:'',name:t};
  const raw=m[1];let q=FRAC[raw]??(raw.includes('/')?raw.split('/').reduce((a,b)=>a/b):parseFloat(raw.replace(',','.')));
  const uw=(m[2]||'').toLowerCase().replace(/\.$/,''),unit=UNITS[uw];
  if(!Number.isFinite(q)||q<=0)return{q:null,u:'',name:t};
  if(unit)return{q:q*unit[1],u:unit[0],name:(m[3]||'').trim()||t};
  return{q,u:'',name:((m[2]||'')+' '+(m[3]||'')).trim()};
}
function fmtNum(q){const r=q>=100?Math.round(q):Math.round(q*100)/100;return String(r).replace('.',',');}
function fmtIngr(p){
  if(p.q==null)return p.name;
  let q=p.q,u=p.u;
  if(u==='g'&&q>=1000){q/=1000;u='kg';}else if(u==='ml'&&q>=1000){q/=1000;u='l';}
  return`${fmtNum(q)}${u?' '+u:''} ${p.name}`;
}
// Menge für die Personenzahl. Fürs Einkaufen (shop) wird Zählbares aufgerundet: keine halben Dosen kaufen
function scaleIngr(p,f,shop){if(p.q==null)return p;let q=p.q*f;
  if(shop&&COUNTABLE.has(p.u))q=Math.ceil(q-1e-9);else if(shop&&(p.u==='g'||p.u==='ml'))q=q>=50?Math.round(q/5)*5:Math.round(q);
  return{...p,q};}
function dishFactor(d,persons){return(persons||S.essen.persons||4)/(d.portions||4);}

// Portionen im Formular ändern rechnet die Zutaten mit um. Gerechnet wird immer vom Ausgangsstand

function scaleLine(line,f){return line.replace(/^(\s*)(\d+(?:[.,]\d+)?|\d+\/\d+|[½¼¾⅓⅔])/,(m,sp,raw)=>{
  const q=FRAC[raw]??(raw.includes('/')?raw.split('/').reduce((a,b)=>a/b):parseFloat(raw.replace(',','.')));
  return Number.isFinite(q)&&q>0?sp+fmtNum(q*f):m;});}

  f.ingr=String(f.baseIngr||'').split('\n').map(l=>scaleLine(l,n/f.basePort)).join('\n');

// ═══ EINKAUF ══════════════════════════════════
function ekCatKey(name){return parseIngr(name).name.toLowerCase().replace(/\s+/g,' ').trim();}
function ekGuessCat(name){
  const p=parseIngr(name);if(p.u==='Dose'||p.u==='Glas')return'vorrat';
  const t=p.name.toLowerCase(),tokens=t.split(/[^a-zäöüß-]+/).filter(Boolean);
  for(const x of tokens)for(const[sig,cat]of Object.entries(EK_SIGNAL))if(x===sig||x.startsWith(sig))return cat;
  let best=null;
  for(const[k,cat]of EK_DICT){let end=-1;
    if(k.length<=4){let off=0;for(const x of tokens){const at=t.indexOf(x,off);off=at+x.length;
        if(x===k||x.endsWith(k))end=Math.max(end,at+x.length);else if(x.startsWith(k))end=Math.max(end,at+k.length);}}
    else{const i=t.lastIndexOf(k);if(i>=0)end=i+k.length;}
    if(end<0)continue;
    if(!best||end>best.end||(end===best.end&&k.length>best.len))best={end,len:k.length,cat};
  }
  return best?best.cat:'sonst';
}
function ekCat(name){return S.einkauf.cats[ekCatKey(name)]||ekGuessCat(name);}
function ekCatOf(id){return EK_CATS.find(c=>c.id===id)||EK_CATS[EK_CATS.length-1];}

function ekKey(name){return String(name).toLowerCase().replace(/\s+/g,' ').trim();}
function ekOpen(){return S.einkauf.items.filter(x=>!x.done);}
function ekFind(name){const k=ekKey(name);return ekOpen().find(x=>ekKey(x.name)===k)||null;}
function ekAdd(name,n){
  name=String(name||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,80);if(!name)return false;
  if(ekFind(name)){toast(`${name} steht schon auf der Liste.`);return false;}
  if(S.einkauf.items.length>=300){toast('Die Liste ist voll. Bitte erst Erledigtes entfernen.');return false;}
  const it={id:uid(),name,n:n||1,done:false};S.einkauf.items.push(it);ekOp('up',it);return true;
}
function ekAddInput(){const el=document.getElementById('ekNew'),v=UI.ekNew||el?.value||'';
  if(ekAdd(v)){UI.ekNew='';saveCfg();render();setTimeout(()=>document.getElementById('ekNew')?.focus(),0);}}
function ekQuick(i){const name=S.einkauf.recent[i];if(name&&ekAdd(name)){saveCfg();render();}}
function ekToggle(id){const x=S.einkauf.items.find(i=>i.id===id);if(!x)return;x.done=!x.done;ekOp('up',x);saveCfg();render();}
function ekDel(id){S.einkauf.items=S.einkauf.items.filter(i=>i.id!==id);ekOp('del',{id});saveCfg();render();}
function ekRemember(name){const R=S.einkauf.recent,k=ekKey(name),i=R.findIndex(r=>ekKey(r)===k);if(i>=0)R.splice(i,1);R.unshift(name);if(R.length>20)R.length=20;}
function ekClearDone(){const done=S.einkauf.items.filter(x=>x.done);if(!done.length)return;
  done.slice().reverse().forEach(x=>ekRemember(x.name));
  done.forEach(x=>ekOp('del',x));S.einkauf.items=ekOpen();saveCfg();render();toast(`${done.length} erledigt und entfernt`);}
// Zutaten aus dem Wochenplan; diese Woche erst ab heute
function ekPlanLines(off){
  const td=today(),lines=new Map(),dishes=new Set();
  weekDates(off).filter(ds=>ds>=td).forEach(ds=>activeMeals().forEach(m=>{const sl=planSlot(ds,m.id),d=sl&&dishById(sl.id);if(!d)return;dishes.add(d.id);
    const fac=dishFactor(d);
    d.ingr.forEach(g=>{const p=parseIngr(g);
      if(p.q==null){const k=ekKey(p.name),cur=lines.get(k);if(cur)cur.n++;else lines.set(k,{p,n:1});return;}
      const k=ekKey(p.name)+'|'+p.u,cur=lines.get(k),q=p.q*fac;if(cur)cur.p.q+=q;else lines.set(k,{p:{...p,q},n:1});});}));
  return{lines:[...lines.values()].map(l=>({name:fmtIngr(scaleIngr(l.p,1,true)),n:l.n})),dishes:dishes.size};
}
function openEkPlanModal(){UI.form={mode:'ekPlan'};openModal();}
function renderEkPlanModal(){
  const opt=(off,l)=>{const r=ekPlanLines(off);return`<button class="ai ess-pickrow" onclick="ekFromPlan(${off})" ${r.lines.length?'':'disabled'}><span class="ai-em">${off?'⏭️':'📅'}</span><span class="ai-info"><span class="ai-main">${l}</span><span class="ai-sub">${r.lines.length?`${r.lines.length} Zutaten aus ${r.dishes} ${r.dishes===1?'Gericht':'Gerichten'}`:'Noch nichts geplant'}</span></span></button>`;};
  return`<h3>Aus dem Wochenplan</h3>

  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button></div>`;
}
function ekFromPlan(off){
  const r=ekPlanLines(off);let added=0,had=0;
  r.lines.forEach(l=>{if(ekFind(l.name)){had++;return;}if(S.einkauf.items.length>=300)return;const it={id:uid(),name:l.name.slice(0,80),n:Math.min(99,l.n),done:false};S.einkauf.items.push(it);ekOp('up',it);added++;});
  saveCfg();closeModal();render();
  toast(added?`${added} ${added===1?'Zutat':'Zutaten'} übernommen${had?`, ${had} standen schon drauf`:''}`:'Alles stand schon auf der Liste.');

function buildEinkaufContent(){
  const open=ekOpen(),done=S.einkauf.items.filter(x=>x.done),onList=new Set(open.map(x=>ekKey(x.name)));

async function runLinkImport(){const f=UI.form,url=String(f.url||'').trim();
  if(!/^https?:\/\/[^\s]+\.[^\s]+/.test(url)){f.err='Bitte einen vollständigen Link einfügen (https://…).';openModal();return;}
  f.busy=true;f.err='';openModal();
  try{const r=await sb('/functions/v1/recipe-import',{method:'POST',body:{url}});const x=r?.recipe;

    openDishPrefilled({name:x.name,ingr:x.ingredients,steps:x.steps,portions:x.portions});toast('Übernommen. Bitte prüfen und speichern.');}
  catch(e){f.busy=false;f.err=e.status===404?'Die Import-Funktion ist in Supabase noch nicht eingerichtet.':e.status===401?'Bitte neu anmelden.':(e.message||'Das hat nicht geklappt.');openModal();}
}

const CLAUDE_PROMPTS={
rezept:`Lies das Rezept auf dem Foto (oder im Text) und gib es für meine App FamOS zurück.
Antworte NUR mit einem einzigen Codeblock (\`\`\`json … \`\`\`), damit ich ihn mit dem Kopieren-Knopf übernehmen kann. Kein Text davor oder danach. Inhalt in genau diesem Format:
{"famos":"rezept","name":"Spaghetti Bolognese","emoji":"🍝","portionen":4,"zutaten":["500 g Spaghetti","1 Dose Tomaten"],"schritte":["Zwiebel würfeln und anbraten","…"],"mahlzeiten":["abend"],"eigenschaften":["fleisch"]}
Regeln:
- zutaten: eine Zutat pro Eintrag, Menge und Einheit vorne (g, kg, ml, l, EL, TL, Prise, Dose, Bund, Pck.)
- schritte: kurze Arbeitsschritte, einer pro Eintrag
- portionen: Zahl, für wie viele Personen das Rezept ist
- mahlzeiten aus: fruehstueck, mittag, abend
- eigenschaften aus: veg, schnell, we, fleisch, fisch
- Mehrere Rezepte: als Liste [ {...}, {...} ]`,
stundenplan:`Lies den Stundenplan auf dem Foto und gib ihn für meine App FamOS zurück.
Antworte NUR mit einem einzigen Codeblock (\`\`\`json … \`\`\`), damit ich ihn mit dem Kopieren-Knopf übernehmen kann. Kein Text davor oder danach. Inhalt in genau diesem Format:
{"famos":"stundenplan","tage":{"mo":[{"fach":"Mathe","von":"8:15","bis":"9:00","lehrkraft":"Fr. Muster","emoji":"📐"}],"di":[],"mi":[],"do":[],"fr":[]}}
Regeln:
- Tage: mo, di, mi, do, fr (sa, so nur wenn vorhanden), Stunden in zeitlicher Reihenfolge
- von/bis nur, wenn auf dem Plan Zeiten stehen; lehrkraft nur, wenn sie dasteht
- emoji: ein passendes Emoji zum Fach
- Pausen nur, wenn sie im Plan stehen`};
function openClaude(kind){UI.form={mode:'claude',kind,text:'',err:'',preview:null,kid:UI.aSpKid||S.kids[0]?.id};openModal();}
function copyClaudePrompt(){const t=CLAUDE_PROMPTS[UI.form.kind];
  try{navigator.clipboard.writeText(t).then(()=>toast('Text für Claude kopiert'),()=>{UI.form.showPrompt=true;openModal();});}catch(e){UI.form.showPrompt=true;openModal();}}
function renderClaudeModal(){const f=UI.form,rz=f.kind==='rezept',P=f.preview;
  if(P)return`<h3>Vorschau</h3>${rz?`<div class="al">${P.map(d=>`<div class="ai"><div class="ai-em">${esc(d.em)}</div><div class="ai-info"><div class="ai-main">${esc(d.name)}</div><div class="ai-sub">${d.ingr.length} Zutaten · ${d.steps.length} Schritte · für ${d.portions}</div></div></div>`).join('')}</div>`

      <div class="ins-why">Die genannten Tage werden ersetzt, die anderen bleiben.</div>`}

  ${f.showPrompt?`<div class="field"><label for="clP">Text für Claude (markieren und kopieren)</label><textarea id="clP" rows="6" readonly>${esc(CLAUDE_PROMPTS[f.kind])}</textarea></div>`:''}
  <div class="field"><label for="clA">Antwort von Claude</label><textarea id="clA" rows="6" placeholder='{"famos":"${f.kind}", …}' oninput="UI.form.text=this.value">${esc(f.text)}</textarea></div>
  ${f.err?`<div class="sync-err" role="alert">${esc(f.err)}</div>`:''}
  ${rz?'':'<div class="sync-privacy">Hinweis: Das Foto und die Namen der Lehrkräfte gehen dabei an Claude (dein Konto bei Anthropic).</div>'}
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="parseClaude()">Prüfen</button></div>`;}
// JSON aus Claudes Antwort lösen (auch mit Code-Block oder Text drumherum) und streng prüfen
function claudeJson(t){t=String(t||'');const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a<0||b<a)return null;try{return JSON.parse(t.slice(a,b+1));}catch(e){return null;}}
function claudeRecipes(j){const list=Array.isArray(j)?j:Array.isArray(j?.rezepte)?j.rezepte:[j];
  return list.slice(0,20).map(o=>{if(!o||typeof o!=='object')return null;const name=sStr(o.name,60).trim();if(!name)return null;
    return{name,em:sEm(o.emoji,'🍽️'),portions:Math.min(20,Math.max(1,Math.round(Number(o.portionen))||4)),
      ingr:sArr(o.zutaten,100).map(x=>sStr(x,80).trim()).filter(Boolean).slice(0,60),steps:sArr(o.schritte,100).map(x=>sStr(x,300).trim()).filter(Boolean).slice(0,30),
      meals:MEALS.map(m=>m.id).filter(id=>sArr(o.mahlzeiten,3).includes(id)),tags:TAGS.map(t=>t.id).filter(id=>sArr(o.eigenschaften,5).includes(id))};}).filter(Boolean);}
function claudePlan(j){const T=sObj(j?.tage);const out={};let n=0;
  DAYS.forEach(d=>{if(!Array.isArray(T[d.id]))return;out[d.id]=T[d.id].slice(0,30).map(e=>{if(!e||typeof e!=='object')return null;const lbl=sStr(e.fach,60).trim();if(!lbl)return null;
    const von=sStr(e.von,12).trim(),bis=sStr(e.bis,12).trim();return{em:sEm(e.emoji,'📖'),lbl,time:von&&bis?`${von} – ${bis}`:von,teacher:sStr(e.lehrkraft,40).trim()};}).filter(Boolean);n++;});
  return n?out:null;}
function parseClaude(){const f=UI.form,j=claudeJson(f.text);
  if(!j){f.err='Das sieht nicht nach Claudes Antwort aus. Bitte die ganze Antwort kopieren und einfügen.';openModal();return;}
  if(f.kind==='rezept'){const r=claudeRecipes(j);if(!r.length){f.err='Kein Rezept in der Antwort gefunden.';openModal();return;}
    if(r.length===1){openDishPrefilled(r[0]);toast('Übernommen. Bitte prüfen und speichern.');return;}f.preview=r;}
  else{const p=claudePlan(j);if(!p){f.err='Kein Stundenplan in der Antwort gefunden.';openModal();return;}f.preview=p;}
  f.err='';openModal();}
function applyClaude(){const f=UI.form,P=f.preview;
  if(f.kind==='rezept'){P.forEach(r=>{S.essen.dishes.push({id:uid(),em:r.em,name:r.name,meals:r.meals.length?r.meals:['abend'],tags:r.tags,ingr:r.ingr,ratings:{},portions:r.portions,steps:r.steps});});
    saveCfg();closeModal();render();toast(`${P.length} Gerichte übernommen`);return;}
  if(!S.kids.some(k=>k.id===f.kid))return;
  if(!S.stundenplan[f.kid])S.stundenplan[f.kid]={};Object.entries(P).forEach(([d,list])=>{S.stundenplan[f.kid][d]=list;});
  saveCfg();closeModal();if(document.getElementById('adm').classList.contains('open'))renderAdmin();render();toast('Stundenplan übernommen');}
