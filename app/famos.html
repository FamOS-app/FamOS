// To-dos für alle im Haushalt: wer (eine/mehrere Personen oder irgendwer), bis wann, Wiederholung.
// Abgleich zeilenweise über die Tabelle tasks (wie die Einkaufsliste).
const REPS=[{id:'',l:'Einmalig'},{id:'d',l:'Täglich'},{id:'w',l:'Wöchentlich'},{id:'m',l:'Monatlich'}];
function personById(id){return raters().find(p=>p.id===id)||null;}
function addMonths(ds,n){const d=pdate(ds),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0,12).getDate();d.setDate(Math.min(day,last));return dstr(d);}
function nextDue(due,rep){const td=today();let n=due||td;
  const step=x=>rep==='d'?addDays(x,1):rep==='w'?addDays(x,7):addMonths(x,1);
  n=step(n);for(let i=0;i<500&&n<=td;i++)n=step(n);return n;}
function fmtDue(ds){if(!ds)return'';const td=today(),d=daysBetween(td,ds);
  if(d===0)return'heute';if(d===1)return'morgen';if(d===-1)return'gestern';
  const wd=DAYS[(pdate(ds).getDay()+6)%7].s;return d<0?`seit ${wd}, ${ds.slice(8,10)}.${ds.slice(5,7)}.`:d<7?wd:`${wd}, ${ds.slice(8,10)}.${ds.slice(5,7)}.`;}
function todoBucket(t){if(!t.due)return'ohne';const td=today();if(t.due<td)return'over';if(t.due===td)return'heute';
  const sun=addDays(td,(7-((pdate(td).getDay()+6)%7))-1);return t.due<=sun?'woche':'spaeter';}
const BUCKETS=[{id:'over',l:'Überfällig'},{id:'heute',l:'Heute'},{id:'woche',l:'Diese Woche'},{id:'spaeter',l:'Später'},{id:'ohne',l:'Ohne Datum'}];
function todoOp(op,t){if(!SYNC?.hid)return;SYNC.queue.push(op==='del'?{t:'tasks',op,id:t.id}:{t:'tasks',op,item:{...t}});if(SYNC.queue.length>500)SYNC.queue=SYNC.queue.slice(-500);saveSync();schedulePush();}
function todoFor(t,who){return!who||!t.who.length||t.who.includes(who);}
function addTodoInput(){const v=String(UI.todoNew||document.getElementById('todoNew')?.value||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,120);
  if(!v)return;if(S.aufgaben.items.length>=500){toast('Zu viele Aufgaben. Bitte erst Erledigtes entfernen.');return;}
  const t={id:uid(),title:v,note:'',who:UI.todoWho&&personById(UI.todoWho)?[UI.todoWho]:[],due:'',rep:'',done:false,doneBy:'',doneAt:0};
  S.aufgaben.items.push(t);todoOp('up',t);UI.todoNew='';saveCfg();render();setTimeout(()=>document.getElementById('todoNew')?.focus(),0);}
// Abhaken: Einmaliges wird erledigt, Wiederkehrendes springt auf den nächsten Termin
function toggleTodo(id,by){const t=S.aufgaben.items.find(x=>x.id===id);if(!t)return;
  const who=by||(UI.todoWho&&personById(UI.todoWho)?UI.todoWho:'');
  if(t.rep&&!t.done){t.due=nextDue(t.due,t.rep);t.doneBy=who;t.doneAt=Date.now();toast(`Erledigt. Nächstes Mal: ${fmtDue(t.due)}`);}
  else{t.done=!t.done;t.doneBy=t.done?who:'';t.doneAt=t.done?Date.now():0;}
  todoOp('up',t);saveCfg();render();}
function clearTodosDone(){const done=S.aufgaben.items.filter(t=>t.done);if(!done.length)return;done.forEach(t=>todoOp('del',t));
  S.aufgaben.items=S.aufgaben.items.filter(t=>!t.done);saveCfg();render();toast(`${done.length} erledigt und entfernt`);}
function setTodoWho(id){UI.todoWho=id;saveUiState();render();}
function todoRow(t,kidView){const ps=t.who.map(personById).filter(Boolean),rep=REPS.find(r=>r.id===t.rep);
  const meta=[t.due?fmtDue(t.due):'',t.rep?'↻ '+rep.l.toLowerCase():'',kidView?'':ps.length?ps.map(p=>p.icon).join(' '):'irgendwer',t.done&&t.doneBy&&personById(t.doneBy)?'✓ '+personById(t.doneBy).name:''].filter(Boolean).join(' · ');
  return`<div class="ek-row${t.done?' done':''}${!t.done&&todoBucket(t)==='over'?' over':''}"><button class="ek-item" aria-pressed="${t.done}" onclick="toggleTodo('${t.id}'${kidView?`,'${kidView}'`:''})"><span class="t-chk">${t.done?'✓':''}</span><span class="todo-t"><span class="ek-name">${esc(t.title)}</span>${meta?`<span class="todo-m">${esc(meta)}</span>`:''}</span></button>${kidView?'':`<button class="ek-del" aria-label="${esc(t.title)} bearbeiten" onclick="openTodo('${t.id}')">⋯</button>`}</div>`;}
function buildAufgabenContent(){
  const who=personById(UI.todoWho)?UI.todoWho:'',ps=raters();
  const list=S.aufgaben.items.filter(t=>todoFor(t,who)),open=list.filter(t=>!t.done),done=list.filter(t=>t.done);
  const by={};open.forEach(t=>(by[todoBucket(t)]||=[]).push(t));
  Object.values(by).forEach(a=>a.sort((x,y)=>(x.due||'9').localeCompare(y.due||'9')||x.title.localeCompare(y.title,'de')));
  return`${ps.length>1?`<div class="ess-tags">${[{id:'',icon:'',name:'Alle'},...ps].map(p=>`<button class="ap${who===p.id?' on':''}" onclick="setTodoWho('${p.id}')">${esc(p.icon)} ${esc(p.name)}</button>`).join('')}</div>`:''}
  <div class="ek-add"><label for="todoNew" class="sr">Neue Aufgabe</label><input id="todoNew" value="${esc(UI.todoNew||'')}" maxlength="120" placeholder="${who?`Neue Aufgabe für ${esc(personById(who).name)}`:'Neue Aufgabe'}" autocomplete="off" enterkeyhint="done" oninput="UI.todoNew=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();addTodoInput()}"><button class="m-save ek-plus" aria-label="Hinzufügen" onclick="addTodoInput()">＋</button></div>
  ${!who||personById(who)?.id&&!S.kids.some(k=>k.id===who)?tgDueRows():''}
  ${open.length?BUCKETS.filter(b=>by[b.id]).map(b=>`<div class="ek-cat${b.id==='over'?' over':''}">${b.l} · ${by[b.id].length}</div>${by[b.id].map(t=>todoRow(t)).join('')}`).join(''):`<div class="sp-empty">${list.length?'Alles erledigt. 🎉':'Noch keine Aufgaben. Oben eintragen; über ⋯ legt ihr fest, wer, bis wann und wie oft.'}</div>`}
  ${done.length?`<div class="ek-cat">Erledigt · ${done.length}</div>${done.map(t=>todoRow(t)).join('')}<button class="reset-btn" onclick="clearTodosDone()">Erledigte entfernen</button>`:''}`;
}
// Für Kinder in der Routine: was ihnen zugeteilt und heute (oder überfällig, oder ohne Datum) dran ist
function kidTodos(kid){if(!kid)return'';const td=today();
  const list=S.aufgaben.items.filter(t=>t.who.includes(kid)&&(!t.done||(t.doneAt&&dstr(new Date(t.doneAt))===td))&&(!t.due||t.due<=td||t.done));
  return list.length?`<div class="s-lbl" style="margin-top:14px">Meine Aufgaben</div>${list.map(t=>todoRow(t,kid)).join('')}`:'';}
// Bearbeiten
function openTodo(id){const t=S.aufgaben.items.find(x=>x.id===id);if(!t)return;UI.form={mode:'todo',id,title:t.title,note:t.note,who:t.who.slice(),due:t.due,rep:t.rep};openModal();}
function todoSetDue(v){UI.form.due=v;openModal();}
function renderTodoModal(){const f=UI.form,td=today(),dow=(pdate(td).getDay()+6)%7;
  const quick=[['Heute',td],['Morgen',addDays(td,1)],['Samstag',addDays(td,(5-dow+7)%7||7)],['Nächste Woche',addDays(td,7-dow)],['Kein Datum','']];
  return`<h3>Aufgabe</h3>
  <div class="field"><label for="tdT">Was</label><input id="tdT" maxlength="120" value="${esc(f.title)}" oninput="UI.form.title=this.value"></div>
  <div class="field"><label>Wer</label><div class="ap-wrap">${raters().map(p=>`<button class="ap${f.who.includes(p.id)?' on':''}" aria-pressed="${f.who.includes(p.id)}" onclick="todoTogWho('${p.id}')">${esc(p.icon)} ${esc(p.name)}</button>`).join('')}</div><div class="field-hint">${f.who.length?'':'Niemand gewählt: irgendwer kann es erledigen.'}</div></div>
  <div class="field"><label for="tdD">Bis wann</label><div class="ap-wrap" style="margin-bottom:8px">${quick.map(([l,v])=>`<button class="ap${f.due===v?' on':''}" onclick="todoSetDue('${v}')">${l}</button>`).join('')}</div><input id="tdD" type="date" value="${esc(f.due)}" onchange="UI.form.due=this.value"></div>
  <div class="field"><label>Wiederholen</label><div class="ap-wrap">${REPS.map(r=>`<button class="ap${f.rep===r.id?' on':''}" onclick="UI.form.rep='${r.id}';openModal()">${r.l}</button>`).join('')}</div></div>
  <div class="field"><label for="tdN">Notiz (optional)</label><textarea id="tdN" rows="2" maxlength="300" oninput="UI.form.note=this.value">${esc(f.note)}</textarea></div>
  <div class="m-btns"><button class="m-cancel" onclick="delTodo()">Löschen</button><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="saveTodo()">Speichern</button></div>`;}
function todoTogWho(id){const w=UI.form.who,i=w.indexOf(id);if(i>=0)w.splice(i,1);else w.push(id);openModal();}
function saveTodo(){const f=UI.form,t=S.aufgaben.items.find(x=>x.id===f.id);if(!t)return closeModal();
  const title=String(f.title||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,120);if(!title){toast('Bitte eintragen, was zu tun ist.');return;}
  const due=/^\d{4}-\d{2}-\d{2}$/.test(f.due||'')?f.due:'';
  Object.assign(t,{title,note:String(f.note||'').trim().slice(0,300),who:f.who.filter(w=>personById(w)),due:f.rep&&!due?today():due,rep:f.rep});
  todoOp('up',t);saveCfg();closeModal();render();}
function delTodo(){const f=UI.form;if(!confirm('Aufgabe löschen?'))return;S.aufgaben.items=S.aufgaben.items.filter(x=>x.id!==f.id);todoOp('del',{id:f.id});saveCfg();closeModal();render();}

// ═══ GERICHT-FOTOS ════════════════════════════
// Je Gericht eine kleine Vorschau (für Listen, alle im Speicher) und ein großes Bild (erst beim Öffnen geladen).
// Auf dem Gerät in IndexedDB, im Haushalt zeilenweise in der Tabelle dish_images. Nicht im cfg-Dokument und nicht im Backup.
const IMG={t:{},rev:{},full:null,ready:false},IMG_MEM={};
const IMG_PX_T=160,IMG_PX_F=900,IMG_T=40000,IMG_F=400000;
// Nur JPEG als Data-URL mit reinem Base64: so kann nichts anderes in CSS oder HTML landen
function sImg(v,max){return typeof v==='string'&&v.length<=max&&/^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(v)?v:'';}
function dishIc(d,px){return IMG.t[d.id]?`<span class="dimg dimg-${px} di-${d.id}" role="img" aria-label="Foto"></span>`:esc(d.em);}
// Vorschaubilder einmal als CSS-Regeln ablegen, damit Listen beim Neuzeichnen keine Bilddaten mitschleppen
function imgCss(){const el=document.getElementById('dishCss');if(el)el.textContent=Object.keys(IMG.t).map(id=>`.di-${id}{background-image:url(${IMG.t[id]})}`).join('');}
function idbDo(mode,fn){return new Promise((res,rej)=>{
  const o=indexedDB.open('famos',1);o.onupgradeneeded=()=>o.result.createObjectStore('dishimg',{keyPath:'id'});o.onerror=()=>rej(o.error);
  o.onsuccess=()=>{const db=o.result,tx=db.transaction('dishimg',mode),rq=fn(tx.objectStore('dishimg'));
    tx.oncomplete=()=>{db.close?.();res(rq?.result);};tx.onerror=tx.onabort=()=>{db.close?.();rej(tx.error);};};});}
const IDB_ON=typeof indexedDB!=='undefined';
async function imgDbAll(){return IDB_ON?(await idbDo('readonly',st=>st.getAll())||[]):Object.values(IMG_MEM);}
async function imgDbGet(id){return(IDB_ON?await idbDo('readonly',st=>st.get(id)):IMG_MEM[id])||null;}
async function imgDbPut(r){if(IDB_ON)await idbDo('readwrite',st=>st.put(r));else IMG_MEM[r.id]=r;}
async function imgDbDel(id){if(IDB_ON)await idbDo('readwrite',st=>st.delete(id));else delete IMG_MEM[id];}
async function imgDbClear(){if(IDB_ON)await idbDo('readwrite',st=>st.clear());else Object.keys(IMG_MEM).forEach(k=>delete IMG_MEM[k]);}
async function imgLoad(){let rows=[];try{rows=await imgDbAll();}catch(e){}
  rows.forEach(r=>{const id=sId(r?.id),t=sImg(r?.t,IMG_T);if(id&&t&&!IMG.t[id]){IMG.t[id]=t;IMG.rev[id]=sStr(r.rev,20);}});
  IMG.ready=true;imgCss();if(Object.keys(IMG.t).length)render();if(SYNC_ON&&AUTH&&SYNC.hid)schedulePush();}
async function imgFull(id){if(!IMG.t[id]||IMG.full?.id===id)return;
  try{const r=await imgDbGet(id),f=sImg(r?.f,IMG_F);if(!f)return;IMG.full={id,f};if(UI.form?.mode==='recipe'&&UI.form.id===id&&document.getElementById('mb').classList.contains('open'))openModal();}catch(e){}}
function imgOp(op,id){if(!SYNC?.hid)return;SYNC.queue=SYNC.queue.filter(q=>!(q.t==='img'&&q.id===id));SYNC.queue.push({t:'img',op,id});saveSync();schedulePush();}
function dishImgSet(id,img){const t=sImg(img?.t,IMG_T),f=sImg(img?.f,IMG_F);if(!sId(id)||!t||!f)return false;
  const rev=uid();IMG.t[id]=t;IMG.rev[id]=rev;IMG.full={id,f};imgCss();
  imgDbPut({id,t,f,rev}).then(()=>imgOp('up',id),()=>toast('Das Foto konnte nicht gespeichert werden. Ist der Speicher voll?'));return true;}
function dishImgDel(id){delete IMG.t[id];delete IMG.rev[id];if(IMG.full?.id===id)IMG.full=null;imgCss();imgDbDel(id).catch(()=>{});imgOp('del',id);}
// Foto vom Gerät: zuschneiden und verkleinern. Dabei entsteht ein neues JPEG ohne Aufnahmeort und Kameradaten.
async function imgFromFile(file){
  if(!file||!/^image\//.test(file.type||''))throw new Error('Das ist kein Bild.');
  if(file.size>30e6)throw new Error('Das Bild ist zu groß.');
  let src;
  if(typeof createImageBitmap==='function')src=await createImageBitmap(file);
  else src=await new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('nicht lesbar'));
    fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('nicht lesbar'));im.src=fr.result;};fr.readAsDataURL(file);});
  const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;if(!w||!h)throw new Error('Das Bild ist leer.');
  const draw=(cw,ch,sx,sy,sw,sh,q)=>{const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(src,sx,sy,sw,sh,0,0,cw,ch);return c.toDataURL('image/jpeg',q);};
  const sq=Math.min(w,h),t=draw(IMG_PX_T,IMG_PX_T,(w-sq)/2,(h-sq)/2,sq,sq,.72),k=Math.min(1,IMG_PX_F/Math.max(w,h));let f='';
  for(const q of[.74,.6,.45]){f=draw(Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k)),0,0,w,h,q);if(f.length<=IMG_F)break;}
  src.close?.();
  if(!sImg(t,IMG_T)||!sImg(f,IMG_F))throw new Error('Das Bild konnte nicht verarbeitet werden.');
  return{t,f};}
function dishPickImg(){const input=document.createElement('input');input.type='file';input.accept='image/*';
  input.onchange=async e=>{const file=e.target.files[0];if(!file||UI.form?.mode!=='dish')return;
    try{const img=await imgFromFile(file);if(UI.form?.mode!=='dish')return;UI.form.img=img;UI.form.imgDel=false;openModal();}
    catch(err){toast(err.message||'Das Bild konnte nicht gelesen werden.');}};
  input.click();}
function dishDropImg(){UI.form.img=null;UI.form.imgDel=true;openModal();}

// ═══ KALENDER ═════════════════════════════════
// Familientermine und Verabredungen: Tag, optional Uhrzeit, mehrtägig oder wiederkehrend (wöchentlich, jährlich).
// Abgleich zeilenweise über die Tabelle events (wie Aufgaben).
const CAL_REPS=[{id:'',l:'Einmalig'},{id:'w',l:'Wöchentlich'},{id:'y',l:'Jährlich'}];
function calOp(op,e){if(!SYNC?.hid)return;SYNC.queue.push(op==='del'?{t:'events',op,id:e.id}:{t:'events',op,item:{...e}});if(SYNC.queue.length>500)SYNC.queue=SYNC.queue.slice(-500);saveSync();schedulePush();}
function calFor(e,who){return!who||!e.who.length||e.who.includes(who);}
// Findet der Termin an diesem Tag statt? Der 29.02. fällt in anderen Jahren auf den 28.02.
function calOn(e,ds){if(ds<e.day||e.skip?.includes(ds))return false;
  if(e.rep==='w')return daysBetween(e.day,ds)%7===0;
  if(e.rep==='y'){const md=e.day.slice(5),x=ds.slice(5);return x===md||(md==='02-29'&&x==='02-28'&&addDays(ds,1).slice(5)==='03-01');}
  return ds<=(e.end||e.day);}
function calDay(ds,who){return S.kalender.items.filter(e=>calFor(e,who)&&calOn(e,ds)).sort((a,b)=>a.from.localeCompare(b.from)||a.title.localeCompare(b.title,'de'));}
// Liste ab einem Tag: Mehrtägiges steht einmal (am Beginn, oder am ersten Tag der Liste, wenn es schon läuft), Wiederholungen an jedem Termin
function calAgenda(from,days,who){const out=[];
  for(let i=0;i<days;i++){const ds=addDays(from,i),list=calDay(ds,who).filter(e=>!e.end||ds===e.day||i===0);if(list.length)out.push({ds,list});}
  return out;}
function fmtCalDay(ds){const td=today(),d=daysBetween(td,ds),dm=`${DAYS[(pdate(ds).getDay()+6)%7].s}, ${ds.slice(8,10)}.${ds.slice(5,7)}.${ds.slice(0,4)!==td.slice(0,4)?ds.slice(0,4):''}`;
  return d===0?`Heute · ${dm}`:d===1?`Morgen · ${dm}`:dm;}
// o.ro: nur lesen (Kinder), o.day: Tag in der Zeile nennen (Startseite, Kinder), o.on: an welchem Tag die Zeile steht
function calRow(e,o={}){const ps=e.who.map(personById).filter(Boolean),rp=CAL_REPS.find(r=>r.id===e.rep);
  const meta=[o.day?fmtDue(o.day):'',e.end?'bis '+fmtCalDay(e.end).replace(/^.* · /,''):'',o.ro?'':ps.length?ps.map(p=>p.icon).join(' '):'alle',e.place?'📍 '+e.place:'',e.rep?'↻ '+rp.l.toLowerCase():''].filter(Boolean).join(' · ');
  const inner=`<span class="cal-time">${e.from?esc(e.from)+(e.to?`<small>bis ${esc(e.to)}</small>`:''):'<small>ganztägig</small>'}</span><span class="todo-t"><span class="ek-name">${esc(e.title)}</span>${meta?`<span class="todo-m">${esc(meta)}</span>`:''}</span>`;
  return`<div class="ek-row cal-row">${o.ro?`<div class="ek-item">${inner}</div>`:`<button class="ek-item" onclick="openCal('${e.id}','${o.day||o.on||''}')">${inner}</button>`}</div>`;}
function setCalWho(id){UI.calWho=id;render();}
function setCalTab(t){UI.calTab=t;render();}
function setCalSel(ds){UI.calSel=ds;UI.calMonth=ds.slice(0,7);render();}
function calShift(n){const td=today(),m=n?addMonths((UI.calMonth||td.slice(0,7))+'-01',n).slice(0,7):td.slice(0,7);UI.calMonth=m;UI.calSel=m===td.slice(0,7)?td:m+'-01';render();}
function calMore(){UI.calDays=Math.min(365,(UI.calDays||30)+60);render();}
function buildKalenderContent(){
  const who=personById(UI.calWho)?UI.calWho:'',ps=raters(),monat=UI.calTab==='monat',td=today();
  const head=`<div class="seg" role="tablist"><button class="seg-b${monat?'':' on'}" role="tab" aria-selected="${!monat}" onclick="setCalTab('liste')">Liste</button><button class="seg-b${monat?' on':''}" role="tab" aria-selected="${monat}" onclick="setCalTab('monat')">Monat</button></div>
  ${ps.length>1?`<div class="ess-tags">${[{id:'',icon:'',name:'Alle'},...ps].map(p=>`<button class="ap${who===p.id?' on':''}" aria-pressed="${who===p.id}" onclick="setCalWho('${p.id}')">${esc(p.icon)} ${esc(p.name)}</button>`).join('')}</div>`:''}`;
  if(!monat){const n=UI.calDays||30,ag=calAgenda(td,n,who);
    return`${head}<button class="aa" style="margin-bottom:6px" onclick="openCal()">＋ Termin</button>
    ${ag.length?ag.map(g=>`<div class="ek-cat">${fmtCalDay(g.ds)}</div>${g.list.map(e=>calRow(e,{on:g.ds})).join('')}`).join(''):`<div class="sp-empty">${S.kalender.items.length?`In den nächsten ${n} Tagen steht nichts an.`:'Noch keine Termine. Tragt ein, was ansteht: Arzt, Verabredung, Geburtstag, Urlaub.'}</div>`}
    ${n<365?`<button class="reset-btn" onclick="calMore()">Weiter in die Zukunft schauen</button>`:''}`;}
  const ym=/^\d{4}-\d{2}$/.test(UI.calMonth||'')?UI.calMonth:td.slice(0,7),first=ym+'-01',off=(pdate(first).getDay()+6)%7,dim=pdate(addDays(addMonths(first,1),-1)).getDate();
  const sel=sDate(UI.calSel)&&UI.calSel.slice(0,7)===ym?UI.calSel:ym===td.slice(0,7)?td:first,cells=[];
  for(let i=0;i<Math.ceil((off+dim)/7)*7;i++){const ds=addDays(first,i-off),n=calDay(ds,who).length;
    cells.push(`<button class="cal-d${ds.slice(0,7)!==ym?' out':''}${ds===td?' is-today':''}${ds===sel?' on':''}" aria-pressed="${ds===sel}" aria-label="${Number(ds.slice(8,10))}.${Number(ds.slice(5,7))}., ${n===1?'1 Termin':n+' Termine'}" onclick="setCalSel('${ds}')">${Number(ds.slice(8,10))}<span class="cal-dots">${'<i></i>'.repeat(Math.min(3,n))}</span></button>`);}
  const list=calDay(sel,who);
  return`${head}<div class="cal-head"><button class="cal-nav" aria-label="Monat zurück" onclick="calShift(-1)">‹</button><strong>${esc(pdate(first).toLocaleDateString('de-DE',{month:'long',year:'numeric'}))}</strong>${ym!==td.slice(0,7)?`<button class="cal-nav" onclick="calShift(0)">Heute</button>`:''}<button class="cal-nav" aria-label="Monat vor" onclick="calShift(1)">›</button></div>
  <div class="cal-grid">${DAYS.map(d=>`<div class="cal-wd">${d.s}</div>`).join('')}${cells.join('')}</div>
  <div class="ek-cat">${fmtCalDay(sel)}</div>${list.map(e=>calRow(e,{on:sel})).join('')||'<div class="field-hint" style="margin:0 2px 10px">Nichts eingetragen.</div>'}
  <button class="aa" onclick="openCal('','${sel}')">＋ Termin an diesem Tag</button>`;
}
// Für Kinder in der Routine: eigene und gemeinsame Termine der nächsten 7 Tage, nur zum Lesen
function kidEvents(kid){if(!kid)return'';const rows=calAgenda(today(),7,kid).flatMap(g=>g.list.map(e=>calRow(e,{ro:true,day:g.ds})));
  return rows.length?`<div class="s-lbl" style="margin-top:14px">Meine Termine</div>${rows.join('')}`:'';}
// Anlegen und Bearbeiten
function openCal(id,day){const e=id?S.kalender.items.find(x=>x.id===id):null;if(id&&!e)return;
  // occ: der angetippte Termin einer Serie (nur wenn er an dem Tag wirklich stattfindet)
  UI.form=e?{mode:'cal',id:e.id,title:e.title,day:e.day,end:e.end,from:e.from,to:e.to,place:e.place,note:e.note,who:e.who.slice(),rep:e.rep,occ:e.rep&&sDate(day)&&calOn(e,day)?day:''}:{mode:'cal',id:'',title:'',day:sDate(day)||today(),end:'',from:'',to:'',place:'',note:'',who:personById(UI.calWho)?[UI.calWho]:[],rep:''};openModal();}
// Uhrzeit als zwei Auswahllisten (Stunde, Minute in 5er-Schritten) statt des System-Zeitfensters,
// das je nach Handy anders aussieht und auf Android abgeschnitten sein kann. Gespeicherte „krumme“ Minuten bleiben wählbar.
function calTimeSel(key,id,v){const[h,m]=sTime(v)?v.split(':'):['',''],pad=n=>String(n).padStart(2,'0');
  const mins=[...Array(12)].map((_,i)=>pad(i*5));if(m&&!mins.includes(m)){mins.push(m);mins.sort();}
  const lbl=key==='from'?'von':'bis';
  return`<span class="cal-tsel"><select id="${id}h" aria-label="${lbl}, Stunde" onchange="calTime('${key}','h',this.value)"><option value="">––</option>${[...Array(24)].map((_,i)=>`<option${pad(i)===h?' selected':''}>${pad(i)}</option>`).join('')}</select>:<select id="${id}m" aria-label="${lbl}, Minute" onchange="calTime('${key}','m',this.value)" ${h?'':'disabled'}>${h?'':'<option value="">––</option>'}${mins.map(x=>`<option${x===m?' selected':''}>${x}</option>`).join('')}</select></span>`;}
function calTime(key,part,val){const f=UI.form,[h,m]=sTime(f[key])?f[key].split(':'):['',''];
  if(part==='h')f[key]=/^([01]\d|2[0-3])$/.test(val)?`${val}:${m||'00'}`:'';
  else if(h&&/^[0-5]\d$/.test(val))f[key]=`${h}:${val}`;
  if(key==='from'&&!f.from)f.to=''; // ohne Beginn kein Ende
  openModal();}
function calTogWho(id){const w=UI.form.who,i=w.indexOf(id);if(i>=0)w.splice(i,1);else w.push(id);openModal();}
function renderCalModal(){const f=UI.form,ex=f.id?S.kalender.items.find(x=>x.id===f.id):null;
  return`<h3>${f.id?'Termin':'Neuer Termin'}</h3>
  ${calSkipBox(f)}
  <div class="field"><label for="calT">Was</label><input id="calT" maxlength="120" value="${esc(f.title)}" placeholder="z.B. Kinderarzt, Verabredung, Geburtstag" oninput="UI.form.title=this.value"></div>
  <div class="field"><label for="calD">Wann</label><input id="calD" type="date" value="${esc(f.day)}" onchange="UI.form.day=this.value"></div>
  <div class="field"><label for="calFh">Uhrzeit (optional)</label><div class="cal-times">${calTimeSel('from','calF',f.from)}<span>bis</span>${calTimeSel('to','calT2',f.to)}</div><div class="field-hint">Ohne Uhrzeit gilt der Termin ganztägig.</div></div>
  <div class="field"><label>Wer</label><div class="ap-wrap">${raters().map(p=>`<button class="ap${f.who.includes(p.id)?' on':''}" aria-pressed="${f.who.includes(p.id)}" onclick="calTogWho('${p.id}')">${esc(p.icon)} ${esc(p.name)}</button>`).join('')}</div><div class="field-hint">${f.who.length?'':'Niemand gewählt: betrifft alle.'}</div></div>
  <div class="field"><label>Wiederholen</label><div class="ap-wrap">${CAL_REPS.map(r=>`<button class="ap${f.rep===r.id?' on':''}" aria-pressed="${f.rep===r.id}" onclick="UI.form.rep='${r.id}';openModal()">${r.l}</button>`).join('')}</div></div>
  ${f.rep?'':`<div class="field"><label for="calE">Letzter Tag (optional, z.B. Urlaub)</label><input id="calE" type="date" value="${esc(f.end)}" onchange="UI.form.end=this.value"></div>`}
  <div class="field"><label for="calP">Ort (optional)</label><input id="calP" maxlength="80" value="${esc(f.place)}" oninput="UI.form.place=this.value"></div>
  <div class="field"><label for="calN">Notiz (optional)</label><textarea id="calN" rows="2" maxlength="300" oninput="UI.form.note=this.value">${esc(f.note)}</textarea></div>
  <div class="m-btns">${f.id?`<button class="m-cancel" onclick="delCal()">${ex?.rep?'Serie löschen':'Löschen'}</button>`:''}<button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="saveCal()">Speichern</button></div>`;}
// Serie: einzelnen Termin ausfallen lassen, Ausfälle wieder aufnehmen
function calSkipBox(f){const ex=f.id?S.kalender.items.find(x=>x.id===f.id):null;if(!ex?.rep)return'';const td=today(),past=ex.skip.filter(d=>d<td).length,next=ex.skip.filter(d=>d>=td);
  return`<div class="field"><label>Einzelne Termine</label>
  ${f.occ?`<button class="aa" style="margin:0 0 8px" onclick="calSkip()">🚫 Nur ${esc(fmtCalDay(f.occ))} ausfallen lassen</button>`:'<div class="field-hint" style="margin:0 0 8px">Um einen einzelnen Termin ausfallen zu lassen, ihn in der Liste oder im Monat antippen.</div>'}
  ${next.length?`<div class="ap-wrap">${next.map(d=>`<button class="ap" aria-label="${esc(fmtCalDay(d))} wieder aufnehmen" onclick="calUnskip('${d}')">${esc(fmtCalDay(d))} fällt aus · ↩︎</button>`).join('')}</div><div class="field-hint">Antippen nimmt den Termin wieder auf.</div>`:''}
  ${past?`<div class="field-hint">${past} ${past===1?'früherer Ausfall':'frühere Ausfälle'}</div>`:''}</div>`;}
function calSkip(){const f=UI.form,ex=S.kalender.items.find(x=>x.id===f.id);if(!ex?.rep||!f.occ||!calOn(ex,f.occ))return closeModal();
  const d=f.occ,e=sanitizeEvent({...ex,skip:[...ex.skip,d]},null);if(!e)return;
  Object.assign(ex,{skip:e.skip});calOp('up',ex);saveCfg();closeModal();render();toast(`Fällt aus: ${fmtCalDay(d)}`);}
function calUnskip(d){const f=UI.form,ex=S.kalender.items.find(x=>x.id===f.id);if(!ex)return;
  ex.skip=ex.skip.filter(x=>x!==d);calOp('up',ex);saveCfg();if(!f.occ)f.occ=d;openModal();render();toast(`Wieder aufgenommen: ${fmtCalDay(d)}`);}
function saveCal(){const f=UI.form,ex=f.id?S.kalender.items.find(x=>x.id===f.id):null;if(f.id&&!ex)return closeModal();
  if(!sStr(f.title,120).trim()){toast('Bitte eintragen, was ansteht.');return;}
  if(!sDate(f.day)){toast('Bitte einen Tag wählen.');return;}
  if(!f.rep&&f.end&&(!sDate(f.end)||f.end<f.day)){toast('Der letzte Tag liegt vor dem Beginn.');return;}
  if(f.to&&!sTime(f.from)){toast('Bitte auch die Anfangszeit eintragen.');return;}
  if(f.from&&f.to&&f.to<=f.from){toast('Die Endzeit liegt vor dem Beginn.');return;}
  if(!ex&&S.kalender.items.length>=500){toast('Zu viele Termine. Bitte erst alte löschen.');return;}
  const e=sanitizeEvent({...f,id:f.id||uid(),skip:ex?ex.skip:[]},raters().map(p=>p.id));if(!e)return;
  if(ex)Object.assign(ex,e);else S.kalender.items.push(e);
  calOp('up',e);saveCfg();UI.calSel=e.day;UI.calMonth=e.day.slice(0,7);closeModal();render();toast(`Gespeichert: ${fmtCalDay(e.day)}`);}
function delCal(){const f=UI.form,e=S.kalender.items.find(x=>x.id===f.id);if(!e)return closeModal();
  if(!confirm(e.rep?'Termin mit allen Wiederholungen löschen?':'Termin löschen?'))return;
  S.kalender.items=S.kalender.items.filter(x=>x.id!==f.id);calOp('del',{id:f.id});saveCfg();closeModal();render();}

// ═══ WÜNSCHE ══════════════════════════════════
// Wunschliste pro Kind. Kinder tragen selbst ein; „besorgt“ und „wer schenkt“ nur in der Eltern-Ansicht (Eltern-PIN).
function wishParentOn(){requirePin(()=>{UI.wishParent=true;render();});}
function wishParentOff(){UI.wishParent=false;render();}
function setWishOcc(o){UI.wishOcc=o;render();}
function addWishInput(kid){const v=String(UI.wishNew||document.getElementById('wishNew')?.value||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,100);
  if(!v||!S.kids.some(k=>k.id===kid))return;if(S.wuensche.items.length>=300){toast('Die Wunschliste ist voll.');return;}
  S.wuensche.items.push({id:uid(),kid,title:v,link:'',occ:UI.wishOcc?[UI.wishOcc]:[],note:'',got:false,from:''});
  UI.wishNew='';saveCfg();render();setTimeout(()=>document.getElementById('wishNew')?.focus(),0);}
function togWishGot(id){if(!UI.wishParent)return;const w=S.wuensche.items.find(x=>x.id===id);if(!w)return;w.got=!w.got;saveCfg();render();}
function buildWishContent(kid){if(!kid)return'';const par=!!UI.wishParent,occ=UI.wishOcc||'';
  const list=S.wuensche.items.filter(w=>w.kid===kid.id&&(!occ||w.occ.includes(occ)));
  if(par)list.sort((a,b)=>a.got-b.got);
  const row=w=>`<div class="ek-row${par&&w.got?' done':''}">${par?`<button class="ek-item" aria-pressed="${w.got}" aria-label="${esc(w.title)}: ${w.got?'besorgt':'noch nicht besorgt'}" onclick="togWishGot('${w.id}')"><span class="t-chk">${w.got?'✓':''}</span>`:`<div class="ek-item wish-item"><span class="wish-em">🎁</span>`}
    <span class="todo-t"><span class="ek-name">${esc(w.title)}</span><span class="todo-m">${[w.occ.map(o=>OCC.find(x=>x.id===o).em+' '+OCC.find(x=>x.id===o).l).join(' · '),par&&w.from?'von '+esc(w.from):'',w.note?esc(w.note):''].filter(Boolean).join(' · ')}</span></span>
    ${par?'</button>':'</div>'}${w.link?`<a class="wish-link" href="${esc(w.link)}" target="_blank" rel="noopener noreferrer" aria-label="Link zu ${esc(w.title)} öffnen">↗</a>`:''}
    <button class="ek-del" aria-label="${esc(w.title)} bearbeiten" onclick="openWish('${w.id}')">⋯</button></div>`;
  return`<div class="ess-tags">${[{id:'',em:'',l:'Alle'},...OCC].map(o=>`<button class="ap${occ===o.id?' on':''}" onclick="setWishOcc('${o.id}')">${o.em} ${o.l}</button>`).join('')}</div>
  <div class="ek-add"><label for="wishNew" class="sr">Neuer Wunsch</label><input id="wishNew" value="${esc(UI.wishNew||'')}" maxlength="100" placeholder="Was wünschst du dir?" autocomplete="off" enterkeyhint="done" oninput="UI.wishNew=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();addWishInput('${kid.id}')}"><button class="m-save ek-plus" aria-label="Hinzufügen" onclick="addWishInput('${kid.id}')">＋</button></div>
  ${list.length?list.map(row).join(''):`<div class="sp-empty">Noch keine Wünsche${occ?' für diesen Anlass':''}.</div>`}
  <button class="reset-btn" onclick="${par?'wishParentOff()':'wishParentOn()'}">${par?'Eltern-Ansicht beenden':'🔒 Eltern-Ansicht: besorgt & wer schenkt'}</button>`;}
function openWish(id){const w=S.wuensche.items.find(x=>x.id===id);if(!w)return;UI.form={mode:'wish',id,title:w.title,link:w.link,occ:w.occ.slice(),note:w.note,got:w.got,from:w.from};openModal();}
function renderWishModal(){const f=UI.form,par=!!UI.wishParent;
  return`<h3>Wunsch</h3>
  <div class="field"><label for="wsT">Was</label><input id="wsT" maxlength="100" value="${esc(f.title)}" oninput="UI.form.title=this.value"></div>
  <div class="field"><label>Für</label><div class="ap-wrap">${OCC.map(o=>`<button class="ap${f.occ.includes(o.id)?' on':''}" aria-pressed="${f.occ.includes(o.id)}" onclick="wishTogOcc('${o.id}')">${o.em} ${o.l}</button>`).join('')}</div></div>
  <div class="field"><label for="wsL">Link (optional)</label><input id="wsL" type="url" inputmode="url" maxlength="300" placeholder="https://…" value="${esc(f.link)}" oninput="UI.form.link=this.value"></div>
  <div class="field"><label for="wsN">Notiz (optional)</label><input id="wsN" maxlength="200" placeholder="z.B. Größe 128, in Blau" value="${esc(f.note)}" oninput="UI.form.note=this.value"></div>
  ${par?`<div class="field"><label for="wsF">Wer schenkt (nur Eltern-Ansicht)</label><input id="wsF" maxlength="40" placeholder="z.B. Oma" value="${esc(f.from)}" oninput="UI.form.from=this.value"></div>
  <div class="tog-row"><div><div class="tog-l">Besorgt</div></div><button type="button" role="switch" aria-checked="${f.got}" class="tog${f.got?' on':''}" onclick="UI.form.got=!UI.form.got;openModal()"></button></div>`:''}
  <div class="m-btns"><button class="m-cancel" onclick="delWish()">Löschen</button><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="saveWish()">Speichern</button></div>`;}
function wishTogOcc(id){const o=UI.form.occ,i=o.indexOf(id);if(i>=0)o.splice(i,1);else o.push(id);openModal();}
function saveWish(){const f=UI.form,w=S.wuensche.items.find(x=>x.id===f.id);if(!w)return closeModal();
  const title=String(f.title||'').trim().slice(0,100);if(!title){toast('Bitte eintragen, was gewünscht ist.');return;}
  const link=String(f.link||'').trim();if(link&&!safeLink(link)){toast('Der Link muss mit https:// beginnen.');return;}
  Object.assign(w,{title,link:safeLink(link),occ:OCC.map(o=>o.id).filter(o=>f.occ.includes(o)),note:String(f.note||'').trim().slice(0,200)});
  if(UI.wishParent)Object.assign(w,{got:!!f.got,from:String(f.from||'').trim().slice(0,40)});
  saveCfg();closeModal();render();}
function delWish(){if(!confirm('Wunsch löschen?'))return;S.wuensche.items=S.wuensche.items.filter(x=>x.id!==UI.form.id);saveCfg();closeModal();render();}

// ═══ HEUTE ════════════════════════════════════
// Startseite: was heute los ist. Karten ohne Inhalt fallen weg; ab 14 Uhr rücken Abend und „Morgen“ nach vorn.
function hour(){return new Date().getHours();}
function spSummary(kidId,ds){const day=DAYS[(pdate(ds).getDay()+6)%7].id,e=(S.stundenplan?.[kidId]?.[day])||[];if(!e.length)return'';
  const times=e.map(x=>x.time).filter(Boolean),end=times.length?times[times.length-1].split(/[–-]/).pop().trim():'';
  return`${esc(e[0].lbl)}${e.length>1?` + ${e.length-1}`:''}${end?` · bis ${esc(end)}`:''}`;}
function homeCard(id,title,body,go){return body?`<div class="tg-card home-card"><button class="home-h" onclick="${go}"><span>${title}</span><span aria-hidden="true">→</span></button>${body}</div>`:'';}
function buildHeute(){
  const td=today(),late=hour()>=14,me=getMe(),mp=meAdult(),cards={};
  // Meine Aufgaben (bzw. alle auf dem Familiengerät)
  if(modOn('aufgaben')){const who=mp?mp.id:'';
    const list=S.aufgaben.items.filter(t=>!t.done&&todoFor(t,who)&&t.due&&t.due<=td).sort((a,b)=>a.due.localeCompare(b.due));
    const tg=me==='family'?'':tgDueRows();
    cards.todo=homeCard('todo',mp?'Meine Aufgaben':'Aufgaben heute',tg+list.slice(0,5).map(t=>todoRow(t)).join('')+(list.length>5?`<button class="home-more" onclick="setView('aufgaben')">+ ${list.length-5} weitere</button>`:''),"setView('aufgaben')");}
  else if(me!=='family')cards.todo=homeCard('todo','Taschengeld',tgDueRows(),"goKinder()");
  // Termine heute und morgen
  if(modOn('kalender')){const rows=calAgenda(td,2,mp?mp.id:'').flatMap(g=>g.list.map(e=>calRow(e,{day:g.ds})));
    cards.termine=homeCard('termine',mp?'Meine Termine':'Termine',rows.slice(0,6).join('')+(rows.length>6?`<button class="home-more" onclick="setView('kalender')">+ ${rows.length-6} weitere</button>`:''),"setView('kalender')");}
  // Kinder heute
  if(S.kids.length&&kidMods().length){const rt=late&&S.routines.abend?.active?'abend':S.routines.morgen?.active?'morgen':firstActiveRt();
    cards.kinder=homeCard('kinder','Kinder heute',S.kids.map(k=>{const done=doneCount(rt,k.id),tot=totalCount(rt,k.id),brot=S.routines[rt]?.brot&&D.brot?.[rt]?.[k.id]==='ja';
      const sp=modOn('stundenplan')?spSummary(k.id,td):'';
      return`<div class="home-kid"><span class="wish-em">${esc(k.icon)}</span><span class="todo-t"><span class="ek-name">${esc(k.name)}</span><span class="todo-m">${[modOn('routine')&&tot?`${esc(S.routines[rt].label)}routine ${done}/${tot}${done>=tot?' ✓':''}`:'',brot?'🍞 braucht ein Brot':'',sp].filter(Boolean).join(' · ')||'–'}</span></span></div>`;}).join(''),"goKinder()");}
  // Essen heute
  if(modOn('essen')&&S.essen.dishes.length){cards.essen=homeCard('essen','Essen heute',activeMeals().map(m=>{const sl=planSlot(td,m.id),d=sl&&dishById(sl.id);
    return`<div class="home-kid"><span class="wish-em">${d?dishIc(d,40):m.em}</span><span class="todo-t"><span class="todo-m">${m.l}</span>${d?`<button class="home-link" onclick="openRecipe('${d.id}','${td}','${m.id}')">${esc(d.name)}</button>`:'<span class="ek-name">noch offen</span>'}</span>${d?'':`<button class="tg-act" onclick="rollToday('${m.id}')">Würfeln</button>`}</div>`;}).join(''),"setView('essen')");}
  // Einkauf
  if(modOn('einkauf')){const n=ekOpen().length;
    cards.einkauf=homeCard('einkauf',`Einkauf${n?` · ${n} ${n===1?'Ding':'Dinge'}`:''}`,`<div class="ek-add" style="margin:0"><label for="homeEk" class="sr">Auf die Einkaufsliste</label><input id="homeEk" maxlength="80" placeholder="Auf die Liste: Was fehlt?" autocomplete="off" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();homeEkAdd()}"><button class="m-save ek-plus" aria-label="Hinzufügen" onclick="homeEkAdd()">＋</button></div>`,"setView('einkauf')");}
  // Morgen (ab Nachmittag)
  if(late){const tm=addDays(td,1),rows=[];
    S.kids.forEach(k=>{const sp=modOn('stundenplan')?spSummary(k.id,tm):'';if(sp)rows.push(`<div class="home-kid"><span class="wish-em">${esc(k.icon)}</span><span class="todo-t"><span class="ek-name">${esc(k.name)}</span><span class="todo-m">${sp}</span></span></div>`);});
    if(modOn('essen'))activeMeals().forEach(m=>{const sl=planSlot(tm,m.id),d=sl&&dishById(sl.id);if(d)rows.push(`<div class="home-kid"><span class="wish-em">${dishIc(d,40)}</span><span class="todo-t"><span class="todo-m">${m.l}</span><span class="ek-name">${esc(d.name)}</span></span></div>`);});
    if(modOn('aufgaben')){const n=S.aufgaben.items.filter(t=>!t.done&&t.due===tm&&todoFor(t,mp?.id||'')).length;if(n)rows.push(`<div class="home-kid"><span class="wish-em">📝</span><span class="todo-t"><span class="ek-name">${n} ${n===1?'Aufgabe':'Aufgaben'}</span></span></div>`);}
    cards.morgen=homeCard('morgen','Morgen',rows.join(''),modOn('aufgaben')?"setView('aufgaben')":"goKinder()");}
  const order=late?['termine','todo','essen','morgen','einkauf','kinder']:['termine','kinder','todo','essen','einkauf'];
  const greet=hour()<11?'Guten Morgen':hour()<17?'Hallo':'Guten Abend';
  const body=order.map(k=>cards[k]||'').join('');
  return`<div class="home-greet">${greet}${mp?`, ${esc(mp.name)}`:''}</div>${body||'<div class="sp-empty">Heute steht nichts an. 🌿</div>'}`;
}
function homeEkAdd(){const el=document.getElementById('homeEk');if(ekAdd(el?.value||'')){saveCfg();render();setTimeout(()=>document.getElementById('homeEk')?.focus(),0);toast('Auf der Einkaufsliste');}}
// Einmal fragen, wem dieses Gerät gehört (nur wenn es Erwachsene gibt)
function maybeAskWho(){if(getMe()||!(S.household?.adults||[]).length)return;try{if(localStorage.getItem('famos_me_later'))return;}catch(e){return;}
  if(!document.getElementById('mb').classList.contains('open'))openWhoModal();}

// ═══ EMOJI PICKER ═════════════════════════════
let _epCb=null;
function epOpen(cb){_epCb=cb;document.getElementById('epBg').classList.add('open');renderEp();}
function epBgClick(e){if(e.target===document.getElementById('epBg'))epClose();}
function epClose(){document.getElementById('epBg').classList.remove('open');_epCb=null;}
function setEpCat(id){UI.epCat=id;renderEp();}
function renderEp(){document.getElementById('epCats').innerHTML=EC.map(c=>`<button class="ep-cat${c.id===UI.epCat?' on':''}" onclick="setEpCat('${c.id}')">${esc(c.l)}</button>`).join('');document.getElementById('epGrid').innerHTML=(EC.find(c=>c.id===UI.epCat)?.e||[]).map(e=>`<button type="button" class="ep-em" onclick="epPick('${e}')">${e}</button>`).join('');}
function epPick(e){if(_epCb)_epCb(e);epClose();}
// Eigenes Emoji: nur Bildzeichen, keine Buchstaben oder HTML
function epOwnOk(v){const t=sEm(String(v||'').trim(),'');return t&&/\p{Extended_Pictographic}/u.test(t)&&!/[A-Za-z0-9]/.test(t)?t:'';}
function epOwnPick(){const el=document.getElementById('epOwn'),e=epOwnOk(el?.value);if(!e){toast('Bitte ein Emoji eintippen (Emoji-Tastatur).');return;}if(el)el.value='';epPick(e);}

// ═══ ELTERN-PIN ═══════════════════════════════
// Kindersicherung, kein Tresor: die PIN liegt als gesalzener Hash auf dem Gerät.
const PIN_WINDOW=120000;
let _pinCb=null;
function pinHash(pin,salt){let h=0x811c9dc5;const t=salt+':'+pin;for(let r=0;r<2000;r++){for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}h=(h^r)>>>0;}return h.toString(16).padStart(8,'0');}
function pinUnlocked(){return !S.pin||Date.now()<(UI.unlockUntil||0);}
function requirePin(cb){if(pinUnlocked()){cb();return;}UI.form={mode:'pin',pin:'',forgot:null,answer:''};openModal();_pinCb=cb;setTimeout(()=>document.getElementById('pinIn')?.focus(),50);}
function renderPinModal(){const f=UI.form;
  if(f.forgot)return`<h3>PIN vergessen</h3>
  <div style="font-size:.9rem;color:var(--muted);font-weight:700;margin-bottom:14px;line-height:1.5">Nur für Erwachsene: Wie viel ist <strong style="color:var(--text)">${f.forgot.a} × ${f.forgot.b}</strong>?</div>
  <div class="field"><label>Ergebnis</label><input id="pinIn" type="text" inputmode="numeric" autocomplete="off" maxlength="4" oninput="UI.form.answer=this.value"></div>
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="pinForgotCheck()">PIN löschen</button></div>`;
  return`<h3>🔒 Eltern-PIN</h3>
  <div class="field"><label>PIN eingeben</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="6" oninput="UI.form.pin=this.value" onkeydown="if(event.key==='Enter')pinSubmit()" style="font-size:1.3rem;letter-spacing:.3em"></div>
  <button class="quick-all" onclick="pinForgot()">PIN vergessen?</button>
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="pinSubmit()">Entsperren</button></div>`;}
function pinDone(){const cb=_pinCb;closeModal();if(cb)cb();}
function pinSubmit(){const f=UI.form,now=Date.now();
  if(now<(UI.pinBlockUntil||0)){toast('Zu viele Fehlversuche. Bitte kurz warten.');return;}
  if(S.pin&&pinHash(String(f.pin||''),S.pin.s)===S.pin.h){UI.pinFails=0;UI.unlockUntil=now+PIN_WINDOW;pinDone();return;}
  UI.pinFails=(UI.pinFails||0)+1;if(UI.pinFails>=3){UI.pinBlockUntil=now+30000;UI.pinFails=0;}
  f.pin='';const el=document.getElementById('pinIn');if(el)el.value='';toast('Falsche PIN');}
function pinForgot(){const cb=_pinCb;UI.form.forgot={a:12+Math.floor(Math.random()*8),b:6+Math.floor(Math.random()*4)};UI.form.answer='';openModal();_pinCb=cb;}
function pinForgotCheck(){const f=UI.form;
  if(parseInt(f.answer,10)!==f.forgot.a*f.forgot.b){toast('Das stimmt nicht.');pinForgot();return;}
  S.pin=null;saveCfg();UI.unlockUntil=0;pinDone();toast('PIN gelöscht. In den Einstellungen neu festlegen.');}
function openPinSetModal(){UI.form={mode:'pinSet',p1:'',p2:''};openModal();}
function renderPinSetModal(){return`<h3>Eltern-PIN festlegen</h3>
  <div class="field"><label>Neue PIN (4 bis 6 Ziffern)</label><input type="password" inputmode="numeric" autocomplete="off" maxlength="6" oninput="UI.form.p1=this.value"></div>
  <div class="field"><label>Wiederholen</label><input type="password" inputmode="numeric" autocomplete="off" maxlength="6" oninput="UI.form.p2=this.value"></div>
  <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Abbrechen</button><button class="m-save" onclick="savePin()">Speichern</button></div>`;}
function savePin(){const f=UI.form;
  if(!/^\d{4,6}$/.test(f.p1)){toast('Die PIN braucht 4 bis 6 Ziffern.');return;}
  if(f.p1!==f.p2){toast('Die beiden Eingaben stimmen nicht überein.');return;}
  const salt=uid();S.pin={s:salt,h:pinHash(f.p1,salt)};saveCfg();UI.unlockUntil=Date.now()+PIN_WINDOW;closeModal();renderAdmin();toast('Eltern-PIN gesetzt');}
function removePin(){if(!confirm('Eltern-PIN entfernen?'))return;S.pin=null;saveCfg();renderAdmin();}

let _lastBack=0;

  const open=id=>document.getElementById(id).classList.contains('open');

function setTgStatus(status){requirePin(()=>_setTgStatus(status));}
// Nochmal auf den aktiven Status tippen nimmt ihn zurück
function _setTgStatus(status,kidId,wkKey){
  const kid=kidId||UI.kid,wk=wkKey||weekKey(),key=kid+':'+wk,prev=TGD[key]||null;
  if(prev===status)status=null;
  const betrag=S.taschengeld?.[kid]?.betrag||0,kw=Number(wk.slice(5));
  // Zurücknehmen löscht die Buchung dieser Woche, statt eine Gegenbuchung anzulegen
  if(prev==='gespart'){const note=`Wochengeld gespart (KW ${kw})`;let i=-1;for(let j=TX.length-1;j>=0;j--)if(TX[j].kid===kid&&TX[j].note===note&&TX[j].amt>0){i=j;break;}
    if(i>=0){SAVINGS[kid]=Math.max(0,round2((SAVINGS[kid]||0)-TX[i].amt));TX.splice(i,1);saveSavings();saveTx();}
    else{const back=Math.min(betrag,SAVINGS[kid]||0);bookSavings(kid,-back,`Sparen zurückgenommen (KW ${kw})`);}}
  if(status==='gespart')bookSavings(kid,betrag,`Wochengeld gespart (KW ${kw})`);
  if(status)TGD[key]=status;else delete TGD[key];
  saveTgd();render();}

// Auszahlungstag: ab diesem Wochentag ist das Wochengeld fällig; offen gebliebene Wochen bleiben überfällig
function tgPayDate(wkMonday){return addDays(wkMonday,S.tgPay);}
function tgDue(){if(S.tgPay<0||!modOn('taschengeld'))return[];const td=today(),out=[];
  for(let back=0;back<=3;back++){const mon=addDays(weekDates(0)[0],-7*back),pay=tgPayDate(mon);
    if(pay>td||(S.tgPaySince&&pay<S.tgPaySince))continue;const wk=weekKeyOf(mon);
    S.kids.forEach(k=>{const tg=S.taschengeld?.[k.id];if(tg?.aktiv&&!TGD[k.id+':'+wk])out.push({kid:k,wk,pay,amt:tg.betrag,over:pay<td});});}
  return out;}
function tgDecide(kidId,wk,status){requirePin(()=>{_setTgStatus(status,kidId,wk);toast(status==='gespart'?'Ins Sparschwein':'Ausgezahlt');});}
function tgDueRows(){return tgDue().map(x=>`<div class="ek-row${x.over?' over':''}"><div class="ek-item tg-due"><span class="wish-em">${esc(x.kid.icon)}</span><span class="todo-t"><span class="ek-name">${esc(x.kid.name)} · ${fmt(x.amt)}</span><span class="todo-m">Taschengeld · ${x.over?`seit ${fmtDue(x.pay).replace('seit ','')} (KW ${Number(x.wk.slice(5))})`:'heute fällig'}</span></span></div>
  <div class="tg-due-b"><button class="tg-act" onclick="tgDecide('${x.kid.id}','${x.wk}','ausgezahlt')" aria-label="Ausgezahlt">💰</button><button class="tg-act" onclick="tgDecide('${x.kid.id}','${x.wk}','gespart')" aria-label="Sparen">🐷</button></div></div>`).join('');}

// Lokal zuerst: Die App arbeitet immer mit localStorage. Mit Anmeldung werden Änderungen zum
// Haushalt in Supabase geschoben und regelmäßig abgeholt. Zugriff regeln die RLS-Regeln der Datenbank.

let _syncBusy=false,_pushT=null,_lastDocPull=0,_conflictToast=0;
function loadAuth(){const a=lsGet('famos_auth');return a&&typeof a.access_token==='string'&&typeof a.refresh_token==='string'&&sId(String(a.user?.id||'').replace(/-/g,''))?a:null;}

function emptySync(){return{hid:null,hname:'',role:'',invite:'',ver:{},last:{},dirty:{},queue:[],status:'',err:'',at:0};}
function loadSync(){const s=lsGet('famos_sync');if(!s||typeof s!=='object')return emptySync();const e=emptySync();
  return{...e,...s,ver:sObj(s.ver),last:sObj(s.last),dirty:sObj(s.dirty),queue:Array.isArray(s.queue)?s.queue.slice(-500):[]};}
function saveSync(){lsSet('famos_sync',JSON.stringify(SYNC));}
function online(){return typeof navigator==='undefined'||navigator.onLine!==false;}

// ─── HTTP gegen Supabase ───
async function sb(path,{method='GET',body,headers={},auth=true,retry=true}={}){
  if(!SYNC_ON)throw new Error('Sync nicht eingerichtet');
  if(auth){await ensureToken();if(!AUTH)throw Object.assign(new Error('Bitte neu anmelden.'),{status:401});}
  const h={apikey:SB_KEY,'Content-Type':'application/json',...headers};
  if(auth)h.Authorization='Bearer '+AUTH.access_token;
  const r=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null;}catch(e){}
  if(r.status===401&&auth&&retry){if(await refreshToken())return sb(path,{method,body,headers,auth,retry:false});}
  if(!r.ok){const e=new Error(data?.message||data?.msg||data?.error_description||data?.error||('Fehler '+r.status));e.status=r.status;e.code=data?.code||data?.error_code||'';throw e;}
  return data;
}
function setSession(d){
  if(!d?.access_token||!d?.refresh_token||!d?.user?.id)throw new Error('Anmeldung fehlgeschlagen');
  AUTH={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(Number(d.expires_in)||3600)*1000,user:{id:d.user.id,email:sStr(d.user.email,120)}};
  saveAuth();
}
async function ensureToken(){if(AUTH&&Date.now()>AUTH.expires_at-60000)await refreshToken();}
async function refreshToken(){
  if(!AUTH)return false;
  try{setSession(await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:AUTH.refresh_token},auth:false}));rtToken();return true;}
  catch(e){if(e.status&&e.status<500){AUTH=null;saveAuth();rtStop();SYNC.status='out';saveSync();toast('Bitte neu anmelden. Deine Daten bleiben auf dem Gerät.');}return false;}
}
function authError(e){
  // Neue Registrierungen in Supabase ausgeschaltet: nur eingeladene Adressen dürfen sich anmelden
  if(/signups? (are )?not allowed|signup_disabled|otp_disabled/i.test(e.message+' '+(e.code||'')))return'Diese E-Mail-Adresse ist für den Abgleich nicht freigeschaltet. FamOS funktioniert trotzdem vollständig auf diesem Gerät; sichere deine Daten ab und zu unter ⚙️ → Haushalt → Exportieren.';
  if(e.status===429||/rate limit/i.test(e.message))return'Gerade zu viele Anmelde-Mails. Bitte in einer Stunde nochmal versuchen.';
  if(/expired|invalid/i.test(e.message)&&e.status<500)return'Der Code stimmt nicht oder ist abgelaufen.';
  if(!e.status)return'Keine Verbindung. Bist du online?';
  return'Das hat nicht geklappt ('+e.message+').';
}

// Supabase-Link aus der Mail (…/auth/v1/verify?token=…&type=…): Token-Hash direkt einlösen, ohne den Link zu öffnen
function parseMailLink(raw){
  let u;try{u=new URL(String(raw||'').trim());}catch(e){return null;}
  if(u.origin!==SB_URL||u.pathname!=='/auth/v1/verify')return null;
  const token=u.searchParams.get('token')||'',type=u.searchParams.get('type')||'magiclink';
  if(!/^[A-Za-z0-9_-]{10,200}$/.test(token)||!/^(magiclink|signup|email|invite)$/.test(type))return null;
  return{token,type};
}
async function loginVerify(){const f=UI.form;
  if(String(f.link||'').trim()&&!String(f.code||'').trim())return loginWithLink();
  const token=String(f.code||'').replace(/\D/g,'');
  if(token.length<6){loginBusy(false,'Bitte den Link aus der Mail einfügen oder den Code eintragen (mindestens 6 Ziffern).');return;}
  loginBusy(true);
  try{let d;try{d=await sb('/auth/v1/verify',{method:'POST',body:{type:'email',email:f.email,token},auth:false});}
      catch(e){if(e.status>=500||!e.status)throw e;d=await sb('/auth/v1/verify',{method:'POST',body:{type:'signup',email:f.email,token},auth:false});}
    setSession(d);refreshAll();await afterLogin();}
  catch(e){loginBusy(false,authError(e));}
}
async function loginWithLink(){const f=UI.form,l=parseMailLink(f.link);
  if(!l){loginBusy(false,'Das ist kein FamOS-Anmeldelink. Bitte den Link aus der Supabase-Mail kopieren.');return;}
  loginBusy(true);
  try{let d;try{d=await sb('/auth/v1/verify',{method:'POST',body:{type:l.type,token_hash:l.token},auth:false});}
      catch(e){if(e.status>=500||!e.status||l.type==='email')throw e;d=await sb('/auth/v1/verify',{method:'POST',body:{type:'email',token_hash:l.token},auth:false});}
    setSession(d);f.link='';refreshAll();await afterLogin();}
  catch(e){loginBusy(false,/expired|invalid/i.test(e.message)&&e.status<500?'Der Link ist abgelaufen oder wurde schon benutzt. Bitte „Andere E-Mail oder neue Mail“ wählen und neu anfordern.':authError(e));}
}
// Anmelden mit Passwort (ohne Mail). Das Passwort bleibt nur im Formular und wird nirgends gespeichert.
function pwError(e){
  if(/invalid_credentials|invalid login/i.test((e.code||'')+' '+e.message))return'E-Mail-Adresse oder Passwort stimmt nicht.';
  if(/email_not_confirmed|not confirmed/i.test((e.code||'')+' '+e.message))return'Dieses Konto ist noch nicht bestätigt. Bitte die Person fragen, die dich eingeladen hat.';
  if(/same_password|different from the old/i.test((e.code||'')+' '+e.message))return'Das neue Passwort ist dasselbe wie das alte.';
  if(/weak_password/i.test((e.code||'')+' '+e.message))return'Das Passwort ist zu schwach. Bitte ein längeres wählen.';
  if(/reauthentication|current_password|nonce/i.test((e.code||'')+' '+e.message))return'Zur Sicherheit bitte abmelden, neu anmelden und es direkt danach nochmal versuchen.';
  if(e.status===429||/rate limit/i.test(e.message))return'Zu viele Versuche. Bitte kurz warten.';
  if(!e.status)return'Keine Verbindung. Bist du online?';
  return'Das hat nicht geklappt ('+e.message+').';}
async function loginPassword(){const f=UI.form,email=String(f.email||'').trim(),password=String(f.pw||'');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){loginBusy(false,'Bitte eine gültige E-Mail-Adresse eingeben.');return;}
  if(!password){loginBusy(false,'Bitte das Passwort eingeben.');return;}
  f.email=email;loginBusy(true);
  try{const d=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});f.pw='';setSession(d);refreshAll();await afterLogin();}
  catch(e){f.pw='';loginBusy(false,pwError(e));}
}

// Verbinden: Server hat schon Daten → übernehmen; Server leer → eigene Daten hochladen
async function connectHousehold(h,role,{upload=false,replace=false}={}){
  SYNC={...emptySync(),hid:h.id,hname:sStr(h.name,40),role:role||'adult',invite:sStr(h.invite_code,12),status:'ok'};saveSync();
  const docs=await sb(`/rest/v1/docs?select=key,version,data&household_id=eq.${h.id}`);
  if(!upload&&docs?.length){
    if(!replace&&S.household&&!confirm('In der Cloud gibt es schon Daten für diesen Haushalt. Sie ersetzen die Daten auf diesem Gerät. Fortfahren?')){
      SYNC=emptySync();saveSync();throw new Error('abgebrochen');}
    docs.forEach(d=>applyRemote(d.key,d.data,d.version));
    S.einkauf.items=[];S.aufgaben.items=[];S.kalender.items=[];
    IMG.t={};IMG.rev={};IMG.full=null;imgCss();try{await imgDbClear();}catch(e){}
  }else{SYNC_KEYS.forEach(k=>{SYNC.dirty[k]=true;});
    S.einkauf.items.forEach(it=>SYNC.queue.push({op:'up',item:{...it}}));
    S.aufgaben.items.forEach(t=>SYNC.queue.push({t:'tasks',op:'up',item:{...t}}));
    S.kalender.items.forEach(e=>SYNC.queue.push({t:'events',op:'up',item:{...e}}));
    Object.keys(IMG.t).forEach(id=>SYNC.queue.push({t:'img',op:'up',id}));}
  saveSync();await syncNow(true);
  UI.kid=S.kids[0]?.id||null;UI.rt=firstActiveRt();UI.ob=null;refreshAll();rtStop();rtStart();
}

// ─── Dokumente: was geht in welchen Bereich ───
function docOf(k){
  if(k==='cfg'){const c=JSON.parse(JSON.stringify(S));delete c.installHintDone;c.einkauf={recent:S.einkauf.recent,cats:S.einkauf.cats,order:S.einkauf.order,std:S.einkauf.std};delete c.aufgaben;delete c.kalender;return c;}
  return k==='day'?D:k==='tgd'?TGD:k==='savings'?SAVINGS:TX;
}
function applyRemote(k,data,version){
  if(k==='cfg'){const c=sanitizeCfg({...data,installHintDone:S.installHintDone,einkauf:{...sObj(data?.einkauf),items:S.einkauf.items},aufgaben:S.aufgaben,kalender:S.kalender});if(c){S=c;lsSet('ra_cfg3',JSON.stringify(S));}}
  else if(k==='day'){const d=sanitizeDay(data);if(d.date===today()){D=d;lsSet('ra_day3',JSON.stringify(D));}}
  else if(k==='tgd'){TGD=sanitizeTgd(data);lsSet('ra_tgd',JSON.stringify(TGD));}
  else if(k==='savings'){SAVINGS=sanitizeSavings(data);lsSet('ra_savings',JSON.stringify(SAVINGS));}
  else if(k==='tx'){TX=sanitizeTx(data);lsSet('ra_tx',JSON.stringify(TX));}
  SYNC.ver[k]=version;SYNC.last[k]=JSON.stringify(docOf(k));delete SYNC.dirty[k];
}
// Gleichzeitige Änderung auf zwei Geräten: zusammenführen, wo es eindeutig geht, sonst gilt der Cloud-Stand
function deepMerge(a,b){if(!a||typeof a!=='object'||Array.isArray(a)||!b||typeof b!=='object'||Array.isArray(b))return b;const o={...a};Object.keys(b).forEach(k=>{o[k]=deepMerge(a[k],b[k]);});return o;}
function mergeDoc(k,local,remote){
  if(k==='day')return remote?.date===local.date?deepMerge(remote,local):local;
  if(k==='tgd')return{...sObj(remote),...local};
  if(k==='tx'){const seen=new Set(),all=[...sArr(remote,400),...local].filter(x=>{const id=[x?.t,x?.kid,x?.amt,x?.note].join('|');if(seen.has(id))return false;seen.add(id);return true;});return all.sort((a,b)=>a.t-b.t).slice(-200);}
  return null; // cfg, savings: Cloud gewinnt
}
function markDirty(k){if(!SYNC?.hid)return;SYNC.dirty[k]=true;saveSync();schedulePush();}
function schedulePush(){clearTimeout(_pushT);_pushT=setTimeout(()=>syncNow(false),800);}
async function pushDoc(k){
  for(let i=0;i<3;i++){
    const local=docOf(k),json=JSON.stringify(local);
    if(json===SYNC.last[k]){delete SYNC.dirty[k];return;}
    const v=SYNC.ver[k];let rows;
    if(v==null){
      try{rows=await sb('/rest/v1/docs',{method:'POST',headers:{Prefer:'return=representation'},body:{household_id:SYNC.hid,key:k,data:local}});}
      catch(e){if(e.status!==409&&e.code!=='23505')throw e;rows=[];}
    }else rows=await sb(`/rest/v1/docs?household_id=eq.${SYNC.hid}&key=eq.${k}&version=eq.${v}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:{data:local}});
    if(rows?.length){SYNC.ver[k]=rows[0].version;SYNC.last[k]=json;delete SYNC.dirty[k];return;}
    // Konflikt: jemand war schneller
    const [r]=await sb(`/rest/v1/docs?select=version,data&household_id=eq.${SYNC.hid}&key=eq.${k}`);
    if(!r){SYNC.ver[k]=null;continue;}
    const merged=mergeDoc(k,local,r.data);
    applyRemote(k,merged??r.data,r.version);
    if(merged==null){if(Date.now()-_conflictToast>10000){_conflictToast=Date.now();toast('Auf einem anderen Gerät wurde gerade etwas geändert. Der neue Stand ist übernommen.');}return;}
    SYNC.dirty[k]=true;SYNC.last[k]='';
  }
}
async function pullDocs(){
  const vs=await sb(`/rest/v1/docs?select=key,version&household_id=eq.${SYNC.hid}`)||[];
  const changed=vs.filter(x=>SYNC.ver[x.key]!==x.version).map(x=>x.key).filter(k=>SYNC_KEYS.includes(k));
  if(!changed.length)return false;
  const rows=await sb(`/rest/v1/docs?select=key,version,data&household_id=eq.${SYNC.hid}&key=in.(${changed.join(',')})`)||[];
  rows.forEach(r=>{if(SYNC.dirty[r.key]){const m=mergeDoc(r.key,docOf(r.key),r.data);applyRemote(r.key,m??r.data,r.version);if(m!=null){SYNC.dirty[r.key]=true;SYNC.last[r.key]='';}}
    else applyRemote(r.key,r.data,r.version);});
  return rows.length>0;
}

function ekOp(op,item){if(!SYNC?.hid)return;SYNC.queue.push(op==='del'?{op,id:item.id}:{op,item:{id:item.id,name:item.name,n:item.n,done:!!item.done}});if(SYNC.queue.length>500)SYNC.queue=SYNC.queue.slice(-500);saveSync();schedulePush();}
async function flushQueue(){
  while(SYNC.queue.length){const q=SYNC.queue[0];
    if(q.t==='img'){ // Foto: die Daten liegen in IndexedDB, in der Warteschlange steht nur die Gericht-ID
      try{
        if(q.op==='up'){const r=await imgDbGet(q.id),t=sImg(r?.t,IMG_T),f=sImg(r?.f,IMG_F);
          if(t&&f)await sb('/rest/v1/dish_images?on_conflict=household_id,dish_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{household_id:SYNC.hid,dish_id:q.id,thumb:t,photo:f,rev:sStr(r.rev,20)}});}
        else await sb(`/rest/v1/dish_images?household_id=eq.${SYNC.hid}&dish_id=eq.${encodeURIComponent(q.id)}`,{method:'DELETE'});
      }catch(e){if(e.status!==404)throw e;SYNC.imgMissing=true;} // Tabelle fehlt noch (005): Fotos bleiben lokal
      SYNC.queue.shift();saveSync();continue;}
    const tbl=q.t==='tasks'?'tasks':q.t==='events'?'events':'shopping_items';
    const body=q.op==='up'?(tbl==='events'?{household_id:SYNC.hid,id:q.item.id,title:q.item.title,day:q.item.day,end_day:q.item.end||null,t_from:q.item.from,t_to:q.item.to,place:q.item.place,note:q.item.note,who:q.item.who,rep:q.item.rep,...(evNoSkip()?{}:{skip:q.item.skip||[]})}:tbl==='tasks'?{household_id:SYNC.hid,id:q.item.id,title:q.item.title,note:q.item.note,who:q.item.who,due:q.item.due||null,rep:q.item.rep,done:q.item.done,done_by:q.item.doneBy,done_at:q.item.doneAt||null}:{household_id:SYNC.hid,...q.item}):null;
    try{
      if(q.op==='up')await sb(`/rest/v1/${tbl}?on_conflict=household_id,id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body});
      else await sb(`/rest/v1/${tbl}?household_id=eq.${SYNC.hid}&id=eq.${encodeURIComponent(q.id)}`,{method:'DELETE'});
    }catch(e){if(tbl==='events'&&q.op==='up'&&!evNoSkip()&&evSkipErr(e)){evNoSkipNow();continue;} // nochmal ohne Ausfälle
      if(tbl==='shopping_items'||e.status!==404)throw e;if(tbl==='tasks')SYNC.tasksMissing=true;else SYNC.eventsMissing=true;} // Tabelle fehlt noch: Aufgaben bzw. Termine bleiben lokal, Rest läuft weiter
    SYNC.queue.shift();saveSync();}
}

const EV_SEL='id,title,day,end_day,t_from,t_to,place,note,who,rep';
// Spalte skip fehlt (006 noch nicht eingespielt): 10 Minuten lang ohne sie abgleichen, dann neu versuchen
function evNoSkip(){return!!SYNC.evNoSkip&&Date.now()-SYNC.evNoSkip<6e5;}
function evSkipErr(e){return e.status===400&&/skip/.test(e.message||'');}
function evNoSkipNow(){SYNC.evNoSkip=Date.now();SYNC.evSkipLost=true;saveSync();}
async function pullEvents(){
  if(!modOn('kalender'))return false;

  if(SYNC.eventsMissing){SYNC.eventsMissing=false;S.kalender.items.forEach(e=>SYNC.queue.push({t:'events',op:'up',item:{...e}}));saveSync();await flushQueue();rows=await get()||[];}

// ─── Sofort-Übertragung (Supabase Realtime, Phoenix-Protokoll) ───
// Die Meldung löst nur ein Abholen aus; Daten kommen weiter über die REST-Schnittstelle mit RLS.
const RT={ws:null,ref:0,joinRef:null,joined:false,hb:null,timer:null,retry:0,poke:null};
function rtTopic(){return'realtime:famos-'+SYNC.hid;}
function rtUrl(){return SB_URL.replace(/^https:/,'wss:')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0';}
function rtSend(m,join){const ws=RT.ws;if(!ws||ws.readyState!==1)return;m.ref=String(++RT.ref);
  if(join){RT.joinRef=m.ref;m.join_ref=m.ref;}else if(m.topic!=='phoenix')m.join_ref=RT.joinRef;
  try{ws.send(JSON.stringify(m));}catch(e){}}
function rtStart(){
  if(!SYNC_ON||!AUTH||!SYNC.hid||RT.ws||typeof WebSocket==='undefined'||!online())return;
  clearTimeout(RT.timer);let ws;try{ws=new WebSocket(rtUrl());}catch(e){return;}
  RT.ws=ws;RT.joined=false;
  ws.onopen=()=>{
    rtSend({topic:rtTopic(),event:'phx_join',payload:{access_token:AUTH.access_token,config:{broadcast:{self:false},presence:{key:''},private:false,
      postgres_changes:[{event:'*',schema:'public',table:'docs',filter:'household_id=eq.'+SYNC.hid},{event:'*',schema:'public',table:'shopping_items',filter:'household_id=eq.'+SYNC.hid},{event:'*',schema:'public',table:'tasks',filter:'household_id=eq.'+SYNC.hid},...(SYNC.eventsOk?[{event:'*',schema:'public',table:'events',filter:'household_id=eq.'+SYNC.hid}]:[]),...(SYNC.imgOk?[{event:'*',schema:'public',table:'dish_images',filter:'household_id=eq.'+SYNC.hid}]:[])]}}},true);
    clearInterval(RT.hb);RT.hb=setInterval(()=>rtSend({topic:'phoenix',event:'heartbeat',payload:{}}),25000);
  };
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.topic!==rtTopic())return;
    if(m.event==='phx_reply'&&m.ref===RT.joinRef){RT.joined=m.payload?.status==='ok';if(RT.joined){RT.retry=0;rtPoke();}}
    else if(m.event==='postgres_changes')rtPoke();
    else if((m.event==='system'&&m.payload?.status==='error')||m.event==='phx_error'||m.event==='phx_close'){RT.joined=false;try{ws.close();}catch(e){}}
  };
  ws.onclose=()=>{clearInterval(RT.hb);RT.ws=null;RT.joined=false;
    if(!AUTH||!SYNC.hid)return;RT.timer=setTimeout(rtStart,Math.min(60000,1000*2**RT.retry++));};
  ws.onerror=()=>{try{ws.close();}catch(e){}};
}
function rtStop(){clearTimeout(RT.timer);clearInterval(RT.hb);clearTimeout(RT.poke);const ws=RT.ws;RT.ws=null;RT.joined=false;RT.retry=0;
  if(ws){ws.onclose=null;try{ws.close();}catch(e){}}}
function rtPoke(){clearTimeout(RT.poke);RT.poke=setTimeout(()=>syncNow(true),250);}
function rtToken(){if(RT.joined&&AUTH)rtSend({topic:rtTopic(),event:'access_token',payload:{access_token:AUTH.access_token}});}

// ─── Ein Abgleich-Durchlauf ───
async function syncNow(force){
  if(!SYNC_ON||!AUTH||!SYNC.hid||_syncBusy)return;
  if(!online()){SYNC.status='offline';return;}
  _syncBusy=true;let changed=false;
  try{
    for(const k of SYNC_KEYS)if(SYNC.dirty[k])await pushDoc(k);
    await flushQueue();
    const now=Date.now();
    if(force||now-_lastDocPull>15000||UI.view==='einkauf'){_lastDocPull=now;if(await pullDocs())changed=true;}
    if(await pullItems())changed=true;
    if(await pullTasks())changed=true;
    if(await pullEvents())changed=true;
    if(await pullImgs())changed=true;
    SYNC.status='ok';SYNC.err='';SYNC.at=now;
  }catch(e){
    SYNC.status=!e.status?'offline':e.status===401?'out':'err';SYNC.err=e.message||'';
    if(e.status===403||/row-level|permission/i.test(e.message)){rtStop();SYNC=emptySync();toast('Kein Zugriff mehr auf den Haushalt. Abgleich beendet.');changed=true;}
  }finally{_syncBusy=false;saveSync();}
  if(changed)softRender();else if(force)render();
}

function readAuthHash(){
  const h=W?.location?.hash||'';if(!/access_token=|error_description=/.test(h))return false;
  const p=new URLSearchParams(h.slice(1));
  try{W.history?.replaceState?.(null,'',W.location.pathname+W.location.search);}catch(e){}
  if(p.get('error_description')){toast('Anmeldung fehlgeschlagen: '+p.get('error_description'));return false;}
  AUTH={access_token:p.get('access_token'),refresh_token:p.get('refresh_token')||'',expires_at:Date.now()+(Number(p.get('expires_in'))||3600)*1000,user:{id:'',email:''}};
  return true;
}
async function finishHashLogin(){try{const u=await sb('/auth/v1/user');AUTH.user={id:u.id,email:sStr(u.email,120)};saveAuth();await afterLogin();}catch(e){AUTH=null;saveAuth();toast('Anmeldung fehlgeschlagen. Bitte mit Code anmelden.');}}

// ═══ APP INSTALLIEREN ═════════════════════════
// Android/Chrome: echter Installations-Dialog (beforeinstallprompt). iPhone: Apple erlaubt das nicht, daher Anleitung.
const W=typeof window!=='undefined'?window:null;
let _bip=null;
function isStandalone(){try{return !!(W?.matchMedia?.('(display-mode: standalone)')?.matches||W?.navigator?.standalone);}catch(e){return false;}}
function platform(){const n=typeof navigator!=='undefined'?navigator:{},ua=n.userAgent||'';
  if(/iphone|ipad|ipod/i.test(ua)||(/macintosh/i.test(ua)&&n.maxTouchPoints>1))return'ios';if(/android/i.test(ua))return'android';return'other';}
function canInstallHint(){return !isStandalone()&&!S.installHintDone;}
// Einmal pro Gerät von selbst fragen (nach dem Onboarding oder beim ersten Start mit fertigem Haushalt)
function maybeAskInstall(){if(!S.household||!canInstallHint())return;try{if(localStorage.getItem('famos_install_asked'))return;localStorage.setItem('famos_install_asked','1');}catch(e){return;}setTimeout(openInstallModal,500);}
function installNow(){if(!_bip){openInstallModal();return;}const e=_bip;_bip=null;closeModal();
  Promise.resolve(e.prompt()).then(()=>e.userChoice).then(r=>{if(r?.outcome==='accepted'){S.installHintDone=true;saveCfg();}render();}).catch(()=>render());}
function openInstallModal(){if(isStandalone())return;UI.form={mode:'install'};openModal();}
const SHARE_ICON='<svg class="ins-ico" viewBox="0 0 24 24" aria-label="Teilen-Symbol"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function renderInstallModal(){const p=platform();
  const steps=p==='ios'?[`In Safari unten (in Chrome oben) auf ${SHARE_ICON} <strong>Teilen</strong> tippen.`,'Nach unten wischen und <strong>„Zum Home-Bildschirm“</strong> wählen.','Oben rechts auf <strong>„Hinzufügen“</strong> tippen.']
    :p==='android'?['Oben rechts auf <strong>⋮</strong> (Menü) tippen.','<strong>„App installieren“</strong> oder <strong>„Zum Startbildschirm hinzufügen“</strong> wählen.','Mit <strong>„Installieren“</strong> bestätigen.']
    :['Diese Seite am besten auf dem Handy öffnen.','Am Computer: im Browser-Menü <strong>„App installieren“</strong> wählen, falls angeboten.'];
  return`<h3>📲 FamOS als App</h3>
  <div class="ins-why">Dann liegt FamOS als Icon auf dem Startbildschirm, startet ohne Browserleiste und funktioniert auch offline.</div>
  ${_bip?`<button class="m-save ins-now" onclick="installNow()">Jetzt installieren</button>`:`<ol class="ins-steps">${steps.map(t=>`<li><span>${t}</span></li>`).join('')}</ol>`}
  <div class="m-btns"><button class="m-cancel" onclick="dismissInstall()">Nicht mehr zeigen</button><button class="m-save" onclick="closeModal()">Später</button></div>`;}


// Admin actions
function openAdmin(){requirePin(_openAdmin);}
function _openAdmin(){renderAdmin();requestAnimationFrame(()=>document.getElementById('adm').classList.add('open'));}
function closeAdmin(){UI.unlockUntil=0;document.getElementById('adm').classList.remove('open');setTimeout(()=>{UI.rt=firstActiveRt();if(!UI.kid||!S.kids.find(k=>k.id===UI.kid))UI.kid=S.kids[0]?.id;render();},340);}
function setATab(t){UI.aTab=t;renderAdmin();}
function setARt(id){UI.aRt=id;renderAdmin();}
function setASpKid(id){UI.aSpKid=id;renderAdmin();}
function setASpDay(d){UI.aSpDay=d;renderAdmin();}
function togRtActive(id){const r=S.routines[id];if(r.active&&Object.values(S.routines).filter(rt=>rt.active).length<=1){toast('Mindestens eine Routine muss aktiv sein!');return;}r.active=!r.active;saveCfg();renderAdmin();}
function togBrot(id){S.routines[id].brot=!S.routines[id].brot;saveCfg();renderAdmin();}
function togWahl(id){S.routines[id].wahl=!S.routines[id].wahl;saveCfg();renderAdmin();}
function togTgAktiv(kidId){if(!S.taschengeld)S.taschengeld={};if(!S.taschengeld[kidId])S.taschengeld[kidId]={betrag:1,aktiv:false};S.taschengeld[kidId].aktiv=!S.taschengeld[kidId].aktiv;saveCfg();renderAdmin();}

// ═══ PWA ══════════════════════════════════════
(()=>{const m={name:'FamOS',short_name:'FamOS',start_url:'.',display:'standalone',background_color:'#F4EDE1',theme_color:'#F4EDE1',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23F4EDE1'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml'}]};const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);})();

// ═══ INIT ═════════════════════════════════════
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(dayGuard())render();syncNow(true);if(typeof rtStart==='function')rtStart();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(document.getElementById('epBg').classList.contains('open'))epClose();else closeModal();});
applyLook();
UI.kid=S.kids[0]?.id;
UI.rt=firstActiveRt();
UI.spDay=todayDow();
restoreUiState();
if(W?.history?.replaceState){try{W.history.replaceState({famos:0},'');}catch(e){}navGuard();W.addEventListener('popstate',onBack);}
UI.aSpKid=S.kids[0]?.id;
W?.addEventListener?.('beforeinstallprompt',e=>{e.preventDefault();_bip=e;render();});
W?.addEventListener?.('appinstalled',()=>{_bip=null;S.installHintDone=true;saveCfg();closeModal();render();toast('FamOS ist installiert');});
// Offline-Start und schnelle Updates; nur auf der echten Adresse (https), nicht beim lokalen Öffnen
if(W&&typeof navigator!=='undefined'&&navigator.serviceWorker&&W.location?.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
imgLoad();
if(SYNC_ON){
  if(readAuthHash())finishHashLogin();
  else if(AUTH&&SYNC.hid){syncNow(true);rtStart();}
  setInterval(()=>{if(typeof document!=='undefined'&&document.hidden)return;if(RT.joined&&Date.now()-SYNC.at<30000)return;syncNow(false);},5000);
  W?.addEventListener?.('online',()=>{syncNow(true);rtStart();});
}
maybeAskInstall();
</script>
